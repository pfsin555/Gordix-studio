        function calculateReliefToolpaths(groupScale) {
            if (!loadedImageCanvas) return;
            const selectedArr = Array.from(selectedIndices);
            if (selectedArr.length === 0) return;

            const firstIdx = selectedArr[0];
            const cfg = parts[firstIdx].jobConfig;
            const targetLayer = cfg.carveLayer || document.getElementById('vcarve-layer-select')?.value || 'even';

            const imgW = loadedImageCanvas.width;
            const imgH = loadedImageCanvas.height;
            const ctx = loadedImageCanvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, imgW, imgH).data;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            parts[firstIdx].rawPath.forEach(pt => {
                minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
                minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
            });
            const mmW = (maxX - minX) * groupScale;
            const mmH = (maxY - minY) * groupScale;

            const toolDia = cfg.d || 6.0;
            const toolRadius = toolDia / 2.0;
            const isBallNose = (cfg.toolType === 'ballnose');
            const stepover = Math.max(0.10, cfg.overlap || (0.3 * toolDia));
            const maxDepth = cfg.depth || 3.0;
            const scanAngle = parseInt(cfg.pathAngle || 0);

            function getPixelGray(xMM, yMM) {
                const px = Math.floor((xMM / mmW) * imgW);
                const py = Math.floor(((mmH - yMM) / mmH) * imgH);
                if (px < 0 || px >= imgW || py < 0 || py >= imgH) return 255;
                const idx = (py * imgW + px) * 4;
                const r = imgData[idx], g = imgData[idx+1], b = imgData[idx+2];
                return 0.299 * r + 0.587 * g + 0.114 * b;
            }

            function grayToRawDepth(gray) {
                let norm = gray / 255.0; 
                if (targetLayer === 'even') {
                    return -maxDepth * (1.0 - norm);
                } else {
                    return -maxDepth * norm;
                }
            }

            let nbOffsets = null;
            function getCompensatedZ(xMM, yMM) {
                const baseZ = grayToRawDepth(getPixelGray(xMM, yMM));
                if (!isBallNose) return baseZ;

                let maxZ = baseZ;
                const rMax = toolRadius;
                if (rMax <= 0.05) return baseZ;

                // 動態調整鄰域採樣點，精確進行 3D 球頭刀 Drop-Cutter 補償（避免過度深挖與誤削周圍高點）
                // 鄰域偏移量與球面高度差只與刀具/解析度有關，建立一次後重複使用
                if (!nbOffsets) {
                    const sampleSteps = Math.min(8, Math.max(4, Math.ceil(rMax / Math.max(0.2, res))));
                    const stepMM = rMax / sampleSteps;
                    const list = [];
                    for (let dx = -sampleSteps; dx <= sampleSteps; dx++) {
                        for (let dy = -sampleSteps; dy <= sampleSteps; dy++) {
                            if (dx === 0 && dy === 0) continue;
                            const rx = dx * stepMM;
                            const ry = dy * stepMM;
                            const distSq = rx * rx + ry * ry;
                            if (distSq <= rMax * rMax) {
                                list.push(rx, ry, toolRadius - Math.sqrt(Math.max(0, toolRadius * toolRadius - distSq)));
                            }
                        }
                    }
                    nbOffsets = list;
                }

                for (let k = 0; k < nbOffsets.length; k += 3) {
                    const neighborGray = getPixelGray(xMM + nbOffsets[k], yMM + nbOffsets[k + 1]);
                    const neighborZ = grayToRawDepth(neighborGray);
                    const compZ = neighborZ - nbOffsets[k + 2];
                    // 修正：當鄰近點算出的刀尖 Z 較高 (較不深) 時，必須提升刀尖高度 (取 maxZ) 以防過切/防撞高點
                    if (compZ > maxZ) {
                        maxZ = compZ;
                    }
                }
                return Math.max(-maxDepth, Math.min(0, maxZ));
            }

            const res = Math.max(0.05, cfg.resolution || 0.2);
            const toolpaths = [];

            if (scanAngle === 0) {
                const ySteps = Math.ceil(mmH / stepover);
                for (let i = 0; i <= ySteps; i++) {
                    const curY = Math.min(mmH, i * stepover);
                    const line = [];
                    const xSteps = Math.ceil(mmW / res);
                    const isReverse = (i % 2 === 1);

                    for (let j = 0; j <= xSteps; j++) {
                        const curX = isReverse ? (mmW - j * res) : (j * res);
                        const clampedX = Math.max(0, Math.min(mmW, curX));
                        const z = getCompensatedZ(clampedX, curY);
                        line.push({ x: clampedX - mmW/2, y: curY - mmH/2, z: z });
                    }
                    toolpaths.push(cleanPath(line, res));
                }
            } else if (scanAngle === 90) {
                const xSteps = Math.ceil(mmW / stepover);
                for (let i = 0; i <= xSteps; i++) {
                    const curX = Math.min(mmW, i * stepover);
                    const line = [];
                    const ySteps = Math.ceil(mmH / res);
                    const isReverse = (i % 2 === 1);

                    for (let j = 0; j <= ySteps; j++) {
                        const curY = isReverse ? (mmH - j * res) : (j * res);
                        const clampedY = Math.max(0, Math.min(mmH, curY));
                        const z = getCompensatedZ(curX, clampedY);
                        line.push({ x: curX - mmW/2, y: clampedY - mmH/2, z: z });
                    }
                    toolpaths.push(cleanPath(line, res));
                }
            } else {
                const rad = (scanAngle * Math.PI) / 180;
                const cosA = Math.cos(rad), sinA = Math.sin(rad);
                const diag = Math.sqrt(mmW * mmW + mmH * mmH);
                
                const steps = Math.ceil(diag * 2 / stepover);
                for (let i = -steps/2; i <= steps/2; i++) {
                    const offset = i * stepover;
                    const line = [];
                    const sampleSteps = Math.ceil(diag / res);
                    const isReverse = (Math.abs(Math.floor(i)) % 2 === 1);

                    for (let j = 0; j <= sampleSteps; j++) {
                        const t = isReverse ? (diag / 2 - j * res) : (-diag / 2 + j * res);
                        const curX = mmW/2 + t * cosA - offset * sinA;
                        const curY = mmH/2 + t * sinA + offset * cosA;

                        if (curX >= 0 && curX <= mmW && curY >= 0 && curY <= mmH) {
                            const z = getCompensatedZ(curX, curY);
                            line.push({ x: curX - mmW/2, y: curY - mmH/2, z: z });
                        }
                    }
                    if (line.length >= 2) {
                        toolpaths.push(cleanPath(line, res));
                    }
                }
            }

            parts[firstIdx].toolpath = toolpaths;
            parts[firstIdx].appliedMethod = 'relief25d';

            selectedArr.forEach(idx => {
                if (idx !== firstIdx) {
                    parts[idx].toolpath = [];
                    parts[idx].appliedMethod = 'relief25d';
                }
            });
        }

        function calculateAllVCarvePaths(groupScale) {
            const selectedArr = Array.from(selectedIndices);
            if (selectedArr.length === 0) return;

            const isRelief = document.getElementById('relief-25d-check')?.checked;
            if (isRelief) {
                calculateReliefToolpaths(groupScale);
                return;
            }

            const isLineVCarve = document.getElementById('line-vcarve-check')?.checked;

            if (isLineVCarve) {
                parts.forEach((p, idx) => {
                    if (selectedIndices.has(idx) && p.visible) {
                        const depth = p.jobConfig.depth || 3.0;
                        const linePath = p.rawPath.map(pt => ({
                            x: pt.x * groupScale,
                            y: pt.y * groupScale,
                            z: -depth
                        }));
                        if (linePath.length > 2 && (linePath[0].x !== linePath[linePath.length-1].x || linePath[0].y !== linePath[linePath.length-1].y)) {
                            linePath.push({ ...linePath[0] });
                        }
                        p.toolpath = [cleanPath(linePath, p.jobConfig.resolution)];
                        p.appliedMethod = 'line_vcarve';
                    } else {
                        p.toolpath = [];
                    }
                });
                return;
            }

            const targetLayer = document.getElementById('vcarve-layer-select')?.value || 'even';
            const topo = computePartNestingTopology();
            const depths = topo.depths;
            const parents = topo.parents;

            const firstIdx = selectedArr[0];
            const cfg = parts[firstIdx].jobConfig;
            
            const nestedShapes = [];

            selectedArr.forEach(idx => {
                const depth = depths[idx];
                const isCarve = (targetLayer === 'even' && depth % 2 === 0) || (targetLayer === 'odd' && depth % 2 !== 0);
                
                if (isCarve) {
                    const outer = parts[idx].rawPath.map(pt => ({ x: pt.x * groupScale, y: pt.y * groupScale }));
                    const holes = [];
                    
                    parts.forEach((childPart, childIdx) => {
                        if (childPart.visible && parents[childIdx] === idx) {
                            const childDepth = depths[childIdx];
                            const isChildCarve = (targetLayer === 'even' && childDepth % 2 === 0) || (targetLayer === 'odd' && childDepth % 2 !== 0);
                            if (!isChildCarve) {
                                const holePath = childPart.rawPath.map(pt => ({ x: pt.x * groupScale, y: pt.y * groupScale }));
                                holes.push(holePath);
                            }
                        }
                    });
                    
                    nestedShapes.push({ outer, holes });
                }
            });

            if (nestedShapes.length === 0) {
                selectedArr.forEach(idx => {
                    parts[idx].toolpath = [];
                    parts[idx].appliedMethod = 'vcarve';
                });
                return;
            }

            const D_max = cfg.depth; 
            const theta = cfg.vbitAngle || 90;
            const tanHalf = Math.tan((theta / 2) * Math.PI / 180);
            const isBallNose = (cfg.toolType === 'ballnose');
            const toolRadius = cfg.d / 2.0;
            const r_max = isBallNose ? (D_max >= toolRadius ? toolRadius : Math.sqrt(Math.max(0, 2 * toolRadius * D_max - D_max * D_max))) : Math.min(toolRadius, D_max * tanHalf);

            let cannotExecuteVCarve = false;
            const consolidatedPaths = [];

            for (const shape of nestedShapes) {
                const spineStrokes = computeNestedVCarve2(shape, cfg);

                // 檢查是否包含無法由 XYZ 同動 V 雕刻 (r > r_max) 加工的過寬區域
                for (const stroke of spineStrokes) {
                    for (const pt of stroke) {
                        if (pt.r > r_max + 1e-3) {
                            cannotExecuteVCarve = true;
                            break;
                        }
                    }
                    if (cannotExecuteVCarve) break;
                }

                if (cannotExecuteVCarve) break;
                for (let k = 0; k < spineStrokes.length; k++) consolidatedPaths.push(spineStrokes[k]);
            }

            // 若加工參數無法涵蓋完全面積，不產生路徑並提示使用者調整參數
            if (cannotExecuteVCarve) {
                selectedArr.forEach(idx => {
                    parts[idx].toolpath = [];
                    parts[idx].appliedMethod = 'vcarve';
                });
                const errorMsg = i18n[currentLang]?.vcarveErrorMsg || "目前配置無法執行V 雕刻。請增加加工深度、刀具角度或直徑，或調低整體寬";
                showMessageBox(errorMsg);
                return;
            }

            // 每條路徑的最高 Z 只計算一次 (原本在比較函式內重複計算，且對長路徑展開參數會有溢位風險)
            const keyedPaths = consolidatedPaths.map(path => {
                let maxZ = -Infinity;
                for (let k = 0; k < path.length; k++) maxZ = Math.max(maxZ, path[k].z !== undefined ? path[k].z : 0);
                return { path, maxZ };
            });
            keyedPaths.sort((a, b) => b.maxZ - a.maxZ);
            for (let k = 0; k < keyedPaths.length; k++) consolidatedPaths[k] = keyedPaths[k].path;

            selectedArr.forEach(idx => {
                if (idx === firstIdx) {
                    parts[idx].toolpath = consolidatedPaths;
                    parts[idx].appliedMethod = 'vcarve';
                } else {
                    parts[idx].toolpath = [];
                    parts[idx].appliedMethod = 'vcarve';
                }
            });
        }

        // (舊版 1.x 演算法：僅在 VC 2.0 引擎遇到數值問題時作為備援)
        function computeNestedVCarveLegacy(shape, cfg) {
            const outer = [...shape.outer];
            if (outer.length > 2 && outer[0].x === outer[outer.length-1].x && outer[0].y === outer[outer.length-1].y) {
                outer.pop();
            }
            if (getPolygonArea(outer) < 0) outer.reverse();

            const holes = shape.holes.map(h => {
                const temp = [...h];
                if (temp.length > 2 && temp[0].x === temp[temp.length-1].x && temp[0].y === temp[temp.length-1].y) {
                    temp.pop();
                }
                if (getPolygonArea(temp) > 0) temp.reverse();
                return temp;
            });

            const isStraight = isPureStraightLinePath(outer, 0.05);

            const tol = Math.max(0.04, cfg.resolution * 0.7);
            const simpOuter = simplifyPath(outer, tol);
            const simpHoles = holes.map(h => simplifyPath(h, tol));

            const sampleSpacing = Math.max(0.5, cfg.resolution * 5);
            const resampledOuter = resamplePath(simpOuter, sampleSpacing);
            const resampledHoles = simpHoles.map(h => resamplePath(h, sampleSpacing));

            const loops = [resampledOuter, ...resampledHoles];

            const isBallNose = (cfg.toolType === 'ballnose');
            const toolRadius = cfg.d / 2.0;
            const vbitAngle = cfg.vbitAngle || 90;
            const halfAngleRad = (vbitAngle / 2) * Math.PI / 180;
            const tanHalf = Math.tan(halfAngleRad);
            const maxDepth = cfg.depth || 3.0;

            const allSegments = [];
            loops.forEach((loop, loopIdx) => {
                const m = loop.length;
                for (let i = 0; i < m; i++) {
                    const p1 = loop[i];
                    const p2 = loop[(i + 1) % m];
                    allSegments.push({
                        p1, p2,
                        loopIdx,
                        segIdx: i,
                        minX: Math.min(p1.x, p2.x),
                        maxX: Math.max(p1.x, p2.x),
                        minY: Math.min(p1.y, p2.y),
                        maxY: Math.max(p1.y, p2.y)
                    });
                }
            });

            // 邊界線段的均勻網格索引：查詢最近邊界距離時只檢查附近的格子 (結果與全部線段掃描相同)
            const segCount = allSegments.length;
            let gMinX = Infinity, gMaxX = -Infinity, gMinY = Infinity, gMaxY = -Infinity;
            for (let i = 0; i < segCount; i++) {
                const sg = allSegments[i];
                if (sg.minX < gMinX) gMinX = sg.minX; if (sg.maxX > gMaxX) gMaxX = sg.maxX;
                if (sg.minY < gMinY) gMinY = sg.minY; if (sg.maxY > gMaxY) gMaxY = sg.maxY;
            }
            const gridW = Math.max(gMaxX - gMinX, 0), gridH = Math.max(gMaxY - gMinY, 0);
            const cellSize = Math.max(sampleSpacing * 2, Math.sqrt(Math.max(gridW * gridH, 1e-12) / 200000), 1e-3);
            const gridNX = Math.floor(gridW / cellSize) + 1, gridNY = Math.floor(gridH / cellSize) + 1;
            const cellStart = new Int32Array(gridNX * gridNY + 1);
            const segCells = new Array(segCount);
            for (let i = 0; i < segCount; i++) {
                const sg = allSegments[i];
                const cx0 = Math.floor((sg.minX - gMinX) / cellSize), cx1 = Math.floor((sg.maxX - gMinX) / cellSize);
                const cy0 = Math.floor((sg.minY - gMinY) / cellSize), cy1 = Math.floor((sg.maxY - gMinY) / cellSize);
                segCells[i] = [cx0, cx1, cy0, cy1];
                for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) cellStart[cy * gridNX + cx + 1]++;
            }
            for (let i = 0; i < gridNX * gridNY; i++) cellStart[i + 1] += cellStart[i];
            const cellItems = new Int32Array(cellStart[gridNX * gridNY]);
            const cellFill = cellStart.slice(0, gridNX * gridNY);
            for (let i = 0; i < segCount; i++) {
                const [cx0, cx1, cy0, cy1] = segCells[i];
                for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) cellItems[cellFill[cy * gridNX + cx]++] = i;
            }
            const segStamp = new Int32Array(segCount);
            let stampCounter = 0;

            function getDistanceToRegionBoundary(pt, excludeLoopIdx, excludeSegIndices) {
                let minDist = Infinity;

                const considerSeg = (i) => {
                    const s = allSegments[i];
                    if (s.loopIdx === excludeLoopIdx && excludeSegIndices.includes(s.segIdx)) return;
                    
                    let dx = 0;
                    if (pt.x < s.minX) dx = s.minX - pt.x;
                    else if (pt.x > s.maxX) dx = pt.x - s.maxX;
                    let dy = 0;
                    if (pt.y < s.minY) dy = s.minY - pt.y;
                    else if (pt.y > s.maxY) dy = pt.y - s.maxY;

                    if (dx*dx + dy*dy >= minDist*minDist) return;

                    const d = pointToSegmentDistance(pt, s.p1, s.p2);
                    if (d < minDist) minDist = d;
                };

                const pcx = Math.min(gridNX - 1, Math.max(0, Math.floor((pt.x - gMinX) / cellSize)));
                const pcy = Math.min(gridNY - 1, Math.max(0, Math.floor((pt.y - gMinY) / cellSize)));
                stampCounter++;
                let visitedCells = 0, fallback = false;
                const maxRing = Math.max(gridNX, gridNY);

                for (let r = 0; r <= maxRing && !fallback; r++) {
                    // 第 r 圈以外的格子至少距離 (r-1)*cellSize；留一點餘裕避免浮點邊界誤差
                    if (r >= 1 && (r - 1) * cellSize - 1e-7 >= minDist) break;
                    for (let cy = pcy - r; cy <= pcy + r && !fallback; cy++) {
                        if (cy < 0 || cy >= gridNY) continue;
                        const onEdgeRow = (cy === pcy - r || cy === pcy + r);
                        const step = onEdgeRow ? 1 : Math.max(1, 2 * r);
                        for (let cx = pcx - r; cx <= pcx + r; cx += step) {
                            if (cx < 0 || cx >= gridNX) continue;
                            if (++visitedCells > segCount * 2 + 16) { fallback = true; break; }
                            const cell = cy * gridNX + cx;
                            for (let k = cellStart[cell]; k < cellStart[cell + 1]; k++) {
                                const i = cellItems[k];
                                if (segStamp[i] === stampCounter) continue;
                                segStamp[i] = stampCounter;
                                considerSeg(i);
                            }
                        }
                    }
                }

                if (fallback) {
                    // 查詢點離邊界很遠時，格子數量會超過線段數：改為直接掃描全部線段 (與原做法相同)
                    for (let i = 0; i < segCount; i++) considerSeg(i);
                }
                return minDist;
            }

            const skeletonPoints = [];
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            simpOuter.forEach(pt => {
                if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
                if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
            });
            const diag = Math.sqrt((maxX - minX)**2 + (maxY - minY)**2);

            let finishedStrokes = [];
            let bypassedSkeleton = false;

            if (isStraight && holes.length === 0) {
                if (simpOuter.length === 4) {
                    const C = getLineIntersection(simpOuter[0], simpOuter[2], simpOuter[1], simpOuter[3]);
                    if (C !== null) {
                        let dMin = Infinity;
                        for (let i = 0; i < 4; i++) {
                            const d = pointToSegmentDistance(C, simpOuter[i], simpOuter[(i+1)%4]);
                            if (d < dMin) dMin = d;
                        }
                        const Z_C = isBallNose ? 
                            (dMin >= toolRadius ? -maxDepth : -(toolRadius - Math.sqrt(Math.max(0, toolRadius*toolRadius - dMin*dMin)))) : 
                            -dMin / tanHalf;
                        const targetZC = Math.max(-maxDepth, Z_C);

                        const stroke1 = [
                            { x: simpOuter[0].x, y: simpOuter[0].y, z: 0, r: dMin },
                            { x: C.x, y: C.y, z: targetZC, r: dMin },
                            { x: simpOuter[2].x, y: simpOuter[2].y, z: 0, r: dMin }
                        ];
                        const stroke2 = [
                            { x: simpOuter[1].x, y: simpOuter[1].y, z: 0, r: dMin },
                            { x: C.x, y: C.y, z: targetZC, r: dMin },
                            { x: simpOuter[3].x, y: simpOuter[3].y, z: 0, r: dMin }
                        ];

                        finishedStrokes.push(cleanPath(stroke1, cfg.resolution));
                        finishedStrokes.push(cleanPath(stroke2, cfg.resolution));
                        bypassedSkeleton = true;
                    }
                } else if (simpOuter.length === 3) {
                    const A = simpOuter[0], B = simpOuter[1], Ct = simpOuter[2];
                    const a = Math.sqrt((B.x - Ct.x)**2 + (B.y - Ct.y)**2);
                    const b = Math.sqrt((A.x - Ct.x)**2 + (A.y - Ct.y)**2);
                    const c = Math.sqrt((A.x - B.x)**2 + (A.y - B.y)**2);
                    
                    if (a + b + c > 1e-5) {
                        const x_I = (a * A.x + b * B.x + c * Ct.x) / (a + b + c);
                        const y_I = (a * A.y + b * B.y + c * Ct.y) / (a + b + c);
                        const C = { x: x_I, y: y_I };

                        const s = (a + b + c) / 2;
                        const area = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c)));
                        const r = area / s;

                        const Z_C = isBallNose ? 
                            (r >= toolRadius ? -maxDepth : -(toolRadius - Math.sqrt(Math.max(0, toolRadius*toolRadius - r*r)))) : 
                            -r / tanHalf;
                        const targetZC = Math.max(-maxDepth, Z_C);

                        for (let i = 0; i < 3; i++) {
                            finishedStrokes.push(cleanPath([
                                { x: simpOuter[i].x, y: simpOuter[i].y, z: 0, r },
                                { x: C.x, y: C.y, z: targetZC, r }
                            ], cfg.resolution));
                        }
                        bypassedSkeleton = true;
                    }
                }
            }

            if (!bypassedSkeleton) {
                loops.forEach((loop, loopIdx) => {
                    const m = loop.length;
                    const isHole = (loopIdx > 0);

                    for (let i = 0; i < m; i++) {
                        const prev = loop[(i - 1 + m) % m];
                        const curr = loop[i];
                        const next = loop[(i + 1) % m];

                        const v1 = { x: curr.x - prev.x, y: curr.y - prev.y };
                        const v2 = { x: next.x - curr.x, y: next.y - curr.y };

                        const len1 = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
                        const len2 = Math.sqrt(v2.x*v2.x + v2.y*v2.y);
                        if (len1 < 1e-6 || len2 < 1e-6) continue;

                        const t1 = { x: v1.x / len1, y: v1.y / len1 };
                        const t2 = { x: v2.x / len2, y: v2.y / len2 };

                        const cross = t1.x * t2.y - t1.y * t2.x;
                        const isConcave = isHole ? (cross > 1e-5) : (cross < -1e-5);
                        if (isConcave) continue;

                        const n1 = { x: -t1.y, y: t1.x };
                        const n2 = { x: -t2.y, y: t2.x };

                        let u = { x: n1.x + n2.x, y: n1.y + n2.y };
                        let lenU = Math.sqrt(u.x*u.x + u.y*u.y);
                        if (lenU < 1e-5) {
                            u = { ...n1 };
                        } else {
                            u.x /= lenU; u.y /= lenU;
                        }

                        const startSegs = [(i - 1 + m) % m, i];

                        let low = 0, high = diag;
                        for (let step = 0; step < 16; step++) {
                            const mid = (low + high) / 2;
                            const Pt = { x: curr.x + mid * u.x, y: curr.y + mid * u.y };
                            const dStart = Math.min(pointToSegmentDistance(Pt, prev, curr), pointToSegmentDistance(Pt, curr, next));
                            const dOther = getDistanceToRegionBoundary(Pt, loopIdx, startSegs);

                            if (dStart < dOther) low = mid; else high = mid;
                        }

                        const tStar = (low + high) / 2;
                        const PtStar = { x: curr.x + tStar * u.x, y: curr.y + tStar * u.y };
                        const radius = Math.min(pointToSegmentDistance(PtStar, prev, curr), pointToSegmentDistance(PtStar, curr, next));

                        const isInsideSolid = isPointInPolygon(PtStar, simpOuter) && !simpHoles.some(h => isPointInPolygon(PtStar, h));

                        if (radius > 0.05 && isInsideSolid) {
                            let z = isBallNose ? 
                                (radius >= toolRadius ? -maxDepth : -(toolRadius - Math.sqrt(Math.max(0, toolRadius*toolRadius - radius*radius)))) : 
                                -radius / tanHalf;
                            skeletonPoints.push({
                                x: PtStar.x, y: PtStar.y,
                                z: Math.max(-maxDepth, z),
                                r: radius
                            });
                        }
                    }
                });

                const spineStrokes = [];
                if (skeletonPoints.length > 0) {
                    const unvisited = [...skeletonPoints];
                    const chainThreshold = 1.5; 

                    while (unvisited.length > 0) {
                        let stroke = [unvisited.shift()];
                        let growing = true;

                        while (growing) {
                            growing = false;
                            const lastPt = stroke[stroke.length - 1];
                            let bestIdx = -1;
                            let minDist = Infinity;

                            for (let i = 0; i < unvisited.length; i++) {
                                const d = Math.sqrt((unvisited[i].x - lastPt.x)**2 + (unvisited[i].y - lastPt.y)**2);
                                if (d < minDist) {
                                    minDist = d;
                                    bestIdx = i;
                                }
                            }

                            if (bestIdx !== -1 && minDist < chainThreshold) {
                                stroke.push(unvisited.splice(bestIdx, 1)[0]);
                                growing = true;
                            }
                        }

                        if (stroke.length >= 2) {
                            spineStrokes.push(stroke);
                        }
                    }
                }

                finishedStrokes = spineStrokes.map(stroke => {
                    let pts = stroke.map(p => ({ x: p.x, y: p.y, z: p.z, r: p.r }));

                    const alpha = 0.4;
                    for (let iter = 0; iter < 3; iter++) {
                        const temp = pts.map(p => ({ x: p.x, y: p.y, z: p.z }));
                        for (let j = 1; j < pts.length - 1; j++) {
                            pts[j].x = temp[j].x * (1 - alpha) + (temp[j-1].x + temp[j+1].x) * 0.5 * alpha;
                            pts[j].y = temp[j].y * (1 - alpha) + (temp[j-1].y + temp[j+1].y) * 0.5 * alpha;
                            pts[j].z = temp[j].z * (1 - alpha) + (temp[j-1].z + temp[j+1].z) * 0.5 * alpha;
                        }
                    }

                    if (pts.length > 4) {
                        const taperLength = Math.min(5, Math.floor(pts.length / 2));
                        for (let k = 0; k < taperLength; k++) {
                            const factor = k / taperLength;
                            pts[k].z = pts[k].z * factor;
                            pts[pts.length - 1 - k].z = pts[pts.length - 1 - k].z * factor;
                        }
                    } else {
                        for (let k = 0; k < pts.length; k++) {
                            const distToEnd = Math.min(k, pts.length - 1 - k);
                            const factor = distToEnd / (pts.length / 2);
                            pts[k].z = pts[k].z * factor;
                        }
                    }

                    return pts;
                }).map(path => cleanPath(path, cfg.resolution)).filter(path => path.length >= 2);

                if (isStraight && simpOuter.length > 4) {
                    const N_verts = simpOuter.length;
                    for (let i = 0; i < N_verts; i++) {
                        const prev = simpOuter[(i - 1 + N_verts) % N_verts];
                        const curr = simpOuter[i];
                        const next = simpOuter[(i + 1) % N_verts];

                        const v1 = { x: curr.x - prev.x, y: curr.y - prev.y };
                        const v2 = { x: next.x - curr.x, y: next.y - curr.y };
                        const len1 = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
                        const len2 = Math.sqrt(v2.x*v2.x + v2.y*v2.y);
                        if (len1 < 1e-6 || len2 < 1e-6) continue;

                        const cross = (v1.x / len1) * (v2.y / len2) - (v1.y / len1) * (v2.x / len2);
                        if (cross < -1e-5) { 
                            let nearestPtOnSpine = null;
                            let minDistSq = Infinity;
                            finishedStrokes.forEach(stroke => {
                                stroke.forEach(pt => {
                                    const dSq = (pt.x - curr.x)**2 + (pt.y - curr.y)**2;
                                    if (dSq < minDistSq) {
                                        minDistSq = dSq;
                                        nearestPtOnSpine = pt;
                                    }
                                });
                            });

                            if (nearestPtOnSpine && minDistSq > 0.25) {
                                const miterLine = [
                                    { x: curr.x, y: curr.y, z: 0, r: nearestPtOnSpine.r || toolRadius },
                                    { x: nearestPtOnSpine.x, y: nearestPtOnSpine.y, z: nearestPtOnSpine.z, r: nearestPtOnSpine.r || toolRadius }
                                ];
                                finishedStrokes.push(cleanPath(miterLine, cfg.resolution));
                            }
                        }
                    }
                }
            }

            return optimizePathOrder(finishedStrokes, 0, 0);
        }

        const VC2_CORNER_ANGLE = 24 * Math.PI / 180;   // 中軸線上某點到兩側邊界的張角小於此值，視為取樣雜訊而捨棄 (尖角超過 156° 的轉折不產生分支)
        const VC2_CORNER_TURN = 70 * Math.PI / 180;    // 輪廓轉折角 >= 此值一定視為尖角，不做修整
        // =====================================================================
        // VC 2.0 引擎：以 Voronoi 中軸線 (medial axis) 規劃 V 雕刻路徑
        // 做法與 Vectric VCarve 相同：刀具沿著輪廓的「中心線」行走，
        // 深度由該點到邊界的距離 (內切圓半徑) 決定；只有真正的尖角才會有通往角落的分支。
        // =====================================================================

        // Hilbert 曲線順序：讓連續插入的點在空間上相鄰，加快三角剖分的點定位
        function vc2HilbertKey(x, y) {
            const n = 65536;
            let d = 0;
            for (let s = n / 2; s >= 1; s = Math.floor(s / 2)) {
                const rx = (x & s) > 0 ? 1 : 0;
                const ry = (y & s) > 0 ? 1 : 0;
                d += s * s * ((3 * rx) ^ ry);
                if (ry === 0) {
                    if (rx === 1) { x = n - 1 - x; y = n - 1 - y; }
                    const t = x; x = y; y = t;
                }
            }
            return d;
        }

        // Bowyer-Watson 增量式 Delaunay 三角剖分。
        // 傳回 { X, Y, tv, tn, alive, triCount }：tv 為三角形頂點 (逆時針)，
        // tn[3t+i] 為與頂點 i 相對那條邊的鄰接三角形 (-1 表示無)。
        // 頂點編號 >= n 為輔助的超大三角形頂點。
        function vc2Delaunay(px, py) {
            const n = px.length;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (let i = 0; i < n; i++) {
                if (px[i] < minX) minX = px[i]; if (px[i] > maxX) maxX = px[i];
                if (py[i] < minY) minY = py[i]; if (py[i] > maxY) maxY = py[i];
            }
            const dm = Math.max(maxX - minX, maxY - minY, 1e-6);
            const mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
            const X = new Float64Array(n + 3), Y = new Float64Array(n + 3);
            X.set(px); Y.set(py);
            const S = dm * 30;
            X[n] = mx - S; Y[n] = my - S;
            X[n + 1] = mx + S; Y[n + 1] = my - S;
            X[n + 2] = mx; Y[n + 2] = my + S;

            const cap = 4 * n + 128;
            const tv = new Int32Array(cap * 3);
            const tn = new Int32Array(cap * 3).fill(-1);
            const alive = new Uint8Array(cap);
            const stamp = new Int32Array(cap);
            const freeList = [];
            let highWater = 0;
            const allocTri = () => (freeList.length ? freeList.pop() : highWater++);

            const t0 = allocTri();
            tv[0] = n; tv[1] = n + 1; tv[2] = n + 2;
            alive[t0] = 1;
            let lastTri = t0;

            // 依 Hilbert 曲線順序插入
            const keys = new Float64Array(n);
            for (let i = 0; i < n; i++) {
                const hx = Math.min(65535, Math.max(0, Math.floor((px[i] - minX) / dm * 65535)));
                const hy = Math.min(65535, Math.max(0, Math.floor((py[i] - minY) / dm * 65535)));
                keys[i] = vc2HilbertKey(hx, hy);
            }
            const order = new Array(n);
            for (let i = 0; i < n; i++) order[i] = i;
            order.sort((a, b) => keys[a] - keys[b]);

            const startTri = new Int32Array(n + 3).fill(-1);
            let stampCounter = 0;
            const stack = [];
            const cavity = [];
            const bB = [], bC = [], bOut = [], bOwner = [];

            const inCircle = (t, x, y) => {
                const a = tv[3 * t], b = tv[3 * t + 1], c = tv[3 * t + 2];
                const adx = X[a] - x, ady = Y[a] - y;
                const bdx = X[b] - x, bdy = Y[b] - y;
                const cdx = X[c] - x, cdy = Y[c] - y;
                const ad = adx * adx + ady * ady, bd = bdx * bdx + bdy * bdy, cd = cdx * cdx + cdy * cdy;
                return ad * (bdx * cdy - cdx * bdy) - bd * (adx * cdy - cdx * ady) + cd * (adx * bdy - bdx * ady);
            };

            for (let oi = 0; oi < n; oi++) {
                const p = order[oi];
                const x = X[p], y = Y[p];

                // 1. 以「走訪」方式找到包含 p 的三角形
                let t = lastTri;
                let guard = 0, found = false;
                const maxGuard = highWater * 3 + 30;
                while (guard <= maxGuard) {
                    const b3 = 3 * t;
                    let moved = false;
                    for (let k = 0; k < 3; k++) {
                        const i = (k + guard) % 3;
                        const vb = tv[b3 + (i + 1) % 3], vc = tv[b3 + (i + 2) % 3];
                        if ((X[vc] - X[vb]) * (y - Y[vb]) - (Y[vc] - Y[vb]) * (x - X[vb]) < 0) {
                            const nb = tn[b3 + i];
                            if (nb >= 0) { t = nb; moved = true; break; }
                        }
                    }
                    if (!moved) { found = true; break; }
                    guard++;
                }
                if (!found) {
                    // 保險：改用線性搜尋
                    t = -1;
                    for (let q = 0; q < highWater; q++) {
                        if (!alive[q]) continue;
                        const a = tv[3 * q], b = tv[3 * q + 1], c = tv[3 * q + 2];
                        const o1 = (X[b] - X[a]) * (y - Y[a]) - (Y[b] - Y[a]) * (x - X[a]);
                        const o2 = (X[c] - X[b]) * (y - Y[b]) - (Y[c] - Y[b]) * (x - X[b]);
                        const o3 = (X[a] - X[c]) * (y - Y[c]) - (Y[a] - Y[c]) * (x - X[c]);
                        if (o1 >= 0 && o2 >= 0 && o3 >= 0) { t = q; break; }
                    }
                    if (t < 0) throw new Error('vc2-delaunay: point location failed');
                }

                // 2. 找出「外接圓包含 p」的三角形群 (空腔)
                stampCounter++;
                cavity.length = 0; stack.length = 0;
                bB.length = 0; bC.length = 0; bOut.length = 0; bOwner.length = 0;
                stamp[t] = stampCounter; stack.push(t); cavity.push(t);
                while (stack.length) {
                    const u = stack.pop();
                    for (let i = 0; i < 3; i++) {
                        const nb = tn[3 * u + i];
                        if (nb >= 0) {
                            if (stamp[nb] === stampCounter) continue;
                            if (inCircle(nb, x, y) > 0) {
                                stamp[nb] = stampCounter; stack.push(nb); cavity.push(nb);
                                continue;
                            }
                        }
                        bB.push(tv[3 * u + (i + 1) % 3]);
                        bC.push(tv[3 * u + (i + 2) % 3]);
                        bOut.push(nb);
                        bOwner.push(u);
                    }
                }

                // 3. 檢查空腔對 p 是否為星形 (否則表示數值退化)，並建立新三角形
                const bn = bB.length;
                for (let e = 0; e < bn; e++) {
                    const vb = bB[e], vc = bC[e];
                    if ((X[vc] - X[vb]) * (y - Y[vb]) - (Y[vc] - Y[vb]) * (x - X[vb]) <= 0) {
                        throw new Error('vc2-delaunay: degenerate cavity');
                    }
                }
                const newIds = new Array(bn);
                for (let e = 0; e < bn; e++) newIds[e] = allocTri();
                if (highWater > cap - 4) throw new Error('vc2-delaunay: capacity exceeded');

                for (let e = 0; e < bn; e++) {
                    const T = newIds[e];
                    tv[3 * T] = bB[e]; tv[3 * T + 1] = bC[e]; tv[3 * T + 2] = p;
                    tn[3 * T] = -1; tn[3 * T + 1] = -1; tn[3 * T + 2] = bOut[e];
                    alive[T] = 1;
                    const out = bOut[e];
                    if (out >= 0) {
                        const o3 = 3 * out;
                        const owner = bOwner[e];
                        if (tn[o3] === owner && tv[o3 + 1] === bC[e] && tv[o3 + 2] === bB[e]) tn[o3] = T;
                        else if (tn[o3 + 1] === owner && tv[o3 + 2] === bC[e] && tv[o3] === bB[e]) tn[o3 + 1] = T;
                        else if (tn[o3 + 2] === owner && tv[o3] === bC[e] && tv[o3 + 1] === bB[e]) tn[o3 + 2] = T;
                        else throw new Error('vc2-delaunay: adjacency mismatch');
                    }
                    if (startTri[bB[e]] !== -1) throw new Error('vc2-delaunay: non-simple cavity');
                    startTri[bB[e]] = T;
                }
                for (let e = 0; e < bn; e++) {
                    const T = newIds[e];
                    const T2 = startTri[bC[e]];
                    if (T2 < 0) throw new Error('vc2-delaunay: open cavity');
                    tn[3 * T] = T2;
                    tn[3 * T2 + 1] = T;
                }
                for (let e = 0; e < bn; e++) startTri[bB[e]] = -1;

                // 4. 回收空腔內的舊三角形
                for (let c = 0; c < cavity.length; c++) {
                    const u = cavity[c];
                    alive[u] = 0;
                    freeList.push(u);
                }
                lastTri = newIds[0];
            }

            return { X, Y, tv, tn, alive, triCount: highWater, n };
        }

        // 點到線段的最短距離 (不分配物件的版本)
        function vc2DistPtSeg(px, py, ax, ay, bx, by) {
            const dx = bx - ax, dy = by - ay;
            const l2 = dx * dx + dy * dy;
            let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
            if (t < 0) t = 0; else if (t > 1) t = 1;
            const qx = ax + t * dx - px, qy = ay + t * dy - py;
            return Math.sqrt(qx * qx + qy * qy);
        }

        // 3D 道格拉斯-普克簡化 (保留首尾)，tol 單位 mm
        function vc2Simplify3D(pts, tol) {
            const n = pts.length;
            if (n <= 2) return pts;
            const keep = new Uint8Array(n);
            keep[0] = 1; keep[n - 1] = 1;
            const stack = [0, n - 1];
            const tol2 = tol * tol;
            while (stack.length) {
                const hi = stack.pop(), lo = stack.pop();
                if (hi - lo < 2) continue;
                const A = pts[lo], B = pts[hi];
                const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
                const l2 = dx * dx + dy * dy + dz * dz;
                let maxD = 0, idx = -1;
                for (let i = lo + 1; i < hi; i++) {
                    const P = pts[i];
                    let t = l2 > 0 ? ((P.x - A.x) * dx + (P.y - A.y) * dy + (P.z - A.z) * dz) / l2 : 0;
                    if (t < 0) t = 0; else if (t > 1) t = 1;
                    const ex = A.x + t * dx - P.x, ey = A.y + t * dy - P.y, ez = A.z + t * dz - P.z;
                    const d = ex * ex + ey * ey + ez * ez;
                    if (d > maxD) { maxD = d; idx = i; }
                }
                if (idx !== -1 && maxD > tol2) {
                    keep[idx] = 1;
                    stack.push(lo, idx, idx, hi);
                }
            }
            const out = [];
            for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[i]);
            return out;
        }

        // 去除過密的頂點 (間距小於 minDist 的點)，但保留明顯的尖角。解析度以下的細節本來就無法雕出。
        function vc2Decimate(pts, minDist, hardTurn) {
            const n = pts.length;
            if (n < 8) return pts;
            const out = [pts[0]];
            for (let i = 1; i < n; i++) {
                const q = out[out.length - 1], p = pts[i];
                if (Math.hypot(p.x - q.x, p.y - q.y) >= minDist) { out.push(p); continue; }
                const a = pts[i - 1], c = pts[(i + 1) % n];
                const v1x = p.x - a.x, v1y = p.y - a.y, v2x = c.x - p.x, v2y = c.y - p.y;
                if (Math.abs(Math.atan2(v1x * v2y - v1y * v2x, v1x * v2x + v1y * v2y)) >= hardTurn) out.push(p);
            }
            return out.length >= 3 ? out : pts;
        }

        // 輪廓修整：平滑曲線被簡化成折線後，每個頂點都會有小轉折，若不處理會被誤認為「尖角」而長出多餘分支。
        // 判斷依據是「這個轉折能偏離多遠」：弦長 L、轉角 φ 的折點，等效的弧高約為 L*φ/8；
        // 弧高很小 (<= sagitta) 且轉角不大 (< hardTurn) 的頂點視為曲線上的取樣點，
        // 套用「通過原始頂點」的 4 點內插細分 (簡化後的頂點本來就落在真實曲線上，輪廓不會縮水)；
        // 其餘頂點是真正的尖角，保持不動，緊鄰尖角的邊維持直線。
        function vc2FairLoop(pts, hardTurn, sagitta, iterations, minSplit) {
            let cur = pts.map(p => ({ x: p.x, y: p.y }));
            let corner = null;
            for (let it = 0; it < iterations; it++) {
                const m = cur.length;
                if (m < 4) break;
                if (!corner) {
                    corner = new Array(m);
                    for (let i = 0; i < m; i++) {
                        const a = cur[(i - 1 + m) % m], b = cur[i], c = cur[(i + 1) % m];
                        const v1x = b.x - a.x, v1y = b.y - a.y, v2x = c.x - b.x, v2y = c.y - b.y;
                        const turn = Math.abs(Math.atan2(v1x * v2y - v1y * v2x, v1x * v2x + v1y * v2y));
                        const Lmin = Math.min(Math.hypot(v1x, v1y), Math.hypot(v2x, v2y));
                        corner[i] = turn >= hardTurn || (Lmin * turn / 8 > sagitta);
                    }
                }
                const next = [], nextCorner = [];
                for (let i = 0; i < m; i++) {
                    const i0 = (i - 1 + m) % m, i1 = i, i2 = (i + 1) % m, i3 = (i + 2) % m;
                    const p1 = cur[i1], p2 = cur[i2];
                    next.push({ x: p1.x, y: p1.y }); nextCorner.push(corner[i1]);
                    // 已經夠短的邊不再細分 (輪廓本來就很密時，避免點數暴增)
                    if (Math.hypot(p2.x - p1.x, p2.y - p1.y) < minSplit) continue;
                    let mx, my;
                    if (corner[i1] || corner[i2]) {
                        mx = (p1.x + p2.x) / 2; my = (p1.y + p2.y) / 2;
                    } else {
                        const p0 = corner[i0] ? { x: 2 * p1.x - p2.x, y: 2 * p1.y - p2.y } : cur[i0];
                        const p3 = corner[i3] ? { x: 2 * p2.x - p1.x, y: 2 * p2.y - p1.y } : cur[i3];
                        mx = (-p0.x + 9 * p1.x + 9 * p2.x - p3.x) / 16;
                        my = (-p0.y + 9 * p1.y + 9 * p2.y - p3.y) / 16;
                    }
                    next.push({ x: mx, y: my }); nextCorner.push(false);
                }
                cur = next; corner = nextCorner;
            }
            return cur;
        }

        // 由輪廓 (外輪廓 + 孔洞) 計算中軸線，並串成連續的 V 雕刻刀路。
        // opts: { h, theta, zOf(r), resolution }
        function vc2MedialAxisStrokes(loopsIn, opts) {
            const h = opts.h;
            const theta = opts.theta;
            const zOf = opts.zOf;

            // ---- 1. 整理輪廓 ----
            const loops = [];
            loopsIn.forEach(L => {
                const pts = [];
                for (const p of L) {
                    const q = pts[pts.length - 1];
                    if (!q || Math.hypot(p.x - q.x, p.y - q.y) > 1e-9) pts.push({ x: p.x, y: p.y });
                }
                if (pts.length > 2 && Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y) < 1e-9) pts.pop();
                if (pts.length >= 3) loops.push(opts.fair ? vc2FairLoop(vc2Decimate(pts, h * 0.5, opts.cornerTurn), opts.cornerTurn, opts.sagitta, opts.fair, h) : pts);
            });
            if (!loops.length) return [];

            // ---- 2. 沿輪廓等距取樣 (保留原始頂點與其轉角) ----
            const sxA = [], syA = [], sCornerA = [], sNextA = [];
            loops.forEach((pts) => {
                const m = pts.length, base = sxA.length;
                for (let i = 0; i < m; i++) {
                    const a = pts[(i - 1 + m) % m], b = pts[i], c = pts[(i + 1) % m];
                    const v1x = b.x - a.x, v1y = b.y - a.y, v2x = c.x - b.x, v2y = c.y - b.y;
                    const turn = Math.abs(Math.atan2(v1x * v2y - v1y * v2x, v1x * v2x + v1y * v2y));
                    sxA.push(b.x); syA.push(b.y); sCornerA.push(turn);
                    const len = Math.hypot(c.x - b.x, c.y - b.y);
                    const k = Math.max(1, Math.ceil(len / h));
                    for (let j = 1; j < k; j++) {
                        sxA.push(b.x + (c.x - b.x) * j / k);
                        syA.push(b.y + (c.y - b.y) * j / k);
                        sCornerA.push(0);
                    }
                }
                const end = sxA.length;
                for (let s = base; s < end; s++) sNextA[s] = (s + 1 < end) ? s + 1 : base;
            });
            const N = sxA.length;
            const sx = Float64Array.from(sxA), sy = Float64Array.from(syA);
            const sCorner = Float64Array.from(sCornerA);
            const sNext = Int32Array.from(sNextA);

            // 極小的確定性抖動 (1e-6 mm)，避免圓周上等距點造成的共圓退化
            const jit = (s, k) => {
                let v = Math.imul(s + 1, 2654435761) ^ Math.imul(k + 7, 40503);
                v ^= v >>> 13; v = Math.imul(v, 1274126177); v ^= v >>> 16;
                return ((v >>> 0) % 100000) / 100000 - 0.5;
            };
            const px = new Float64Array(N), py = new Float64Array(N);
            for (let s = 0; s < N; s++) { px[s] = sx[s] + jit(s, 1) * 2e-6; py[s] = sy[s] + jit(s, 2) * 2e-6; }

            // ---- 3. Delaunay 三角剖分 ----
            const dt = vc2Delaunay(px, py);
            const { X, Y, tv, tn, alive, triCount } = dt;

            // ---- 4. 內外判斷 (奇偶規則，依 Y 分箱加速) ----
            let minY = Infinity, maxY = -Infinity;
            for (let s = 0; s < N; s++) { if (sy[s] < minY) minY = sy[s]; if (sy[s] > maxY) maxY = sy[s]; }
            const binH = Math.max(h, (maxY - minY) / 4096, 1e-6);
            const nBins = Math.floor((maxY - minY) / binH) + 2;
            const binCnt = new Int32Array(nBins + 1);
            for (let s = 0; s < N; s++) {
                const y1 = sy[s], y2 = sy[sNext[s]];
                const lo = Math.floor((Math.min(y1, y2) - minY) / binH), hi = Math.floor((Math.max(y1, y2) - minY) / binH);
                for (let b = lo; b <= hi; b++) binCnt[b + 1]++;
            }
            for (let b = 0; b < nBins; b++) binCnt[b + 1] += binCnt[b];
            const binItems = new Int32Array(binCnt[nBins]);
            const binFill = binCnt.slice(0, nBins);
            for (let s = 0; s < N; s++) {
                const y1 = sy[s], y2 = sy[sNext[s]];
                const lo = Math.floor((Math.min(y1, y2) - minY) / binH), hi = Math.floor((Math.max(y1, y2) - minY) / binH);
                for (let b = lo; b <= hi; b++) binItems[binFill[b]++] = s;
            }
            const inside = (x, y) => {
                const b = Math.floor((y - minY) / binH);
                if (b < 0 || b >= nBins) return false;
                let c = false;
                for (let k = binCnt[b]; k < binCnt[b + 1]; k++) {
                    const s = binItems[k], t = sNext[s];
                    const ay = sy[s], by = sy[t];
                    if ((ay > y) !== (by > y)) {
                        const xi = sx[s] + (y - ay) * (sx[t] - sx[s]) / (by - ay);
                        if (x < xi) c = !c;
                    }
                }
                return c;
            };

            // ---- 5. 每個三角形的外心 (= Voronoi 頂點)，保留位於形狀內部者 ----
            const ccx = new Float64Array(triCount), ccy = new Float64Array(triCount), ccr = new Float64Array(triCount);
            const good = new Uint8Array(triCount);
            for (let t = 0; t < triCount; t++) {
                if (!alive[t]) continue;
                const a = tv[3 * t], b = tv[3 * t + 1], c = tv[3 * t + 2];
                if (a >= N || b >= N || c >= N) continue;
                const ax = X[a], ay = Y[a];
                const bx = X[b] - ax, by = Y[b] - ay, cx = X[c] - ax, cy = Y[c] - ay;
                const d = 2 * (bx * cy - by * cx);
                if (Math.abs(d) < 1e-14) continue;
                const b2 = bx * bx + by * by, c2 = cx * cx + cy * cy;
                const ux = (cy * b2 - by * c2) / d, uy = (bx * c2 - cx * b2) / d;
                ccx[t] = ax + ux; ccy[t] = ay + uy; ccr[t] = Math.sqrt(ux * ux + uy * uy);
                if (inside(ccx[t], ccy[t])) good[t] = 1;
            }

            // ---- 5b. 輪廓線段的網格索引：查詢任一點到輪廓的精確最短距離 ----
            let gMinX = Infinity, gMaxX = -Infinity;
            for (let s = 0; s < N; s++) { if (sx[s] < gMinX) gMinX = sx[s]; if (sx[s] > gMaxX) gMaxX = sx[s]; }
            const gCell = Math.max(h * 2, Math.sqrt(Math.max((gMaxX - gMinX) * (maxY - minY), 1e-9) / 100000));
            const gNX = Math.floor((gMaxX - gMinX) / gCell) + 1, gNY = Math.floor((maxY - minY) / gCell) + 1;
            const gStart = new Int32Array(gNX * gNY + 1);
            const segCellRange = (s) => {
                const t = sNext[s];
                return [
                    Math.floor((Math.min(sx[s], sx[t]) - gMinX) / gCell), Math.floor((Math.max(sx[s], sx[t]) - gMinX) / gCell),
                    Math.floor((Math.min(sy[s], sy[t]) - minY) / gCell), Math.floor((Math.max(sy[s], sy[t]) - minY) / gCell)
                ];
            };
            for (let s = 0; s < N; s++) {
                const [x0, x1, y0, y1] = segCellRange(s);
                for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) gStart[cy * gNX + cx + 1]++;
            }
            for (let i = 0; i < gNX * gNY; i++) gStart[i + 1] += gStart[i];
            const gItems = new Int32Array(gStart[gNX * gNY]);
            const gFill = gStart.slice(0, gNX * gNY);
            for (let s = 0; s < N; s++) {
                const [x0, x1, y0, y1] = segCellRange(s);
                for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) gItems[gFill[cy * gNX + cx]++] = s;
            }
            const gStamp = new Int32Array(N);
            let gStampCounter = 0;
            const distToBoundary = (x, y) => {
                const pcx = Math.min(gNX - 1, Math.max(0, Math.floor((x - gMinX) / gCell)));
                const pcy = Math.min(gNY - 1, Math.max(0, Math.floor((y - minY) / gCell)));
                let best = Infinity;
                gStampCounter++;
                const maxRing = Math.max(gNX, gNY);
                for (let r = 0; r <= maxRing; r++) {
                    if (r >= 1 && (r - 1) * gCell - 1e-7 >= best) break;
                    for (let cy = pcy - r; cy <= pcy + r; cy++) {
                        if (cy < 0 || cy >= gNY) continue;
                        const step = (cy === pcy - r || cy === pcy + r) ? 1 : Math.max(1, 2 * r);
                        for (let cx = pcx - r; cx <= pcx + r; cx += step) {
                            if (cx < 0 || cx >= gNX) continue;
                            const cell = cy * gNX + cx;
                            for (let k = gStart[cell]; k < gStart[cell + 1]; k++) {
                                const sg = gItems[k];
                                if (gStamp[sg] === gStampCounter) continue;
                                gStamp[sg] = gStampCounter;
                                const t = sNext[sg];
                                const d = vc2DistPtSeg(x, y, sx[sg], sy[sg], sx[t], sy[t]);
                                if (d < best) best = d;
                            }
                        }
                    }
                }
                return best;
            };

            // ---- 6. Voronoi 邊 = 中軸線候選；以「張角」濾掉貼著邊界的雜訊分支 ----
            const nodeOf = new Int32Array(triCount).fill(-1);
            const nodeTri = [];
            const getNode = (t) => {
                if (nodeOf[t] === -1) { nodeOf[t] = nodeTri.length; nodeTri.push(t); }
                return nodeOf[t];
            };
            const rawEdges = [];
            for (let t = 0; t < triCount; t++) {
                if (!good[t]) continue;
                for (let i = 0; i < 3; i++) {
                    const u = tn[3 * t + i];
                    if (u < 0 || u < t || !good[u]) continue;
                    const a = tv[3 * t + (i + 1) % 3], b = tv[3 * t + (i + 2) % 3];
                    if (sNext[a] === b || sNext[b] === a) continue;          // 相鄰取樣點 -> 對偶邊穿過輪廓，不是中軸
                    const ab = Math.hypot(X[a] - X[b], Y[a] - Y[b]);
                    const angT = 2 * Math.asin(Math.min(1, ab / (2 * Math.max(ccr[t], 1e-12))));
                    const angU = 2 * Math.asin(Math.min(1, ab / (2 * Math.max(ccr[u], 1e-12))));
                    if (Math.min(angT, angU) < theta) continue;
                    rawEdges.push(getNode(t), getNode(u));
                }
            }
            if (!rawEdges.length) return [];

            // ---- 7. 合併幾乎重合的節點 ----
            const V0 = nodeTri.length;
            const parent = new Int32Array(V0);
            for (let i = 0; i < V0; i++) parent[i] = i;
            const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
            const mergeEps = Math.min(0.01, h * 0.1);
            for (let e = 0; e < rawEdges.length; e += 2) {
                const a = rawEdges[e], b = rawEdges[e + 1];
                const ta = nodeTri[a], tb = nodeTri[b];
                if (Math.hypot(ccx[ta] - ccx[tb], ccy[ta] - ccy[tb]) < mergeEps) {
                    const ra = find(a), rb = find(b);
                    if (ra !== rb) parent[rb] = ra;
                }
            }
            const rootIndex = new Int32Array(V0).fill(-1);
            const nX = [], nY = [], nR = [], nTri = [], nCnt = [];
            for (let i = 0; i < V0; i++) {
                const r = find(i);
                if (rootIndex[r] === -1) { rootIndex[r] = nX.length; nX.push(0); nY.push(0); nR.push(Infinity); nTri.push(nodeTri[r]); nCnt.push(0); }
                const k = rootIndex[r], t = nodeTri[i];
                nX[k] += ccx[t]; nY[k] += ccy[t]; nCnt[k]++;
                const er = distToBoundary(ccx[t], ccy[t]);
                if (er < nR[k]) nR[k] = er;
            }
            const V = nX.length;
            for (let k = 0; k < V; k++) { nX[k] /= nCnt[k]; nY[k] /= nCnt[k]; }
            const edgeU = [], edgeV = [], edgeSeen = new Set();
            for (let e = 0; e < rawEdges.length; e += 2) {
                let u = rootIndex[find(rawEdges[e])], v = rootIndex[find(rawEdges[e + 1])];
                if (u === v) continue;
                if (u > v) { const t = u; u = v; v = t; }
                const key = u * V + v;
                if (edgeSeen.has(key)) continue;
                edgeSeen.add(key);
                edgeU.push(u); edgeV.push(v);
            }
            const E = edgeU.length;
            const edgeLen = new Float64Array(E);
            for (let e = 0; e < E; e++) edgeLen[e] = Math.hypot(nX[edgeU[e]] - nX[edgeV[e]], nY[edgeU[e]] - nY[edgeV[e]]);

            // ---- 8. 圖 -> 鏈 (節點之間的連續路徑)，並修剪過短的末端分支 ----
            const active = new Uint8Array(E).fill(1);
            const extractChains = () => {
                const deg = new Int32Array(V);
                const adj = Array.from({ length: V }, () => []);
                for (let e = 0; e < E; e++) {
                    if (!active[e]) continue;
                    deg[edgeU[e]]++; deg[edgeV[e]]++;
                    adj[edgeU[e]].push(e); adj[edgeV[e]].push(e);
                }
                const used = new Uint8Array(E);
                const chains = [];
                const follow = (start, e0) => {
                    const nodes = [start], eids = [e0];
                    let cur = start, e = e0, len = 0;
                    for (;;) {
                        used[e] = 1; len += edgeLen[e];
                        const o = edgeU[e] === cur ? edgeV[e] : edgeU[e];
                        nodes.push(o); cur = o;
                        if (deg[cur] !== 2) break;
                        const a = adj[cur];
                        const ne = a[0] === e ? a[1] : a[0];
                        if (used[ne]) break;
                        e = ne; eids.push(e);
                    }
                    return { nodes, eids, len };
                };
                for (let v = 0; v < V; v++) {
                    if (deg[v] === 1 || deg[v] >= 3) {
                        for (const e of adj[v]) if (!used[e]) chains.push(follow(v, e));
                    }
                }
                for (let e = 0; e < E; e++) {
                    if (active[e] && !used[e]) chains.push(follow(edgeU[e], e));
                }
                return { chains, deg };
            };
            const pruneLen = opts.pruneLen;
            let ex = extractChains();
            for (let iter = 0; iter < 10; iter++) {
                let removed = false;
                for (const ch of ex.chains) {
                    const s = ch.nodes[0], e = ch.nodes[ch.nodes.length - 1];
                    if (s === e) continue;
                    const leafJunction = (ex.deg[s] === 1 && ex.deg[e] >= 3) || (ex.deg[e] === 1 && ex.deg[s] >= 3);
                    if (leafJunction && ch.len < pruneLen) {
                        ch.eids.forEach(id => { active[id] = 0; });
                        removed = true;
                    }
                }
                if (!removed) break;
                ex = extractChains();
            }
            const chains = ex.chains, deg = ex.deg;

            // ---- 9. 鏈 -> 點列：端點延伸到尖角、平滑、計算深度、簡化 ----
            const cornerMin = 0.26;                // 約 15°
            const polylines = chains.map(ch => {
                const pts = ch.nodes.map(v => ({ x: nX[v], y: nY[v], r: nR[v] }));
                const extendLeaf = (v, atStart) => {
                    if (deg[v] !== 1 || nR[v] > 8 * h) return;
                    const t = nTri[v];
                    let best = -1, bestTurn = cornerMin;
                    for (let k = 0; k < 3; k++) {
                        const s = tv[3 * t + k];
                        if (s < N && sCorner[s] > bestTurn) { bestTurn = sCorner[s]; best = s; }
                    }
                    if (best >= 0) {
                        const tip = { x: sx[best], y: sy[best], r: 0 };
                        if (atStart) pts.unshift(tip); else pts.push(tip);
                    }
                };
                extendLeaf(ch.nodes[0], true);
                extendLeaf(ch.nodes[ch.nodes.length - 1], false);
                // 平滑 (端點固定)
                for (let iter = 0; iter < 2; iter++) {
                    if (pts.length < 3) break;
                    const prev = pts.map(p => ({ x: p.x, y: p.y, r: p.r }));
                    for (let i = 1; i < pts.length - 1; i++) {
                        pts[i].x = 0.25 * prev[i - 1].x + 0.5 * prev[i].x + 0.25 * prev[i + 1].x;
                        pts[i].y = 0.25 * prev[i - 1].y + 0.5 * prev[i].y + 0.25 * prev[i + 1].y;
                        pts[i].r = 0.25 * prev[i - 1].r + 0.5 * prev[i].r + 0.25 * prev[i + 1].r;
                    }
                }
                // 深度一律以「到輪廓的精確距離」為上限，確保刀具圓錐不會削出輪廓之外
                pts.forEach(p => { if (p.r > 0) p.r = Math.min(p.r, distToBoundary(p.x, p.y)); });
                const out = pts.map(p => ({ x: p.x, y: p.y, z: zOf(p.r), r: p.r }));
                return { a: ch.nodes[0], b: ch.nodes[ch.nodes.length - 1], pts: vc2Simplify3D(out, opts.simplifyTol) };
            });

            // ---- 10. 串成連續刀路：路口處選擇「最直」的延續方向 ----
            const incident = Array.from({ length: V }, () => []);
            polylines.forEach((pl, ci) => {
                incident[pl.a].push(ci);
                if (pl.b !== pl.a) incident[pl.b].push(ci);
            });
            const usedChain = new Uint8Array(polylines.length);
            const dirFrom = (pts, fromEnd, dist) => {
                // 取離端點約 dist 遠的點，回傳單位方向向量 (由端點指向內側)
                const n = pts.length;
                const p0 = fromEnd ? pts[n - 1] : pts[0];
                let acc = 0, q = p0;
                for (let k = 1; k < n; k++) {
                    const c = fromEnd ? pts[n - 1 - k] : pts[k];
                    acc += Math.hypot(c.x - q.x, c.y - q.y); q = c;
                    if (acc >= dist) break;
                }
                const dx = q.x - p0.x, dy = q.y - p0.y, l = Math.hypot(dx, dy) || 1;
                return { x: dx / l, y: dy / l };
            };
            const startOrder = [];
            for (let v = 0; v < V; v++) if (incident[v].length) startOrder.push(v);
            startOrder.sort((p, q) => {
                const dp = deg[p] === 1 ? 0 : 1, dq = deg[q] === 1 ? 0 : 1;
                return dp !== dq ? dp - dq : nR[p] - nR[q];
            });
            const trails = [];
            for (const s of startOrder) {
                for (;;) {
                    if (!incident[s].some(ci => !usedChain[ci])) break;
                    const trail = [];
                    let cur = s, din = null;
                    for (;;) {
                        const cands = incident[cur].filter(ci => !usedChain[ci]);
                        if (!cands.length) break;
                        let pick = cands[0], pickFwd = polylines[pick].a === cur, bestDot = -Infinity;
                        if (din) {
                            for (const ci of cands) {
                                const pl = polylines[ci];
                                const fwd = pl.a === cur;
                                const d = dirFrom(pl.pts, !fwd, 0.6);
                                const dot = d.x * din.x + d.y * din.y;
                                if (dot > bestDot) { bestDot = dot; pick = ci; pickFwd = fwd; }
                            }
                        }
                        const pl = polylines[pick];
                        usedChain[pick] = 1;
                        const seq = pickFwd ? pl.pts : pl.pts.slice().reverse();
                        for (let k = trail.length ? 1 : 0; k < seq.length; k++) trail.push(seq[k]);
                        cur = pickFwd ? pl.b : pl.a;
                        const back = dirFrom(trail, true, 0.6);       // 指向「來的方向」
                        din = { x: -back.x, y: -back.y };               // 前進方向
                    }
                    if (trail.length >= 2) trails.push(trail);
                }
            }

            // ---- 11. 中軸線退化成一個點的區域 (圓形、小圓點)：在該點直接下刀 (鑽孔式)，深度由內切圓決定 ----
            // 只有在附近沒有其他刀路 (該區域沒被覆蓋) 時才需要；緊貼在既有刀路旁的孤立節點只是合併造成的殘留。
            const covered = [];
            trails.forEach(t => t.forEach(p => covered.push(p)));
            for (let v = 0; v < V; v++) {
                if (deg[v] !== 0 || !(nR[v] > 0.02)) continue;
                const reach = 2 * h;
                let near = false;
                for (let k = 0; k < covered.length && !near; k++) {
                    if (Math.hypot(covered[k].x - nX[v], covered[k].y - nY[v]) < reach) near = true;
                }
                if (near) continue;
                const z = zOf(nR[v]);
                const a = { x: nX[v], y: nY[v], z: z, r: nR[v] }, b = { x: nX[v] + 0.02, y: nY[v], z: z, r: nR[v] };
                trails.push([a, b]);
                covered.push(a);
            }
            return trails;
        }

        // VC 2.0 入口：輸入「外輪廓 + 孔洞」，輸出已排序的 V 雕刻刀路 (每個點含 x, y, z, r)
        function computeNestedVCarve2(shape, cfg) {
            const isBallNose = (cfg.toolType === 'ballnose');
            const toolRadius = cfg.d / 2.0;
            const tanHalf = Math.tan(((cfg.vbitAngle || 90) / 2) * Math.PI / 180);
            const maxDepth = cfg.depth || 3.0;
            const zOf = (r) => {
                const z = isBallNose
                    ? (r >= toolRadius ? -maxDepth : -(toolRadius - Math.sqrt(Math.max(0, toolRadius * toolRadius - r * r))))
                    : -r / tanHalf;
                return Math.max(-maxDepth, z);
            };

            // 輪廓修整的容許弧高：跟著使用者設定的「平滑簡化度」走 (簡化度越大，折線越粗，磨順的容許值也越大)
            const smoothEl = document.getElementById('smooth-range');
            const smoothTol = smoothEl ? (parseFloat(smoothEl.value) || 0.1) : 0.1;

            const loops = [shape.outer, ...shape.holes];
            let perimeter = 0;
            loops.forEach(L => {
                for (let i = 0; i < L.length; i++) {
                    const a = L[i], b = L[(i + 1) % L.length];
                    perimeter += Math.hypot(b.x - a.x, b.y - a.y);
                }
            });
            // 取樣間距：越小越精準，但三角剖分越慢；總點數上限約 12 萬
            const h = Math.max(Math.min(0.6, Math.max(0.15, cfg.resolution * 1.5)), perimeter / 120000);

            try {
                const trails = vc2MedialAxisStrokes(loops, {
                    h: h,
                    theta: VC2_CORNER_ANGLE,
                    zOf: zOf,
                    pruneLen: Math.max(0.6, 3 * h),
                    fair: 2,
                    cornerTurn: VC2_CORNER_TURN,
                    sagitta: Math.max(0.15, smoothTol * 1.5),
                    simplifyTol: Math.max(0.01, cfg.resolution * 0.2)
                });
                trails.forEach(t => t.forEach(p => { if (Math.abs(p.z) < 5e-4) p.z = 0; }));
                const cleaned = trails.map(t => cleanPath(t, cfg.resolution)).filter(t => t.length >= 2);
                return optimizePathOrder(cleaned, 0, 0);
            } catch (err) {
                // 三角剖分遇到數值退化時，退回 1.x 的演算法，確保仍能產生路徑
                console.warn('VC 2.0 引擎失敗，改用舊演算法：', err && err.message);
                return computeNestedVCarveLegacy(shape, cfg);
            }
        }


        // 依需求渲染：只有視角/內容/尺寸改變時才重繪，閒置時不佔用 GPU
        let renderQueued = false;
        function requestRender() {
            if (renderQueued || !renderer || !scene || !camera) return;
            renderQueued = true;
            requestAnimationFrame(() => {
                renderQueued = false;
                renderer.render(scene, camera);
            });
        }
        function animate() {
            if (controls) controls.update();
            requestRender();
        }

        // 釋放 Three.js 物件的 GPU 資源 (幾何/材質)
        function disposeObject3D(root) {
            root.traverse(o => {
                if (o.geometry) o.geometry.dispose();
                if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
            });
        }

        function initThreeJS() {
            container = document.getElementById('three-container');
            if (!container) return;
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x020617);
            container.appendChild(renderer.domElement);
            camera.up.set(0, 0, 1); // 必須在建立 OrbitControls 之前設定
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            // 初始視角：等角視圖 (從 +X、-Y、+Z 方向看向原點，仰角約 35.26°、方位角 45°)；
            // Z 軸朝上，所以旋轉視角時是繞著 Z 軸轉
            const ISO_DIST = 250, ISO_K = ISO_DIST / Math.sqrt(3);
            camera.position.set(ISO_K, -ISO_K, ISO_K);
            controls.addEventListener('change', requestRender);
            
            updateGridHelper();

            window.addEventListener('resize', () => {
                if (!container || !camera || !renderer) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
                requestRender();
            });

            animate();
        }

        let currentTheme = localStorage.getItem('gordix-theme') || 'dark';

                }
                localStorage.setItem('gordix-theme', 'dark');
                currentTheme = 'dark';
            } else {
                elHtml.classList.remove('dark');
                if (themeIcon) {
                    themeIcon.setAttribute('fill', 'none');
                    themeIcon.setAttribute('stroke', 'currentColor');
                    themeIcon.setAttribute('stroke-width', '2');
                    themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
                }
                localStorage.setItem('gordix-theme', 'light');
                currentTheme = 'light';
            }
            
            updateThreeJSTheme(theme === 'dark');
        }

        function updateThreeJSTheme(isDark) {
            if (!renderer || !scene) return;

        window.onload = () => {
            initThreeJS();
            applyTheme(currentTheme);

                fileExtension = file.name.split('.').pop().toLowerCase();
                fileNameDisplay.innerText = file.name;
                isNewFileLoad = true;
                
                const r = new FileReader();
                r.onload = (event) => {
                    rawFileData = event.target.result;

                    if (isImg) {
                        document.getElementById('threshold-container').classList.remove('hidden');
                        document.getElementById('relief-container').classList.remove('hidden');

                    document.getElementById('process-img-btn').click();
                };

                const isImg = ["jpg","jpeg","png","bmp","webp"].includes(fileExtension);
                if (isImg) {
                    r.readAsDataURL(file);
                } else {
                    r.readAsText(file);
                }
            };

            document.getElementById('process-img-btn').onclick = async () => {
                if(!rawFileData) return;
                
                let targetWInput = document.getElementById('target-width');
                let targetW = parseFloat(targetWInput.value) || 100;
                const smoothTol = parseFloat(document.getElementById('smooth-range').value);
                
                let vectorPaths = []; 

                if (["jpg","jpeg","png","bmp","webp"].includes(fileExtension)) {
                    vectorPaths = await parseBitmap(rawFileData, targetW, smoothTol);
                } else if (fileExtension === 'svg') {
                    const rawPaths = parseSVG(rawFileData, smoothTol);
                    if (isNewFileLoad) {
                        const origW = getPathsWidth(rawPaths);
                        if (origW > 0) {
                            targetW = parseFloat(origW.toFixed(2));
                            targetWInput.value = targetW;
                        }
                    }
                    vectorPaths = scaleVectorPaths(rawPaths, targetW);
                } else if (fileExtension === 'dxf') {
                    const rawPaths = parseDXF(rawFileData, smoothTol);
                    if (isNewFileLoad) {
                        const origW = getPathsWidth(rawPaths);
                        if (origW > 0) {
                            targetW = parseFloat(origW.toFixed(2));
                            targetWInput.value = targetW;
                        }
                    }
                    vectorPaths = scaleVectorPaths(rawPaths, targetW);
                }

                isNewFileLoad = false;

                if (vectorPaths.length > 0) {
                    processVectorIntoParts(vectorPaths);
                }
            };

            document.getElementById('select-all').onclick = () => {
                const vis = parts.map((p, i) => p.visible ? i : -1).filter(idx => idx !== -1);
                if (vis.length === 0) return;
                if (vis.every(idx => selectedIndices.has(idx))) vis.forEach(idx => selectedIndices.delete(idx));
                else vis.forEach(idx => selectedIndices.add(idx));
                renderPartList(); updateJobUI(); update3D();

                if(selectedIndices.size === 0) return;

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                selectedIndices.forEach(idx => { parts[idx].rawPath.forEach(pt => { minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x); minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y); }); });
                document.getElementById('resize-h').value = (val * (maxY - minY) / (maxX - minX)).toFixed(2);
            };

            document.getElementById('job-f').oninput = (e) => {
                const val = parseFloat(e.target.value);
                if (!val || val <= 0) return;
                selectedIndices.forEach(idx => {
                    if (parts[idx]) {
                        parts[idx].jobConfig.f = val;
                    }
                });
                updateStats();
            };

                const curVal = document.getElementById('vcarve-layer-select').value;
                selectedIndices.forEach(idx => {

                });
                renderPartList();
                update3D();
            };

                if (e.target.checked) {
                    const reliefCheck = document.getElementById('relief-25d-check');
