        function calculateStandardToolpath(p, groupScale) {
            const cfg = p.jobConfig, scale = 10000;
            const scaledPath = p.rawPath.map(pt => ({ x: pt.x * groupScale, y: pt.y * groupScale }));
            const pX = scaledPath.map(pt => ({ X: Math.round(pt.x * scale), Y: Math.round(pt.y * scale) }));
            let intermediatePaths = [];
            if (cfg.type === 'laser') {
                intermediatePaths.push([...scaledPath, scaledPath[0]]);
            } else {
                const co = new ClipperLib.ClipperOffset();
                co.AddPath(pX, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
                let delta = cfg.type === 'outer' ? (cfg.d/2)*scale : -(cfg.d/2)*scale;
                let offsetResult = new ClipperLib.Paths();
                co.Execute(offsetResult, delta);
                offsetResult.forEach(pts => {
                    let loop = pts.map(pt => ({ x: pt.X/scale, y: pt.Y/scale })); 
                    if(loop.length > 0) loop.push(loop[0]);
                    intermediatePaths.push(loop);
                });
            }
            return intermediatePaths.map(path => cleanPath(path, cfg.resolution));
        }

        function calculateV3PocketPaths(groupScale) {
            const scale = 10000;
            const selectedArr = Array.from(selectedIndices);
            const allClipperPaths = selectedArr.map(idx => {
                return parts[idx].rawPath.map(pt => ({ X: Math.round(pt.x * groupScale * scale), Y: Math.round(pt.y * groupScale * scale) }));
            });
            const cl = new ClipperLib.Clipper();
            cl.AddPaths(allClipperPaths, ClipperLib.PolyType.ptSubject, true);
            const polyTree = new ClipperLib.PolyTree();
            cl.Execute(ClipperLib.ClipType.ctUnion, polyTree, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
            const firstIdx = selectedArr[0];
            const cfg = parts[firstIdx].jobConfig;
            
            const pocketContourPaths = [];
            const pocketScanPaths = [];

            function traverseTree(node) {
                const children = node.Childs();
                for (let i = 0; i < children.length; i++) {
                    const outerNode = children[i];
                    if (!outerNode.IsHole()) {
                        const subjectPath = outerNode.Contour();
                        const islands = outerNode.Childs().map(n => n.Contour());
                        if (islands.length > 0) {
                            const islandOffsetter = new ClipperLib.ClipperOffset();
                            islands.forEach(isl => islandOffsetter.AddPath(isl, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon));
                            let islandOuters = new ClipperLib.Paths();
                            islandOffsetter.Execute(islandOuters, (cfg.d/2)*scale);
                            islandOuters.forEach(l => {
                                let p = l.map(pt => ({ x: pt.X/scale, y: pt.Y/scale })); 
                                if(p.length > 0) p.push(p[0]);
                                pocketContourPaths.push(cleanPath(p, cfg.resolution));
                            });
                        }
                        const subjectOffsetter = new ClipperLib.ClipperOffset();
                        subjectOffsetter.AddPath(subjectPath, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
                        let subjectInners = new ClipperLib.Paths();
                        subjectOffsetter.Execute(subjectInners, -(cfg.d/2)*scale);
                        subjectInners.forEach(l => {
                            let p = l.map(pt => ({ x: pt.X/scale, y: pt.Y/scale })); 
                            if(p.length > 0) p.push(p[0]);
                            pocketContourPaths.push(cleanPath(p, cfg.resolution));
                        });
                        const scanPaths = computeScanlinePocket(subjectPath, islands, cfg, scale);
                        pocketScanPaths.push(...scanPaths);
                        outerNode.Childs().forEach(holeNode => traverseTree(holeNode));
                    }
                }
            }
            traverseTree(polyTree);
            
            selectedArr.forEach(idx => {
                if (idx === firstIdx) {
                    parts[idx].pocketContourPaths = pocketContourPaths;
                    parts[idx].pocketScanPaths = pocketScanPaths;
                    parts[idx].toolpath = [...pocketContourPaths, ...pocketScanPaths];
                } else {
                    parts[idx].pocketContourPaths = [];
                    parts[idx].pocketScanPaths = [];
                    parts[idx].toolpath = [];
                }
                parts[idx].appliedMethod = 'pocket';
            });
        }

        function computeScanlinePocket(subject, islands, cfg, scale) {
            const toolRadius = (cfg.d / 2) * scale;
            const shrinkAmount = (cfg.d * 0.5) * scale;
            const co = new ClipperLib.ClipperOffset();
            co.AddPath(subject, ClipperLib.JoinType.jtMiter, ClipperLib.EndType.etClosedPolygon);
            let outerBound = new ClipperLib.Paths();
            co.Execute(outerBound, -toolRadius);
            let workingArea = outerBound;
            if (islands.length > 0 && outerBound.length > 0) {
                let islandNoGo = new ClipperLib.Paths();
                const coIsl = new ClipperLib.ClipperOffset();
                islands.forEach(isl => coIsl.AddPath(isl, ClipperLib.JoinType.jtMiter, ClipperLib.EndType.etClosedPolygon));
                coIsl.Execute(islandNoGo, toolRadius);
                const cl = new ClipperLib.Clipper();
                cl.AddPaths(outerBound, ClipperLib.PolyType.ptSubject, true);
                cl.AddPaths(islandNoGo, ClipperLib.PolyType.ptClip, true);
                let finalArea = new ClipperLib.Paths();
                cl.Execute(ClipperLib.ClipType.ctDifference, finalArea, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
                workingArea = finalArea;
            }
            if (workingArea.length === 0) return [];
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            workingArea.forEach(p => p.forEach(pt => { 
                minX = Math.min(minX, pt.X); maxX = Math.max(maxX, pt.X); 
                minY = Math.min(minY, pt.Y); maxY = Math.max(maxY, pt.Y); 
            }));
            const scanStep = Math.max(1, (cfg.d * (1 - cfg.overlap)) * scale);
            let segmentGroups = [];
            for (let y = minY + scanStep/2; y <= maxY; y += scanStep) {
                const scanLine = [{X: minX - 100, Y: Math.round(y)}, {X: maxX + 100, Y: Math.round(y)}];
                const cl = new ClipperLib.Clipper();
                cl.AddPath(scanLine, ClipperLib.PolyType.ptSubject, false);
                cl.AddPaths(workingArea, ClipperLib.PolyType.ptClip, true);
                const segmentsTree = new ClipperLib.PolyTree();
                cl.Execute(ClipperLib.ClipType.ctIntersection, segmentsTree, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
                const openPaths = ClipperLib.Clipper.PolyTreeToPaths(segmentsTree);
                if (openPaths.length > 0) {
                    openPaths.sort((a,b) => a[0].X - b[0].X);
                    openPaths.forEach((path, groupIdx) => {
                        if (!segmentGroups[groupIdx]) segmentGroups[groupIdx] = [];
                        segmentGroups[groupIdx].push(path);
                    });
                }
            }
            const optimizedPaths = [];
            segmentGroups.forEach(group => {
                let reverse = false;
                group.forEach(path => {
                    if (path.length >= 2) {
                        const p1 = path[0], p2 = path[path.length - 1];
                        const dx = p2.X - p1.X, dy = p2.Y - p1.Y;
                        const len = Math.sqrt(dx*dx + dy*dy);
                        if (len > shrinkAmount * 2.5) { 
                            const unitX = dx / len, unitY = dy / len;
                            p1.X = Math.round(p1.X + unitX * shrinkAmount);
                            p1.Y = Math.round(p1.Y + unitY * shrinkAmount);
                            p2.X = Math.round(p2.X - unitX * shrinkAmount);
                            p2.Y = Math.round(p2.Y - unitY * shrinkAmount);
                        }
                    }
                    let p = path.map(pt => ({ x: pt.X / scale, y: pt.Y / scale }));
                    if (reverse) p.reverse();
                    optimizedPaths.push(p);
                    reverse = !reverse;
                });
            });
            return optimizedPaths;
        }

        // --- 3D 渲染更新 ---
        // 釋放舊場景物件的 GPU 資源 (原本只從場景移除而未 dispose，會持續累積記憶體)
        function disposeSceneChildren() {
            const old = scene.children.slice();
            const geos = new Set(), mats = new Set();
            old.forEach(obj => {
                if (obj.geometry) geos.add(obj.geometry);
                if (obj.material) (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => mats.add(m));
            });
            geos.forEach(g => g.dispose());
            mats.forEach(m => m.dispose());
            if (old.length) scene.remove.apply(scene, old);
        }

        function makeLineGeometry(pts, z, zArr) {
            const n = pts.length;
            const arr = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                arr[i * 3] = pts[i].x;
                arr[i * 3 + 1] = pts[i].y;
                arr[i * 3 + 2] = zArr ? zArr[i] : z;
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
            return g;
        }

        function update3D() {
            disposeSceneChildren();
            
            const isDark = document.documentElement.classList.contains('dark');
            const gridColor1 = isDark ? 0x334155 : 0xcbd5e1;
            const gridColor2 = isDark ? 0x1e293b : 0xf1f5f9;

            // 計算當前顯示零件的整體邊界，動態調整格線範圍 (固定每一格 50mm)
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            let hasVisibleParts = false;
            parts.forEach(p => {
                if(!p.visible) return;
                const rp = p.rawPath;
                for (let k = 0; k < rp.length; k++) {
                    const pt = rp[k];
                    if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
                    if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
                    hasVisibleParts = true;
                }
            });

            let gridSize = 300; // 預設未載入或無零件時的網格大小
            if (hasVisibleParts) {
                const maxDim = Math.max(maxX - minX, maxY - minY);
                // 預留適當邊緣空間，並向上取整為 100 的倍數，確保 divisions (50mm一格) 恆為整數
                gridSize = Math.max(100, Math.ceil((maxDim + 100) / 100) * 100);
            }
            const divisions = Math.round(gridSize / 50);

            const grid = new THREE.GridHelper(gridSize, divisions, gridColor1, gridColor2);
            grid.rotateX(Math.PI / 2);
            scene.add(grid);
            
            parts.forEach((p, idx) => {
                if(!p.visible) return;
                const isSelected = selectedIndices.has(idx);
                const color = isSelected ? 0x22c55e : (isDark ? 0xFFFFFF : 0x475569);
                const opacity = isSelected ? 0.8 : 0.5;
                const geomOrig = makeLineGeometry(p.rawPath, 0);
                scene.add(new THREE.LineLoop(geomOrig, new THREE.LineBasicMaterial({ color: color, opacity: opacity, transparent: true })));
                if(p.toolpath && p.toolpath.length > 0) {
                    const cfg = p.jobConfig, passes = cfg.type === 'laser' ? 1 : Math.ceil(cfg.depth / cfg.step);
                    const contourSet = (cfg.type === 'pocket' && p.pocketContourPaths) ? new Set(p.pocketContourPaths) : null;
                    // 非橋位的路徑各層形狀相同，只差 Z 高度：幾何只建一次，以 position.z 位移後重複使用
                    const flatGeoms = new Map();
                    for(let i=0; i<passes; i++){
                        const currentZ = cfg.type === 'laser' ? 0.2 : -(Math.min(cfg.depth, (i + 1) * cfg.step)) + 0.2;
                        const matTool = new THREE.LineBasicMaterial({ color: 0xfacc15, opacity: 1.0 - (i * 0.1), transparent: true });
                        p.toolpath.forEach(path => {
                            const isContourPath = (cfg.type === 'outer' || cfg.type === 'inner' || (contourSet !== null && contourSet.has(path)));
                            // 每一層只要深度低於橋位頂面就要保留橋位 (橋高可大於每層下刀量)
                            const layerZ = currentZ - 0.2;
                            const tabInfo = (cfg.useTab && isContourPath && cfg.type !== 'laser' && layerZ < getTabTopZ(cfg) - 1e-6) ? getTabbedPath(path, cfg) : null;
                            if (tabInfo) {
                                const tabZVal = getTabTopZ(cfg) + 0.2;
                                const zArr = new Float32Array(tabInfo.pts.length);
                                for (let k = 0; k < tabInfo.pts.length; k++) zArr[k] = tabInfo.flags[k] ? tabZVal : currentZ;
                                scene.add(new THREE.Line(makeLineGeometry(tabInfo.pts, 0, zArr), matTool));
                            } else {
                                let geomTool = flatGeoms.get(path);
                                if (!geomTool) { geomTool = makeLineGeometry(path, 0); flatGeoms.set(path, geomTool); }
                                const line = new THREE.Line(geomTool, matTool);
                                line.position.z = currentZ;
                                scene.add(line);
                            }
                        });
                    }
                }
            });
            requestRender();
        }

        function updateStats() {
            let totalSec = 0;
            let currentX = 0, currentY = 0;
            let currentZ = parseFloat(SAFE_Z) || 2.0; 
            const SAFE_Z_VAL = parseFloat(SAFE_Z) || 2.0;

            const G0_SPEED = 2000;      
            const PLUNGE_SPEED = 300;   

            let activeParts = parts.filter(p => p.visible && p.toolpath && p.toolpath.length > 0);
            if (activeParts.length === 0) {
                document.getElementById('est-time').innerText = "00:00:00";
                return;
            }

            const orderPriority = { "laser": 0, "pocket": 1, "inner": 2, "outer": 3 };
            const grouped = {};
            activeParts.forEach(p => {
                const type = p.jobConfig.type;
                if (!grouped[type]) grouped[type] = [];
                grouped[type].push(p);
            });

            const sortedTypes = Object.keys(grouped).sort((a, b) => (orderPriority[a] ?? 99) - (orderPriority[b] ?? 99));

            sortedTypes.forEach(type => {
                let unvisitedInGroup = [...grouped[type]];
                
                unvisitedInGroup.forEach(p => {
                    if (p.nestingDepth === undefined) p.nestingDepth = 0;
                });

                while (unvisitedInGroup.length > 0) {
                    let maxRemainingDepth = -1;
                    unvisitedInGroup.forEach(p => {
                        if (p.nestingDepth > maxRemainingDepth) maxRemainingDepth = p.nestingDepth;
                    });

                    let nearestIdx = -1;
                    let minDistSq = Infinity;
                    for (let i = 0; i < unvisitedInGroup.length; i++) {
                        const p = unvisitedInGroup[i];
                        if (p.nestingDepth !== maxRemainingDepth) continue;

                        const firstPath = p.toolpath[0];
                        if (!firstPath || firstPath.length === 0) continue;
                        const dx = firstPath[0].x - currentX;
                        const dy = firstPath[0].y - currentY;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < minDistSq) { minDistSq = distSq; nearestIdx = i; }
                    }

                    if (nearestIdx === -1) {
                        for (let i = 0; i < unvisitedInGroup.length; i++) {
                            const firstPath = unvisitedInGroup[i].toolpath[0];
                            if (!firstPath || firstPath.length === 0) continue;
                            const dx = firstPath[0].x - currentX;
                            const dy = firstPath[0].y - currentY;
                            const distSq = dx * dx + dy * dy;
                            if (distSq < minDistSq) { minDistSq = distSq; nearestIdx = i; }
                        }
                    }

                    if (nearestIdx === -1) break;

                    const p = unvisitedInGroup.splice(nearestIdx, 1)[0];
                    const cfg = p.jobConfig;
                    const isLaser = cfg.type === 'laser';
                    const passes = isLaser ? 1 : Math.ceil(cfg.depth / cfg.step);
                    const cuttingFeedrate = cfg.f || 1000; 

                    let lastPointOfPart = null;

                    let phases = [];
                    if (cfg.type === 'pocket') {
                        phases = [
                            { paths: p.pocketScanPaths || [], isContour: false },
                            { paths: p.pocketContourPaths || [], isContour: true }
                        ];
                    } else {
                        phases = [
                            { paths: p.toolpath || [], isContour: (cfg.type === 'outer' || cfg.type === 'inner') }
                        ];
                    }

                    phases.forEach(phase => {
                        if (phase.paths.length === 0) return;
                        for (let i = 1; i <= passes; i++) {
                            const targetZ = isLaser ? 0 : -(Math.min(cfg.depth, i * cfg.step));
                            let lastPtInLayer = null;

                            phase.paths.forEach((path, pathIdx) => {
                                if (path.length < 2) return;
                                
                                const tabInfo = (!isLaser && cfg.useTab && phase.isContour && targetZ < getTabTopZ(cfg) - 1e-6) ? getTabbedPath(path, cfg) : null;
                                const finalPath = tabInfo ? tabInfo.pts : path;
                                const tabZVal = tabInfo ? getTabTopZ(cfg) : targetZ;

                                const start = finalPath[0];
                                const startZ = tabInfo && tabInfo.flags[0] ? tabZVal : targetZ;

                                let needRetract = true;
                                if (i > 1 && pathIdx === 0 && lastPointOfPart) {
                                    const dToStart = Math.sqrt(Math.pow(start.x - lastPointOfPart.x, 2) + Math.pow(start.y - lastPointOfPart.y, 2));
                                    if (dToStart < 0.5) needRetract = false; 
                                } else if (lastPtInLayer) {
                                    const dToLast = Math.sqrt(Math.pow(start.x - lastPtInLayer.x, 2) + Math.pow(start.y - lastPtInLayer.y, 2));
                                    if (dToLast < (cfg.d * 1.5)) needRetract = false;
                                }

                                if (needRetract) {
                                    if (!isLaser) {
                                        const travelZToSafe = Math.abs(currentZ - SAFE_Z_VAL);
                                        totalSec += (travelZToSafe / G0_SPEED) * 60;
                                        currentZ = SAFE_Z_VAL;
                                    }

                                    const travelXY = Math.sqrt(Math.pow(start.x - currentX, 2) + Math.pow(start.y - currentY, 2));
                                    totalSec += (travelXY / G0_SPEED) * 60;
                                    currentX = start.x;
                                    currentY = start.y;

                                    if (!isLaser) {
                                        const plungeZ = Math.abs(currentZ - startZ);
                                        totalSec += (plungeZ / PLUNGE_SPEED) * 60;
                                        currentZ = startZ;
                                    }
                                } else {
                                    if (!isLaser) {
                                        const plungeZ = Math.abs(currentZ - startZ);
                                        totalSec += (plungeZ / PLUNGE_SPEED) * 60;
                                        currentZ = startZ;
                                    }
                                    const travelXY = Math.sqrt(Math.pow(start.x - currentX, 2) + Math.pow(start.y - currentY, 2));
                                    totalSec += (travelXY / cuttingFeedrate) * 60;
                                    currentX = start.x;
                                    currentY = start.y;
                                }

                                let lastZ = startZ;
                                for (let j = 1; j < finalPath.length; j++) {
                                    const pt = finalPath[j];
                                    const ptZ = tabInfo && tabInfo.flags[j] ? tabZVal : targetZ;
                                    const segmentDist = Math.sqrt(Math.pow(pt.x - finalPath[j - 1].x, 2) + Math.pow(pt.y - finalPath[j - 1].y, 2));
                                    const zDist = Math.abs(ptZ - lastZ);
                                    
                                    const totalTravel = Math.sqrt(segmentDist * segmentDist + zDist * zDist);
                                    totalSec += (totalTravel / cuttingFeedrate) * 60;
                                    lastZ = ptZ;
                                }

                                const lastPtInPath = finalPath[finalPath.length - 1];
                                currentX = lastPtInPath.x;
                                currentY = lastPtInPath.y;
                                currentZ = tabInfo && tabInfo.flags[finalPath.length - 1] ? tabZVal : targetZ;

                                lastPtInLayer = lastPtInPath;
                                lastPointOfPart = lastPtInPath;
                            });
                        }
                    });

                    if (!isLaser) {
                        const travelZToSafe = Math.abs(currentZ - SAFE_Z_VAL);
                        totalSec += (travelZToSafe / G0_SPEED) * 60;
                        currentZ = SAFE_Z_VAL;
                    }

                    if (lastPointOfPart) {
                        currentX = lastPointOfPart.x;
                        currentY = lastPointOfPart.y;
                    }
                }
            });

            const returnXY = Math.sqrt(currentX * currentX + currentY * currentY);
            totalSec += (returnXY / G0_SPEED) * 60;
            currentX = 0;
            currentY = 0;

            const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = Math.floor(totalSec % 60);
            document.getElementById('est-time').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        // --- 產生 Gcode 輸出 ---
        document.getElementById('export-gcode').onclick = () => {
            if(parts.length === 0) return;
            {
                let tabMsgs = [];
                parts.forEach(p => { if (p.visible && p.toolpath && p.toolpath.length) tabMsgs = tabMsgs.concat(collectTabWarnings(p)); });
                if (tabMsgs.length) {
                    const head = currentLang === 'zh' ? '橋位有以下警告：' : 'Tab warnings:';
                    const tail = currentLang === 'zh' ? '仍要輸出 G-code 嗎？' : 'Export G-code anyway?';
                    if (!confirm(head + '\n\n' + tabMsgs.map(m => '• ' + m).join('\n') + '\n\n' + tail)) return;
                }
            }
            let gc = ["; CNC V4.0", "G21", "G90", "G0 X0 Y0 F2000"];
            
            const orderPriority = { "laser": 0, "pocket": 1, "inner": 2, "outer": 3 };
            let activeParts = parts.filter(p => p.visible && p.toolpath && p.toolpath.length > 0);
            if (activeParts.length === 0) return;
            const grouped = {};
            activeParts.forEach(p => {
                const type = p.jobConfig.type;
                if (!grouped[type]) grouped[type] = [];
                grouped[type].push(p);
            });
            let currentX = 0, currentY = 0;
            let currentZ = parseFloat(SAFE_Z) || 2.0; 
            const SAFE_Z_VAL = parseFloat(SAFE_Z) || 2.0;
            let currentG1F = null; 
            
            const sortedTypes = Object.keys(grouped).sort((a, b) => (orderPriority[a] ?? 99) - (orderPriority[b] ?? 99));
            sortedTypes.forEach(type => {
                let unvisitedInGroup = [...grouped[type]];
                
                unvisitedInGroup.forEach(p => {
                    if (p.nestingDepth === undefined) p.nestingDepth = 0;
                });

                while (unvisitedInGroup.length > 0) {
                    let maxRemainingDepth = -1;
                    unvisitedInGroup.forEach(p => {
                        if (p.nestingDepth > maxRemainingDepth) maxRemainingDepth = p.nestingDepth;
                    });

                    let nearestIdx = -1;
                    let minDistSq = Infinity;
                    for (let i = 0; i < unvisitedInGroup.length; i++) {
                        const p = unvisitedInGroup[i];
                        if (p.nestingDepth !== maxRemainingDepth) continue;

                        const firstPath = p.toolpath[0];
                        if (!firstPath || firstPath.length === 0) continue;
                        const dx = firstPath[0].x - currentX;
                        const dy = firstPath[0].y - currentY;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < minDistSq) { minDistSq = distSq; nearestIdx = i; }
                    }

                    if (nearestIdx === -1) {
                        for (let i = 0; i < unvisitedInGroup.length; i++) {
                            const firstPath = unvisitedInGroup[i].toolpath[0];
                            if (!firstPath || firstPath.length === 0) continue;
                            const dx = firstPath[0].x - currentX;
                            const dy = firstPath[0].y - currentY;
                            const distSq = dx * dx + dy * dy;
                            if (distSq < minDistSq) { minDistSq = distSq; nearestIdx = i; }
                        }
                    }

                    if (nearestIdx === -1) break;
                    const p = unvisitedInGroup.splice(nearestIdx, 1)[0];
                    const cfg = p.jobConfig, isLaser = cfg.type === 'laser', passes = isLaser ? 1 : Math.ceil(cfg.depth / cfg.step);
                    let lastPointOfPart = null;

                    let phases = [];
                    if (cfg.type === 'pocket') {
                        phases = [
                            { paths: p.pocketScanPaths || [], isContour: false },
                            { paths: p.pocketContourPaths || [], isContour: true }
                        ];
                    } else {
                        phases = [
                            { paths: p.toolpath || [], isContour: (cfg.type === 'outer' || cfg.type === 'inner') }
                        ];
                    }

                    phases.forEach(phase => {
                        if (phase.paths.length === 0) return;
                        for (let i = 1; i <= passes; i++) {
                            const targetZ = isLaser ? 0 : -(Math.min(cfg.depth, i * cfg.step)).toFixed(3);
                            let lastPtInLayer = null;
                            phase.paths.forEach((path, pathIdx) => {
                                if (path.length < 2) return;
                                
                                const tabInfo = (!isLaser && cfg.useTab && phase.isContour && targetZ < getTabTopZ(cfg) - 1e-6) ? getTabbedPath(path, cfg) : null;
                                const finalPath = tabInfo ? tabInfo.pts : path;
                                const tabZVal = tabInfo ? getTabTopZ(cfg) : targetZ;

                                const start = finalPath[0];
                                const startZ = tabInfo && tabInfo.flags[0] ? tabZVal : targetZ;

                                let needRetract = true;
                                if (i > 1 && pathIdx === 0 && lastPointOfPart) {
                                    const dToStart = Math.sqrt(Math.pow(start.x - lastPointOfPart.x, 2) + Math.pow(start.y - lastPointOfPart.y, 2));
                                    if (dToStart < 0.5) needRetract = false; 
                                } else if (lastPtInLayer) {
                                    const dToLast = Math.sqrt(Math.pow(start.x - lastPtInLayer.x, 2) + Math.pow(start.y - lastPtInLayer.y, 2));
                                    if (dToLast < (cfg.d * 1.5)) needRetract = false;
                                }
                                
                                if (needRetract) {
                                    if (!isLaser) {
                                        if (Math.abs(currentZ - SAFE_Z_VAL) > 0.001) {
                                            gc.push(`G0 Z${SAFE_Z_VAL.toFixed(3)}`);
                                            currentZ = SAFE_Z_VAL;
                                        }
                                    }
                                    gc.push(`G0 X${start.x.toFixed(3)} Y${start.y.toFixed(3)}`);
                                    if (!isLaser) {
                                        if (Math.abs(currentZ - startZ) > 0.001) {
                                            const fStr = (currentG1F !== 300) ? " F300" : "";
                                            gc.push(`G1 Z${startZ.toFixed(3)}${fStr}`);
                                            currentZ = startZ;
                                            currentG1F = 300;
                                        }
                                    } else {
                                        gc.push("M03 S255"); 
                                    }
                                } else {
                                    if (!isLaser) {
                                        if (Math.abs(currentZ - startZ) > 0.001) {
                                            const fStr = (currentG1F !== 300) ? " F300" : "";
                                            gc.push(`G1 Z${startZ.toFixed(3)}${fStr}`);
                                            currentZ = startZ;
                                            currentG1F = 300;
                                        }
                                        const fStr = (currentG1F !== cfg.f) ? ` F${cfg.f}` : "";
                                        gc.push(`G1 X${start.x.toFixed(3)} Y${start.y.toFixed(3)}${fStr}`);
                                        if (fStr) currentG1F = cfg.f;
                                    } else {
                                        gc.push("M03 S255"); 
                                        const fStr = (currentG1F !== cfg.f) ? ` F${cfg.f}` : "";
                                        gc.push(`G1 X${start.x.toFixed(3)} Y${start.y.toFixed(3)}${fStr}`);
                                        if (fStr) currentG1F = cfg.f;
                                    }
                                }
                                
                                let lastZ = startZ;
                                for (let j = 1; j < finalPath.length; j++) {
                                    const pt = finalPath[j];
                                    const ptZ = tabInfo && tabInfo.flags[j] ? tabZVal : targetZ;
                                    // 橋位起訖的垂直升降動作使用下刀速度 (F300)，其餘使用切削進給
                                    const isVert = !!tabInfo && Math.abs(pt.x - finalPath[j - 1].x) < 1e-6 && Math.abs(pt.y - finalPath[j - 1].y) < 1e-6;
                                    const feedNow = isVert ? 300 : cfg.f;
                                    const fStr = (currentG1F !== feedNow) ? ` F${feedNow}` : "";

                                    if (Math.abs(ptZ - lastZ) > 0.001 || Math.abs(currentZ - ptZ) > 0.001) {
                                        gc.push(`G1 X${pt.x.toFixed(3)} Y${pt.y.toFixed(3)} Z${ptZ.toFixed(3)}${fStr}`);
                                        currentZ = ptZ;
                                        lastZ = ptZ;
                                    } else {
                                        gc.push(`G1 X${pt.x.toFixed(3)} Y${pt.y.toFixed(3)}${fStr}`);
                                    }
                                    if (fStr) currentG1F = feedNow;
                                }
                                if (isLaser) {
                                    gc.push("M05"); 
                                }
                                lastPtInLayer = finalPath[finalPath.length - 1];
                                lastPointOfPart = lastPtInLayer;
                                currentZ = tabInfo && tabInfo.flags[finalPath.length - 1] ? tabZVal : targetZ;
                            });
                        }
                    });

                    if (!isLaser) {
                        if (Math.abs(currentZ - SAFE_Z_VAL) > 0.001) {
                            gc.push(`G0 Z${SAFE_Z_VAL.toFixed(3)}`);
                            currentZ = SAFE_Z_VAL;
                        }
                    }
                    if (lastPointOfPart) { currentX = lastPointOfPart.x; currentY = lastPointOfPart.y; }
                }
            });
            gc.push("G0 X0 Y0");
            const blob = new Blob([gc.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a'); 
            const blobUrl = URL.createObjectURL(blob);
            a.href = blobUrl; 
            a.download = `${originalFileName}.gcode`; 
            a.click();
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        };

        // 啟動初始化語言與明暗主題圖示
        updateLanguage();
        setTheme(savedTheme);
    </script>
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => console.log('Service Worker registered successfully with scope: ', reg.scope))
                    .catch((err) => console.error('Service Worker registration failed: ', err));
            });
        }
    </script>
</body>
