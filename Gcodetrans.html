<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-code Editor & Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        :root {
            --primary-green: #10b981;
            --accent-green: #059669;
            
            /* 暗色主題 (預設) */
            --bg-color: #111827; 
            --panel-dark: #1f2937;
            --preview-bg: #000000;
            --input-bg: #374151;
            --input-text: #ffffff;
            --input-border: #4b5563;
            --label-color: #d1d5db;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --panel-border: #374151;
            --body-text: #f3f4f6;
            --btn-secondary-bg: #374151;
            --btn-secondary-text: #e5e7eb;
            --btn-secondary-hover: #4b5563;
            --btn-secondary-border: #4b5563;
            
            --alert-bg: rgba(16, 185, 129, 0.15);
            --alert-border: rgba(16, 185, 129, 0.3);
            --alert-text: #34d399;
        }

        html:not(.dark) {
            /* 亮色主題 */
            --bg-color: #f3f4f6; 
            --panel-dark: #ffffff;
            --preview-bg: #f9fafb;
            --input-bg: #ffffff;
            --input-text: #111827;
            --input-border: #cbd5e1;
            --label-color: #374151;
            --card-shadow: rgba(0, 0, 0, 0.05);
            --panel-border: #e2e8f0;
            --body-text: #1e293b;
            --btn-secondary-bg: #f1f5f9;
            --btn-secondary-text: #334155;
            --btn-secondary-hover: #e2e8f0;
            --btn-secondary-border: #cbd5e1;
            
            --alert-bg: #ecfdf5;
            --alert-border: #a7f3d0;
            --alert-text: #047857;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--body-text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            overflow-x: hidden; 
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* 預覽視窗：核心設計強制維持 1:1 正方形 */
        #preview-container { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            background-color: var(--preview-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            border: 2px solid var(--panel-border); 
            transition: background-color 0.3s, border-color 0.3s;
            margin: 0 auto;
            touch-action: none;
        }

        /* 雙主題控制面板卡片 */
        .controls-card { 
            background: var(--panel-dark); 
            padding: 1rem; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px -1px var(--card-shadow); 
            border-top: 3px solid var(--primary-green); 
            border-left: 1px solid var(--panel-border);
            border-right: 1px solid var(--panel-border);
            border-bottom: 1px solid var(--panel-border);
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        /* 統一的主題化次級按鈕 */
        .btn-secondary {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--btn-secondary-border);
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background-color: var(--btn-secondary-hover);
        }

        /* 主題化資訊整合卡片 */
        .info-card {
            background-color: var(--panel-dark);
            border: 1px solid var(--panel-border);
            color: var(--body-text);
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        /* 主題化警告提示框 */
        .alert-success {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            color: var(--alert-text);
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        .btn-green { background-color: var(--primary-green); color: #064e3b; transition: all 0.2s; }
        .btn-green:hover { background-color: var(--accent-green); transform: translateY(-1px); }
        .btn-green:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; transform: none; }
        
        .label-text { color: var(--label-color); font-weight: 600; font-size: 0.8rem; transition: color 0.3s; }
        canvas { display: block; }
        
        /* 雙主題輸入框 */
        input[type="number"], input[type="range"] {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            padding: 0.4rem 0.6rem;
            font-size: 0.85rem;
            border-radius: 0.375rem;
            transition: all 0.3s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen p-4 md:p-8 text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300">
    <div class="max-w-7xl mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800 transition-colors duration-300">

        <!-- 頂部導航 -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-950 p-5 text-white flex justify-between items-center border-b border-emerald-500/30 shadow-lg mb-4">
            <div>
                <h1 id="txt-header-title" class="text-2xl font-black tracking-tight">
                    Gcode 即時調整
                </h1>
            </div>
            <div class="flex gap-3 items-center">
                <!-- 返回上一頁按鈕 -->
                <button onclick="if(window.history.length > 1) { window.history.back(); } else { window.location.href='index.html'; }" class="flex items-center justify-center text-slate-300 hover:text-orange-400 transition-colors font-bold bg-white/10 hover:bg-white/20 p-1.5 rounded-lg border border-white/20 cursor-pointer" title="返回上一頁 / Go Back">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <line x1="20" y1="12" x2="4" y2="12"></line>
                        <polyline points="10 18 4 12 10 6"></polyline>
                    </svg>
                </button>
                <!-- 明暗主題切換 -->
                <button onclick="toggleTheme()" class="p-1.5 rounded-lg text-[11px] font-bold bg-white/10 hover:bg-white/20 text-white border border-white/20 transition-all flex items-center justify-center" aria-label="Toggle Theme">
                    <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    </svg>
                </button>
                <!-- 語系切換 -->
                <button id="langBtn" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-white/10 hover:bg-white/20 text-white border border-white/20 transition-all flex items-center gap-2">
                    EN
                </button>
                <!-- 工藝參數建議 -->
                <a href="params.html" class="flex items-center justify-center text-slate-300 hover:text-emerald-400 transition-colors bg-white/10 hover:bg-white/20 p-1.5 rounded-lg border border-white/20 cursor-pointer" title="工藝參數建議 / Parameters Guide">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                </a>
            </div>
        </div>

        <div class="container mx-auto px-4 max-w-7xl">
            <!-- 主網格：行動端單欄，桌機端拆分為 3 - 6 - 3 三欄 -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                
                <!-- 【左側控制面板】：檔案上傳 與 參數調整 -->
                <div class="lg:col-span-3 space-y-4 order-2 lg:order-1">
                    
                    <!-- 1. 檔案上傳 -->
                    <div class="controls-card">
                        <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2 flex items-center">
                            <span id="txt-sec-upload">1. 檔案上傳</span>
                        </h2>
                        <div class="flex flex-col gap-2">
                            <button onclick="document.getElementById('fileInput').click()" class="btn-secondary w-full font-bold py-2 px-4 rounded transition text-sm flex items-center justify-center shadow-inner">
                                <svg class="w-4 h-4 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <span id="txt-btn-upload">選擇 G-code 檔案</span>
                            </button>
                            <input type="file" id="fileInput" accept=".gcode,.nc,.txt" class="hidden" />
                            
                            <!-- 檔案載入成功提示 -->
                            <div id="fileInfo" class="p-2 alert-success rounded text-[10px] font-bold hidden truncate">
                                <span id="txt-file-name">檔名</span>: <span id="fileNameDisplay" class="opacity-90">-</span>
                            </div>

                            <!-- G20 英制轉公制提示區 -->
                            <div id="metricAlert" class="p-2 rounded text-[10px] font-bold hidden flex items-center gap-2" style="background-color: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #f59e0b;">
                                <svg class="w-4 h-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span id="txt-metric-alert">Gcode已轉換為公制(G21)</span>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 參數調整 -->
                    <div class="controls-card">
                        <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3 flex items-center">
                            <span id="txt-sec-params">2. 參數調整 (不影響 Z/F)</span>
                        </h2>
                        <div class="space-y-3">
                            <div class="grid grid-cols-2 gap-2">
                                <div class="col-span-2">
                                    <label class="label-text block mb-1" id="txt-label-scale">縮放比例 (僅限 XY)</label>
                                    <input type="number" id="scaleInput" value="1" step="0.1" class="w-full">
                                </div>
                                <div>
                                    <label class="label-text block mb-1" id="txt-label-ox">X 偏移</label>
                                    <input type="number" id="offsetX" value="0" step="1" class="w-full">
                                </div>
                                <div>
                                    <label class="label-text block mb-1" id="txt-label-oy">Y 偏移</label>
                                    <input type="number" id="offsetY" value="0" step="1" class="w-full">
                                </div>
                            </div>
                            <div>
                                <label class="label-text block mb-1" id="txt-label-rot">旋轉角度 (Z軸中心)</label>
                                <input type="number" id="rotationInput" value="0" step="1" class="w-full">
                            </div>
                            <div>
                                <label class="label-text block mb-1" id="txt-label-res">解析度 (最小 XY 位移 mm)</label>
                                <input type="number" id="resInput" value="0.1" min="0.1" step="0.1" class="w-full">
                            </div>

                            <div class="grid grid-cols-2 gap-2 pt-1">
                                <button id="centerBtn" class="btn-secondary font-bold py-2 rounded transition text-xs">自動置中</button>
                                <button id="applyBtn" class="btn-green font-bold py-2 rounded shadow-sm text-xs">更新預覽</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 【中央 3D 預覽面板】 -->
                <div class="lg:col-span-6 order-1 lg:order-2">
                    <div id="preview-container" class="shadow-2xl ring-1 ring-gray-700 select-none">
                        <div class="absolute top-3 right-3 z-10">
                            <div class="bg-black/80 backdrop-blur-md text-emerald-400 px-3 py-1 rounded-full text-[9px] font-black border border-emerald-500/30 shadow-md">
                                3D REALTIME VIEW
                            </div>
                        </div>
                        
                        <div class="absolute top-3 left-3 z-10 text-gray-300 text-[10px] space-y-1 bg-black/75 p-2.5 rounded-lg backdrop-blur-sm border border-white/10 shadow-lg max-w-[190px]">
                            <p class="flex items-center">
                                <span class="w-3 h-3 bg-emerald-500 rounded-sm mr-2 flex-shrink-0"></span>
                                <span id="txt-legend-path">加工路徑</span>
                            </p>
                            <p class="flex items-center">
                                <span class="w-3 h-3 bg-amber-500 rounded-sm mr-2 flex-shrink-0"></span>
                                <span id="txt-legend-tab">加工橋位</span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 【右側控制面板】：進階選項、參考底圖 與 下載按鈕 -->
                <div class="lg:col-span-3 space-y-4 order-3 lg:order-3">
                    
                    <!-- 3. 進階選項 -->
                    <div class="controls-card">
                        <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3 flex items-center">
                            <span id="txt-sec-advanced">3. 進階選項 (僅切割路徑)</span>
                        </h2>
                        
                        <div class="space-y-4">
                            <!-- 厚度與分層設定區塊 -->
                            <div class="border-b border-gray-700/50 pb-3">
                                <div class="flex items-center gap-2 mb-2">
                                    <input type="checkbox" id="thickEnable" class="w-4 h-4 rounded text-emerald-500 bg-gray-700 border-gray-600 focus:ring-emerald-500 accent-emerald-500">
                                    <label for="thickEnable" class="label-text cursor-pointer" id="txt-label-thick-enable">深度調整</label>
                                </div>
                                <div id="thickControls" class="space-y-2.5 hidden pl-6">
                                    <div>
                                        <label class="label-text block mb-1" id="txt-label-orig-thick">原加工總深度 (自動偵測 mm)</label>
                                        <input type="number" id="origThickInput" value="0" class="w-full bg-slate-800 border-slate-700 text-slate-400 cursor-not-allowed" readonly disabled>
                                    </div>
                                    <div>
                                        <label class="label-text block mb-1" id="txt-label-target-thick">目標加工總深度 (mm)</label>
                                        <input type="number" id="targetThickInput" value="18" min="0.1" step="0.1" class="w-full">
                                    </div>
                                    <div>
                                        <label class="label-text block mb-1" id="txt-label-target-layers">切削層數 (Layers)</label>
                                        <input type="number" id="targetLayersInput" value="12" min="1" step="1" class="w-full">
                                    </div>
                                </div>
                            </div>

                            <!-- 走速 F 調整區塊 -->
                            <div class="border-b border-gray-700/50 pb-3">
                                <div class="flex items-center gap-2 mb-2">
                                    <input type="checkbox" id="feedrateEnable" class="w-4 h-4 rounded text-emerald-500 bg-gray-700 border-gray-600 focus:ring-emerald-500 accent-emerald-500">
                                    <label for="feedrateEnable" class="label-text cursor-pointer" id="txt-label-feedrate-enable">走速調整(F)</label>
                                </div>
                                <div id="feedrateControls" class="space-y-2.5 hidden pl-6">
                                    <div>
                                        <label class="label-text block mb-1" id="txt-label-target-feedrate">XY 走速(mm/min)</label>
                                        <input type="number" id="targetFeedrateInput" value="1200" min="1" step="50" class="w-full">
                                    </div>
                                    <div>
                                        <label class="label-text block mb-1" id="txt-label-target-zfeedrate">Z 軸下刀速(mm/min)</label>
                                        <input type="number" id="targetZFeedrateInput" value="400" min="1" step="50" class="w-full">
                                    </div>
                                </div>
                            </div>

                            <!-- 抬刀高度調整區塊 -->
                            <div class="border-b border-gray-700/50 pb-3">
                                <div class="flex items-center gap-2 mb-2">
                                    <input type="checkbox" id="retractEnable" class="w-4 h-4 rounded text-emerald-500 bg-gray-700 border-gray-600 focus:ring-emerald-500 accent-emerald-500">
                                    <label for="retractEnable" class="label-text cursor-pointer" id="txt-label-retract-enable">抬刀高度調整 (Z > 0)</label>
                                </div>
                                <div id="retractControls" class="space-y-2.5 hidden pl-6">
                                    <div>
                                        <label class="label-text block mb-1" id="txt-label-target-retract">新抬刀高度 (0.1~5 mm)</label>
                                        <input type="number" id="retractHeightInput" value="3.0" min="0.1" max="5.0" step="0.1" class="w-full">
                                    </div>
                                </div>
                            </div>

                            <!-- 橋位 TAB 調整區塊 -->
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <input type="checkbox" id="tabEnable" class="w-4 h-4 rounded text-emerald-500 bg-gray-700 border-gray-600 focus:ring-emerald-500 accent-emerald-500">
                                    <label for="tabEnable" class="label-text cursor-pointer" id="txt-label-tab-enable">自動橋位</label>
                                </div>
                                <div id="tabControls" class="space-y-2.5 hidden pl-6">
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="label-text block mb-1" id="txt-label-tabwidth">橋位寬度 (3~8 mm)</label>
                                            <input type="number" id="tabWidthInput" value="5" min="3" max="8" step="0.5" class="w-full">
                                        </div>
                                        <div>
                                            <label class="label-text block mb-1" id="txt-label-tabheight">橋位高度 (2~6 mm)</label>
                                            <input type="number" id="tabHeightInput" value="3" min="2" max="6" step="0.5" class="w-full">
                                        </div>
                                    </div>
                                    <div id="tabHint" class="text-[10px] text-gray-400 leading-snug">橋位自動均分於各輪廓：≤200mm 2個、201~600mm 3個、>600mm 4個</div>
                                    <div id="tabWarning" class="hidden text-[11px] leading-snug rounded border border-amber-500/60 bg-amber-500/10 text-amber-300 p-2 space-y-0.5"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 4. 參考底圖 -->
                    <div class="controls-card">
                        <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2 flex items-center">
                            <span id="txt-sec-refimg">4. 參考底圖 (選填)</span>
                        </h2>
                        <div class="space-y-3">
                            <button onclick="document.getElementById('imageInput').click()" class="btn-secondary w-full font-bold py-2 px-4 rounded transition text-xs flex items-center justify-center shadow-inner">
                                <svg class="w-4 h-4 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span id="txt-btn-upload-img">選擇參考圖片</span>
                            </button>
                            <input type="file" id="imageInput" accept="image/*" class="hidden" />
                            
                            <div id="imgControls" class="space-y-2 hidden">
                                <div>
                                    <label class="label-text block mb-1" id="txt-label-imgwidth">圖片實際寬度 (mm)</label>
                                    <input type="number" id="imgWidthInput" value="100" min="1" step="10" class="w-full">
                                </div>
                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="label-text" id="txt-label-imgopacity">不透明度</label>
                                        <span id="opacityVal" class="text-xs text-emerald-400 font-mono">0.5</span>
                                    </div>
                                    <input type="range" id="imgOpacityInput" min="0.1" max="1.0" step="0.05" value="0.5" class="w-full accent-emerald-500">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 加工預估 & 下載 -->
                    <div class="info-card rounded-lg p-4 shadow-xl space-y-3 border-t-4 border-emerald-500">
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-[9px] text-emerald-500 font-bold uppercase tracking-wider" id="txt-info-time">預估時間</p>
                                <p class="text-sm font-mono font-bold text-emerald-400" id="timeEst">0 min 0 sec</p>
                            </div>
                            <div class="text-right">
                                <p class="hidden" id="txt-info-dist"></p>
                                <table class="text-[11px] font-mono border-collapse ml-auto" id="boundsTable">
                                    <thead>
                                        <tr>
                                            <th></th>
                                            <th class="px-2 pb-1 text-[10px] font-bold text-emerald-500 tracking-wider text-right">min</th>
                                            <th class="px-2 pb-1 text-[10px] font-bold text-emerald-500 tracking-wider text-right">max</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr><th class="pr-2 text-sm font-black text-emerald-400 text-right">X</th><td class="px-2 py-1 border border-dashed border-gray-500/60 text-right tabular-nums" id="bMinX">-</td><td class="px-2 py-1 border border-dashed border-gray-500/60 text-right tabular-nums" id="bMaxX">-</td></tr>

            } else {
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;

    function updateThreeGrid() {
        if (!scene) return;
        if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
        if (originAxes) { scene.remove(originAxes); originAxes.geometry.dispose(); originAxes.material.dispose(); }
        if (originMarker) { scene.remove(originMarker); originMarker.geometry.dispose(); originMarker.material.dispose(); }
        const isLight = !document.documentElement.classList.contains('dark');
        
        const gridColor = isLight ? 0xcccccc : 0x222222;
        const centerColor = isLight ? 0x059669 : 0x10b981;
        
        // 格線只負責提供 50mm 刻度 (中心線與一般線同色)；格線中心已對齊 50mm 的倍數，
        // 因此每條格線都落在「距座標原點 50mm 整數倍」的位置
        grid = new THREE.GridHelper(currentGridSize, currentGridDivisions, gridColor, gridColor);
        grid.rotation.x = Math.PI / 2;
        grid.position.set(currentGridCenterX, currentGridCenterY, 0);
        scene.add(grid);

        // 十字座標軸固定畫在世界座標原點 (0,0)，不隨路徑或格線範圍移動，
        // 平移 (X/Y 偏移) 時可直接看出路徑與座標原點的對應關係
        const half = currentGridSize / 2;
        const axisVerts = new Float32Array([
            currentGridCenterX - half, 0, 0,   currentGridCenterX + half, 0, 0,   // X 軸
            0, currentGridCenterY - half, 0,   0, currentGridCenterY + half, 0    // Y 軸
        ]);
        const axisGeo = new THREE.BufferGeometry();
        axisGeo.setAttribute('position', new THREE.BufferAttribute(axisVerts, 3));
        originAxes = new THREE.LineSegments(axisGeo, new THREE.LineBasicMaterial({ color: centerColor, depthTest: false }));
        originAxes.renderOrder = 1;
        scene.add(originAxes);

        // 原點標記：固定在 (0,0) 的橘色圓點，大小以螢幕像素計算 (縮放視角時不會變大變小)，並顯示在路徑之上
        const markerGeo = new THREE.BufferGeometry();
        markerGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
        originMarker = new THREE.Points(markerGeo, new THREE.PointsMaterial({
            color: isLight ? 0xea580c : 0xfb923c,
            size: 9,
            sizeAttenuation: false,
            depthTest: false
        }));
        originMarker.renderOrder = 2;
        scene.add(originMarker);
        requestRender();
    }

    function initThree() {
        const container = document.getElementById('preview-container');
        scene = new THREE.Scene();
        cameraTarget = new THREE.Vector3(0, 0, 0);
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 10000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(200, 500, 300);
        scene.add(light);

        updateThreeGrid();

        camera.position.set(200, -200, 200);
        camera.up.set(0, 0, 1);
        camera.lookAt(cameraTarget);

        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };

        const handleMove = (x, y, buttons) => {
            if (!isDragging) return;
            const deltaX = x - previousMouse.x;
            const deltaY = y - previousMouse.y;
            
            if (buttons === 1) {
                const offset = new THREE.Vector3().subVectors(camera.position, cameraTarget);
                const radius = offset.length();
                let phi = Math.atan2(offset.y, offset.x) - deltaX * 0.005;
                let theta = Math.acos(offset.z / radius) - deltaY * 0.005;
                theta = Math.max(0.01, Math.min(Math.PI - 0.01, theta));
                
                camera.position.x = cameraTarget.x + radius * Math.sin(theta) * Math.cos(phi);
                camera.position.y = cameraTarget.y + radius * Math.sin(theta) * Math.sin(phi);
                camera.position.z = cameraTarget.z + radius * Math.cos(theta);
            } else if (buttons === 2) {
                const factor = 0.0015 * camera.position.distanceTo(cameraTarget);
                const localRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
                
                const panOffset = new THREE.Vector3()
                    .addScaledVector(localRight, -deltaX * factor)
                    .addScaledVector(localUp, deltaY * factor);
                
                camera.position.add(panOffset);
                cameraTarget.add(panOffset);
            }
            camera.lookAt(cameraTarget);
            previousMouse = { x, y };
            requestRender();
        };

        container.addEventListener('mousedown', e => { 
            isDragging = true; 
            previousMouse = { x: e.clientX, y: e.clientY }; 
        });
        window.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mousemove', e => {
            handleMove(e.clientX, e.clientY, e.buttons);
        });
        container.addEventListener('wheel', e => {
            const dir = new THREE.Vector3().subVectors(camera.position, cameraTarget).normalize();
            const dist = camera.position.distanceTo(cameraTarget);
            const newDist = e.deltaY > 0 ? dist * 1.1 : dist / 1.1;
            camera.position.copy(cameraTarget).addScaledVector(dir, newDist);
            camera.lookAt(cameraTarget);
            requestRender();
        });
        container.oncontextmenu = e => { e.preventDefault(); };

        let initialPinchDist = 0;
        let initialCamRadius = 0;

        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDist = Math.sqrt(dx * dx + dy * dy);
                
                const offset = new THREE.Vector3().subVectors(camera.position, cameraTarget);
                initialCamRadius = offset.length();

                previousMouse = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        }, { passive: true });

        container.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && isDragging) {
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                handleMove(x, y, 1);
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (initialPinchDist > 0 && dist > 10) {
                    const factor = initialPinchDist / dist;
                    const newRadius = Math.max(10, Math.min(1500, initialCamRadius * factor));
                    const dir = new THREE.Vector3().subVectors(camera.position, cameraTarget).normalize();
                    camera.position.copy(cameraTarget).addScaledVector(dir, newRadius);
                }

                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const deltaX = midX - previousMouse.x;
                const deltaY = midY - previousMouse.y;
                
                const factor = 0.0015 * camera.position.distanceTo(cameraTarget);
                const localRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
                
                const panOffset = new THREE.Vector3()
                    .addScaledVector(localRight, -deltaX * factor)
                    .addScaledVector(localUp, deltaY * factor);
                
                camera.position.add(panOffset);
                cameraTarget.add(panOffset);
                
                camera.lookAt(cameraTarget);
                previousMouse = { x: midX, y: midY };
                requestRender();
            }
        }, { passive: true });

        container.addEventListener('touchend', () => {
            isDragging = false;
            initialPinchDist = 0;
        });

        animate();
    }

    // 依需求渲染：只有視角/內容/尺寸改變時才重繪，閒置時不佔用 GPU
    let renderQueued = false;
    function requestRender() {
        if (renderQueued || !renderer) return;
        renderQueued = true;
        requestAnimationFrame(() => {
            renderQueued = false;
            renderer.render(scene, camera);
        });
    }
    function animate() { requestRender(); }

    // 釋放 Three.js 物件的 GPU 資源
    function disposeObject(root) {
        const geos = new Set(), mats = new Set(), texs = new Set();
        root.traverse(o => {
            if (o.geometry) geos.add(o.geometry);
            if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { mats.add(m); if (m.map) texs.add(m.map); });
        });
        geos.forEach(g => g.dispose());
        mats.forEach(m => m.dispose());
        texs.forEach(t => t.dispose());
    }

    // 連續輸入事件合併成每個畫面幀只重算一次
    let processRaf = 0;
    function scheduleProcess() {
        if (processRaf) return;
        processRaf = requestAnimationFrame(() => { processRaf = 0; processAndPreview(); });
    }

    // 格式化數字：四捨五入至指定位數並自動去除尾數不必要的 0
    function formatNum(val, maxDecimals = 4) {
        if (typeof val !== 'number' || isNaN(val)) return '0';
        let res = parseFloat(val.toFixed(maxDecimals));
        if (Object.is(res, -0) || res === 0) res = 0;
        return res.toString();
    }

    function convertInchToMetric(text) {
        const lines = text.split('\n');
        let isInchMode = false;
        
        const converted = lines.map(line => {
            let cmd = line.trim();
            if (!cmd) return line;

            let cleanCmd = cmd;
            let comment = "";
            const semiIdx = cmd.indexOf(';');
            if (semiIdx !== -1) {
                cleanCmd = cmd.substring(0, semiIdx).trim();
                comment = cmd.substring(semiIdx);
            }

            let parenComments = [];
            cleanCmd = cleanCmd.replace(/\([^)]*\)/g, (match) => {
                parenComments.push(match);
                return `__COMMENT_PLACEHOLDER_${parenComments.length - 1}__`;
            });

            if (/\bG0*20\b/i.test(cleanCmd)) {
                isInchMode = true;
                cleanCmd = cleanCmd.replace(/\bG0*20\b/gi, 'G21');
            } else if (/\bG0*21\b/i.test(cleanCmd)) {
                isInchMode = false;
            }

            if (isInchMode) {
                cleanCmd = cleanCmd.replace(/([XYZIJKRF])\s*([-+]?[0-9]*\.?[0-9]+)/gi, (match, letter, valStr) => {
                    const val = parseFloat(valStr);
                    const convertedVal = val * 25.4;
                    return letter.toUpperCase() + formatNum(convertedVal, 4);
                });
            }

            parenComments.forEach((pc, idx) => {
                cleanCmd = cleanCmd.replace(`__COMMENT_PLACEHOLDER_${idx}__`, pc);
            });

            return cleanCmd + comment;
        });

        return converted.join('\n');
    }

    function hasG20Active(text) {
        const lines = text.split('\n');
        for (let line of lines) {
            let clean = line.split(';')[0].replace(/\([^)]*\)/g, '').trim();
            if (/\bG0*20\b/i.test(clean)) {
                return true;
            }
        }
        return false;
    }

    // 解析單行指令中的「字母+數值」字組 (共用同一個正規表示式，避免每行重新建立迭代器與陣列)
    const WORD_RE = /([A-Z])\s*([-+]?[0-9]*\.?[0-9]+)/gi;
    function parseWords(str) {
        const words = {};
        WORD_RE.lastIndex = 0;
        let m;
        while ((m = WORD_RE.exec(str)) !== null) {
            words[m[1]] = parseFloat(m[2]);
        }
        return words;
    }

    // 逐行解析一次：空行/註解行為 null，其餘為該行的字組
    function parseLineWords(lines) {
        const out = new Array(lines.length);
        for (let i = 0; i < lines.length; i++) {
            const cmd = lines[i].trim().toUpperCase();
            if (!cmd || cmd.startsWith('(') || cmd.startsWith(';')) { out[i] = null; continue; }
            const semiIdx = cmd.indexOf(';');
            out[i] = parseWords(semiIdx !== -1 ? cmd.substring(0, semiIdx).trim() : cmd);
        }
        return out;
    }

    function findMachiningBoundsFromWords(lineWords) {
        let firstMachiningIdx = -1;
        let lastMachiningIdx = -1;
        let currentMotionMode = null;
        
        for (let i = 0; i < lineWords.length; i++) {
            const words = lineWords[i];
            if (!words) continue;
            
            if (words['G'] !== undefined) {
                const gVal = Math.round(words['G']);
                if (gVal === 0) currentMotionMode = 'G0';
                else if (gVal === 1) currentMotionMode = 'G1';
                else if (gVal === 2) currentMotionMode = 'G2';
                else if (gVal === 3) currentMotionMode = 'G3';
            }
            
            const hasX = words['X'] !== undefined;
            const hasY = words['Y'] !== undefined;
            
            if ((hasX || hasY) && currentMotionMode && currentMotionMode !== 'G0') {
                if (firstMachiningIdx === -1) firstMachiningIdx = i;
                lastMachiningIdx = i;
            }
        }
        
        return { firstMachiningIdx, lastMachiningIdx };
    }

    function findArcCenter(p1, p2, I, J, R, isCW) {
        if (I !== null && J !== null) {
            return { x: p1.x + I, y: p1.y + J };
        }
        if (R !== null) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d === 0) return { x: p1.x, y: p1.y };
            
            let r = Math.abs(R);
            if (r < d / 2) {
                r = d / 2 + 0.0001;
            }
            const h = Math.sqrt(r * r - (d / 2) * (d / 2));
            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;
            const nx = -dy / d;
            const ny = dx / d;

            let factor = (isCW ? 1 : -1) * (R < 0 ? -1 : 1);
            return {
                x: mx + factor * h * nx,
                y: my + factor * h * ny
            };
        }
        return null;
    }

    function generateArcPoints(p1, p2, I, J, R, isCW) {
        const points = [];
        let cx, cy, r;

        if (R !== null) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d === 0 || Math.abs(R) < d / 2) {
                return [new THREE.Vector3(p1.x, p1.y, p1.z), new THREE.Vector3(p2.x, p2.y, p2.z)];
            }
            r = Math.abs(R);
            const h = Math.sqrt(r * r - (d / 2) * (d / 2));
            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;
            const nx = -dy / d;
            const ny = dx / d;

            let factor = (isCW ? 1 : -1) * (R < 0 ? -1 : 1);
            cx = mx + factor * h * nx;
            cy = my + factor * h * ny;
        } else {
            cx = p1.x + (I || 0);
            cy = p1.y + (J || 0);
            r = Math.sqrt((p1.x - cx)**2 + (p1.y - cy)**2);
        }

        let startAngle = Math.atan2(p1.y - cy, p1.x - cx);
        let endAngle = Math.atan2(p2.y - cy, p2.x - cx);

        let diff = endAngle - startAngle;
        if (isCW) {
            if (diff >= 0) diff -= 2 * Math.PI;
        } else {
            if (diff <= 0) diff += 2 * Math.PI;
        }

        const numSegments = Math.max(8, Math.min(64, Math.ceil(Math.abs(diff) / (Math.PI / 16))));
        for (let s = 0; s <= numSegments; s++) {
            const t = s / numSegments;
            const angle = startAngle + diff * t;
            const z = p1.z + (p2.z - p1.z) * t; 
            points.push(new THREE.Vector3(cx + r * Math.cos(angle), cy + r * Math.sin(angle), z));
        }

        return points;
    }

    function getRetractHeight() {
        const retractEnable = document.getElementById('retractEnable') && document.getElementById('retractEnable').checked;
        if (retractEnable) {
            let val = parseFloat(document.getElementById('retractHeightInput').value);
            if (isNaN(val)) return 3.0;
            return Math.max(0.1, Math.min(5.0, val));
        }
        return 3.0;
    }

    function parseGcode(text) {
        const lines = text.split('\n');
        const lineWords = parseLineWords(lines);
        const bounds = findMachiningBoundsFromWords(lineWords);
        const firstMachiningIdx = bounds.firstMachiningIdx;
        const lastMachiningIdx = bounds.lastMachiningIdx;
        let currentPos = { x: 0, y: 0, z: 0, f: 1000 };
        let activeMotion = null; 
        const pathData = [];
        const rHeight = getRetractHeight();

        lineWords.forEach((words, index) => {
            if (!words) return;

            if (words['G'] !== undefined) {
                const gVal = Math.round(words['G']);
                if (gVal === 0) activeMotion = 'G0';
                else if (gVal === 1) activeMotion = 'G1';
                else if (gVal === 2) activeMotion = 'G2';
                else if (gVal === 3) activeMotion = 'G3';
            }

            const hasCoords = (words['X'] !== undefined || words['Y'] !== undefined || words['Z'] !== undefined || words['I'] !== undefined || words['J'] !== undefined || words['R'] !== undefined);

            if (hasCoords && activeMotion) {
                let newX = words['X'] !== undefined ? words['X'] : currentPos.x;
                let newY = words['Y'] !== undefined ? words['Y'] : currentPos.y;
                let newZ = words['Z'] !== undefined ? words['Z'] : currentPos.z;
                
                if (newZ > 0.0001) {
                    newZ = rHeight;
                }

                if (words['F'] !== undefined) currentPos.f = words['F'];

                const isStartOrEndHome = (firstMachiningIdx !== -1 && (index < firstMachiningIdx || index > lastMachiningIdx)) && 
                                         (Math.abs(newX) < 1e-4 && Math.abs(newY) < 1e-4);

                pathData.push({
                    from: { ...currentPos },
                    to: { x: newX, y: newY, z: newZ },
                    f: currentPos.f,
                    type: activeMotion,
                    I: words['I'] !== undefined ? words['I'] : null,
                    J: words['J'] !== undefined ? words['J'] : null,
                    R: words['R'] !== undefined ? words['R'] : null,
                    isStartOrEndHome: isStartOrEndHome,
                    lineIdx: index,
                    hasZ: words['Z'] !== undefined
                });

                currentPos.x = newX;
                currentPos.y = newY;
                currentPos.z = newZ;
            } else if (words['F'] !== undefined) {
                currentPos.f = words['F'];
            }
        });
        return pathData;
    }

    function detectOriginalDepth(path) {
        let minZ = 0;
        path.forEach(seg => {
            if (seg.type !== 'G0' && !seg.isStartOrEndHome) {
                if (seg.to.z < minZ) minZ = seg.to.z;
                if (seg.from.z < minZ) minZ = seg.from.z;
            }
        });
        return Math.abs(minZ);
    }

    function detectFirstFeedrate(path) {
        for (let seg of path) {
            if (seg.type !== 'G0' && !seg.isStartOrEndHome) {
                const dx = seg.to.x - seg.from.x;
                const dy = seg.to.y - seg.from.y;
                const dXY = Math.sqrt(dx * dx + dy * dy);
                if (dXY > 1e-4 && seg.f > 0) {
                    return seg.f;
                }
            }
        }
        return 1200;
    }

    function detectFirstZFeedrate(path) {
        for (let seg of path) {
            if (seg.type === 'G1' && !seg.isStartOrEndHome) {
                const dx = seg.to.x - seg.from.x;
                const dy = seg.to.y - seg.from.y;
                const dXY = Math.sqrt(dx * dx + dy * dy);
                const dZ = Math.abs(seg.to.z - seg.from.z);
                if (dXY < 1e-4 && dZ > 1e-4 && seg.f > 0) {
                    return seg.f;
                }
            }
        }
        return 400;
    }

    function detectOriginalStepdown(path) {
        const zs = [];
        path.forEach(seg => {
            if (seg.to.z < -0.001) {
                zs.push(parseFloat(seg.to.z.toFixed(4)));
            }
        });
        const uniqueZs = [...new Set(zs)].sort((a, b) => b - a);
        if (uniqueZs.length >= 2) {
            return Math.abs(uniqueZs[1] - uniqueZs[0]);
        } else if (uniqueZs.length === 1) {
            return Math.abs(uniqueZs[0]);
        }
        return 1.5;
    }

    function applyThicknessAdjustment(pathData) {
        const thickEnable = document.getElementById('thickEnable') && document.getElementById('thickEnable').checked;
        if (!thickEnable) return pathData;

        const detectedDepth = parseFloat(document.getElementById('origThickInput').value) || 0;
        const targetDepth = parseFloat(document.getElementById('targetThickInput').value) || 0;
        const layers = parseInt(document.getElementById('targetLayersInput').value) || 12;

        if (detectedDepth <= 0.0001 || targetDepth <= 0.0001 || layers < 1) return pathData;

        const stepdown = targetDepth / layers;

        const blocks = [];
        let currentBlock = { type: 'rapid', segments: [] };
        blocks.push(currentBlock);

        pathData.forEach(seg => {
            const isCut = (seg.from.z < -0.001 || seg.to.z < -0.001) && seg.type !== 'G0';
            if (isCut) {
                if (currentBlock.type === 'rapid') {
                    currentBlock = { type: 'contour', segments: [] };
                    blocks.push(currentBlock);
                }
                currentBlock.segments.push(seg);
            } else {
                if (currentBlock.type === 'contour') {
                    currentBlock = { type: 'rapid', segments: [] };
                    blocks.push(currentBlock);
                }
                currentBlock.segments.push(seg);
            }
        });

        const rebuiltSegments = [];

        blocks.forEach(block => {
            if (block.type === 'contour' && block.segments.length > 0) {
                const zs = [];
                block.segments.forEach(seg => {
                    if (seg.to.z < -0.001) {
                        zs.push(parseFloat(seg.to.z.toFixed(4)));
                    }
                });
                const uniqueZs = [...new Set(zs)].sort((a, b) => b - a);

                if (uniqueZs.length > 0) {
                    const firstZ = uniqueZs[0];

                    const profile = [];
                    for (let seg of block.segments) {
                        if (seg.to.z < firstZ - 0.01 || seg.to.z > -0.001) {
                            break;
                        }
                        profile.push(seg);
                    }

                    if (profile.length > 0) {
                        const newZs = [];
                        let current = stepdown;
                        while (current < targetDepth - 1e-4) {
                            newZs.push(-current);
                            current += stepdown;
                        }
                        newZs.push(-targetDepth);

                        let prevZ = block.segments[0].from.z;

                        newZs.forEach((targetZ) => {
                            profile.forEach((origSeg, segIdx) => {
                                const newSeg = { ...origSeg, hasZ: true };
                                if (segIdx === 0) {
                                    newSeg.from = { ...origSeg.from, z: prevZ };
                                    newSeg.to = { ...origSeg.to, z: targetZ };
                                } else {
                                    newSeg.from = { ...origSeg.from, z: targetZ };
                                    newSeg.to = { ...origSeg.to, z: targetZ };
                                }
                                rebuiltSegments.push(newSeg);
                            });
                            prevZ = targetZ;
                        });

                        const lastOrigSeg = block.segments[block.segments.length - 1];
                        if (lastOrigSeg && lastOrigSeg.to.z > -0.001) {
                            const finalLift = { ...lastOrigSeg, hasZ: true };
                            finalLift.from = { ...lastOrigSeg.from, z: prevZ };
                            finalLift.to = { ...lastOrigSeg.to };
                            rebuiltSegments.push(finalLift);
                        }
                    } else {
                        for (let k = 0; k < block.segments.length; k++) rebuiltSegments.push(block.segments[k]);
                    }
                } else {
                    for (let k = 0; k < block.segments.length; k++) rebuiltSegments.push(block.segments[k]);
                }
            } else {
                for (let k = 0; k < block.segments.length; k++) rebuiltSegments.push(block.segments[k]);
            }
        });

        return rebuiltSegments;
    }

    function applyFeedrateAdjustment(pathData) {
        const feedrateEnable = document.getElementById('feedrateEnable') && document.getElementById('feedrateEnable').checked;
        if (!feedrateEnable) return pathData;

        const targetFeedrate = parseFloat(document.getElementById('targetFeedrateInput').value) || 1200;
        const targetZFeedrate = parseFloat(document.getElementById('targetZFeedrateInput').value) || 400;

        return pathData.map(seg => {
            if (seg.type === 'G0') return seg;
            const dx = seg.to.x - seg.from.x;
            const dy = seg.to.y - seg.from.y;
            const dXY = Math.sqrt(dx * dx + dy * dy);
            const dZ = Math.abs(seg.to.z - seg.from.z);

            let newF = seg.f;
            if (dXY > 1e-4) {
                newF = targetFeedrate;
            } else if (dZ > 1e-4) {
                newF = targetZFeedrate;
            }
            return { ...seg, f: newF };
        });
    }

    // ================= 橋位 (TAB) 計算 =================
    // 規則：單一切割路徑總長 <=200mm → 2 個；201~600mm → 3 個；>600mm → 4 個
    // 橋位沿「路徑弧長」均分，並在容許範圍內避開轉角，直線 (G1) 與圓弧 (G2/G3) 都可放置。
    let lastTabWarnings = [];

    function tabCountForLength(L) { return L <= 200 ? 2 : (L <= 600 ? 3 : 4); }

    function getTabSettings() {
        let w = parseFloat(document.getElementById('tabWidthInput')?.value);
        let h = parseFloat(document.getElementById('tabHeightInput')?.value);
        if (isNaN(w)) w = 5;
        if (isNaN(h)) h = 3;
        return { W: Math.max(3, Math.min(8, w)), H: Math.max(2, Math.min(6, h)) };
    }

    const TAB_MSG = {
        zh: {
            short: (v) => `${v.name}：路徑長度僅 ${v.L} mm，放不下橋位 (寬 ${v.W} mm)，此輪廓未加橋位`,
            reduced: (v) => `${v.name}：路徑長度 ${v.L} mm 偏短，橋位由 ${v.n0} 個減為 ${v.n} 個`,
            gap: (v) => `${v.name}：橋位間距過近，最小淨距僅 ${v.gap} mm (建議 ≥ ${v.min} mm)，工件強度與切削穩定性可能不足`,
            near: (v) => `${v.name}：兩個橋位的直線距離僅 ${v.d} mm (建議 ≥ ${v.min} mm)，物件過小或過窄`,
            ratio: (v) => `${v.name}：橋位佔路徑比例達 ${v.pct}%，工件幾乎被橋位固定，切斷後不易取下`,
            high: (v) => `${v.name}：橋位高度 ${v.H} mm ≥ 加工深度 ${v.D} mm，橋位已達材料表面 (底部完全未切斷)`
        },
        en: {
            short: (v) => `${v.name}: path is only ${v.L} mm, too short for a ${v.W} mm tab. No tab added`,
            reduced: (v) => `${v.name}: path (${v.L} mm) is short, tab count reduced from ${v.n0} to ${v.n}`,
            gap: (v) => `${v.name}: tabs are too close (min clear gap ${v.gap} mm, recommended >= ${v.min} mm)`,
            near: (v) => `${v.name}: two tabs are only ${v.d} mm apart in straight line (recommended >= ${v.min} mm). Part is too small/narrow`,
            ratio: (v) => `${v.name}: tabs occupy ${v.pct}% of the path, the part will be hard to remove`,
            high: (v) => `${v.name}: tab height ${v.H} mm >= cutting depth ${v.D} mm, tab reaches the material surface (not cut through at all)`
        }
    };

    // ---- 幾何：線段 / 圓弧 ----
    function segGeom(seg) {
        const x0 = seg.from.x, y0 = seg.from.y, x1 = seg.to.x, y1 = seg.to.y;
        if (seg.type === 'G1') {
            const len = Math.hypot(x1 - x0, y1 - y0);
            if (len < 1e-4) return null;
            return { kind: 'L', x0, y0, x1, y1, len, ux: (x1 - x0) / len, uy: (y1 - y0) / len };
        }
        if (seg.type === 'G2' || seg.type === 'G3') {
            const cw = seg.type === 'G2';
            let cx, cy;
            if (seg.I !== null || seg.J !== null) {
                cx = x0 + (seg.I || 0); cy = y0 + (seg.J || 0);
            } else if (seg.R !== null) {
                const c = findArcCenter(seg.from, seg.to, null, null, seg.R, cw);
                if (!c) return null;
                cx = c.x; cy = c.y;
            } else return null;
            const r = Math.hypot(x0 - cx, y0 - cy);
            if (r < 1e-4) return null;
            const a0 = Math.atan2(y0 - cy, x0 - cx), a1 = Math.atan2(y1 - cy, x1 - cx);
            let diff = a1 - a0;
            if (cw) { if (diff >= 0) diff -= 2 * Math.PI; } else { if (diff <= 0) diff += 2 * Math.PI; }
            return { kind: 'A', cx, cy, r, a0, dir: cw ? -1 : 1, len: Math.abs(diff) * r, x0, y0, x1, y1 };
        }
        return null;
    }

    function geomPointAt(g, t) {
        if (t <= 1e-9) return { x: g.x0, y: g.y0 };
        if (t >= g.len - 1e-9) return { x: g.x1, y: g.y1 };
        if (g.kind === 'L') return { x: g.x0 + g.ux * t, y: g.y0 + g.uy * t };
        const a = g.a0 + g.dir * t / g.r;
        return { x: g.cx + g.r * Math.cos(a), y: g.cy + g.r * Math.sin(a) };
    }

    function geomTangent(g, t) {
        if (g.kind === 'L') return { x: g.ux, y: g.uy };
        const a = g.a0 + g.dir * t / g.r;
        return { x: -g.dir * Math.sin(a), y: g.dir * Math.cos(a) };
    }

    // 橋位片段 pc = {g, t0, t1} (位於幾何 g 的弧長 t0~t1) 與另一個幾何 g2 的重疊區間 (以 g2 弧長表示)
    // 用於把同一個橋位套用到每一層 (各層幾何相同，但分段方式可能不同)
    function geomOverlap(pc, g2) {
        const g1 = pc.g, out = [];
        const TOL = 0.005;
        if (g1.kind === 'L' && g2.kind === 'L') {
            const P0 = geomPointAt(g1, pc.t0), P1 = geomPointAt(g1, pc.t1);
            const d0 = (P0.x - g2.x0) * g2.uy - (P0.y - g2.y0) * g2.ux;
            const d1 = (P1.x - g2.x0) * g2.uy - (P1.y - g2.y0) * g2.ux;
            if (Math.abs(d0) > TOL || Math.abs(d1) > TOL) return out;
            let ta = (P0.x - g2.x0) * g2.ux + (P0.y - g2.y0) * g2.uy;
            let tb = (P1.x - g2.x0) * g2.ux + (P1.y - g2.y0) * g2.uy;
            if (ta > tb) { const t = ta; ta = tb; tb = t; }
            const lo = Math.max(0, ta), hi = Math.min(g2.len, tb);
            if (hi - lo > 1e-4) out.push([lo, hi]);
            return out;
        }
        if (g1.kind === 'A' && g2.kind === 'A') {
            if (Math.hypot(g1.cx - g2.cx, g1.cy - g2.cy) > 0.01 || Math.abs(g1.r - g2.r) > 0.01) return out;
            const TWO = 2 * Math.PI;
            const w = (pc.t1 - pc.t0) / g1.r;
            const th0 = g1.a0 + g1.dir * pc.t0 / g1.r;
            const th1 = g1.a0 + g1.dir * pc.t1 / g1.r;
            const prog = th => { const v = g2.dir * (th - g2.a0); return ((v % TWO) + TWO) % TWO; };
            const base = (g1.dir === g2.dir) ? prog(th0) : prog(th1);
            const sweep2 = g2.len / g2.r;
            [base - TWO, base].forEach(b => {
                const lo = Math.max(0, b), hi = Math.min(sweep2, b + w);
                if ((hi - lo) * g2.r > 1e-4) out.push([lo * g2.r, hi * g2.r]);
            });
        }
        return out;
    }

    // ---- 橋位規劃：對一條連續的切割路徑 (最終深度的 G1/G2/G3 片段) ----
    function planTabsForGroup(segs, W, rampSegs) {
        const items = [];
        let L = 0;
        segs.forEach(seg => {
            const g = segGeom(seg);
            if (!g) return;
            items.push({ g, s0: L });
            L += g.len;
        });
        const res = { L, tabs: [], warns: [], n: 0, n0: 0 };
        if (!items.length) return res;

        const first = items[0].g, last = items[items.length - 1].g;
        const closed = Math.hypot(first.x0 - last.x1, first.y0 - last.y1) < 0.01;

        // 轉角位置 (相鄰片段切線夾角 > 30°)
        const corners = [];
        const turnAt = (gA, gB) => {
            const ta = geomTangent(gA, gA.len), tb = geomTangent(gB, 0);
            const c = Math.max(-1, Math.min(1, ta.x * tb.x + ta.y * tb.y));
            return Math.acos(c) * 180 / Math.PI;
        };
        for (let i = 1; i < items.length; i++) {
            if (turnAt(items[i - 1].g, items[i].g) > 30) corners.push(items[i].s0);
        }
        if (closed && items.length > 0 && turnAt(last, first) > 30) corners.push(0, L);

        // 禁區：其他層的斜向下刀段 (Z 有變化) 所涵蓋的路徑範圍，橋位要避開
        const forbidden = [];
        (rampSegs || []).forEach(rs => {
            const rg = segGeom(rs);
            if (!rg) return;
            const pc = { g: rg, t0: 0, t1: rg.len };
            items.forEach(it => {
                if (it.g.kind !== rg.kind) return;
                geomOverlap(pc, it.g).forEach(iv => forbidden.push([it.s0 + iv[0], it.s0 + iv[1]]));
            });
        });

        // 橋位數量：依長度分級；若路徑太短放不下，則減少數量 (每個橋位之間至少留 2mm)
        const n0 = tabCountForLength(L);
        let n = n0;
        const margin = 1.0;
        while (n > 1 && (L - 2 * margin) / n < W + 2) n--;
        if (L - 2 * margin < W + 0.5) { res.warns.push({ code: 'short' }); return res; }
        res.n0 = n0;
        if (n < n0) res.warns.push({ code: 'reduced', n0, n });
        res.n = n;

        const lo = W / 2 + margin, hi = L - W / 2 - margin;
        const spacing = L / n;
        const halfWin = Math.min(0.3 * spacing, 40);
        const centers = [];
        for (let k = 0; k < n; k++) {
            const ideal = Math.max(lo, Math.min(hi, (k + 0.5) * spacing));
            let best = ideal, bestScore = -Infinity;
            const a = Math.max(lo, ideal - halfWin), b = Math.min(hi, ideal + halfWin);
            for (let s = a; s <= b + 1e-9; s += 0.5) {
                // 與最近轉角的淨距 (橋位邊緣到轉角)
                let clear = 10;
                for (let c = 0; c < corners.length; c++) {
                    clear = Math.min(clear, Math.abs(s - corners[c]) - W / 2);
                    if (clear < 0) break;
                }
                let score = Math.min(clear, 10) - 0.01 * Math.abs(s - ideal);
                if (clear < 0) score -= 20;
                for (let f = 0; f < forbidden.length; f++) {
                    if (s + W / 2 > forbidden[f][0] && s - W / 2 < forbidden[f][1]) { score -= 100; break; }
                }
                if (score > bestScore) { bestScore = score; best = s; }
            }
            centers.push(best);
        }

        // 產生橋位 (含涵蓋的幾何片段)
        centers.forEach(sc => {
            const s0 = sc - W / 2, s1 = sc + W / 2;
            const pieces = [];
            let ctr = null;
            items.forEach(it => {
                const e = it.s0 + it.g.len;
                if (sc >= it.s0 && sc <= e && !ctr) ctr = geomPointAt(it.g, sc - it.s0);
                if (e <= s0 || it.s0 >= s1) return;
                pieces.push({ g: it.g, t0: Math.max(0, s0 - it.s0), t1: Math.min(it.g.len, s1 - it.s0) });
            });
            res.tabs.push({ sc, s0, s1, center: ctr || { x: first.x0, y: first.y0 }, pieces });
        });

        // 橋位間距檢查
        const minGap = Math.max(10, 2 * W);
        let worstGap = Infinity, worstEuc = Infinity;
        for (let i = 0; i < res.tabs.length; i++) {
            const A = res.tabs[i];
            const B = res.tabs[(i + 1) % res.tabs.length];
            if (res.tabs.length < 2) break;
            let gap = (i + 1 < res.tabs.length) ? (B.s0 - A.s1) : (closed ? (B.s0 + L - A.s1) : Infinity);
            worstGap = Math.min(worstGap, gap);
        }
        for (let i = 0; i < res.tabs.length; i++) {
            for (let j = i + 1; j < res.tabs.length; j++) {
                worstEuc = Math.min(worstEuc, Math.hypot(res.tabs[i].center.x - res.tabs[j].center.x, res.tabs[i].center.y - res.tabs[j].center.y));
            }
        }
        if (worstGap < minGap) res.warns.push({ code: 'gap', gap: worstGap.toFixed(1), min: minGap.toFixed(0) });
        const minEuc = Math.max(12, 1.5 * W);
        if (worstEuc < minEuc && worstGap >= minGap) res.warns.push({ code: 'near', d: worstEuc.toFixed(1), min: minEuc.toFixed(0) });
        const ratio = res.tabs.length * W / L;
        if (ratio > 0.4) res.warns.push({ code: 'ratio', pct: (ratio * 100).toFixed(0) });
        return res;
    }

    // 把橋位套用到一個「平面 (Z 不變)」的 G1/G2/G3 片段：回傳切分後的片段陣列
    function splitSegmentWithTabs(seg, tabs, bridgeZ, plungeF) {
        const g = segGeom(seg);
        if (!g) return [seg];
        let iv = [];
        tabs.forEach(tb => tb.pieces.forEach(pc => geomOverlap(pc, g).forEach(x => iv.push(x))));
        if (!iv.length) return [seg];
        iv.sort((a, b) => a[0] - b[0]);
        const merged = [iv[0].slice()];
        for (let i = 1; i < iv.length; i++) {
            const m = merged[merged.length - 1];
            if (iv[i][0] <= m[1] + 1e-4) m[1] = Math.max(m[1], iv[i][1]);
            else merged.push(iv[i].slice());
        }

        const baseZ = seg.to.z;
        const mk = (t0, t1, z0, z1, isTab, hasZ) => {
            const A = geomPointAt(g, t0), B = geomPointAt(g, t1);
            const s = {
                from: { x: A.x, y: A.y, z: z0 }, to: { x: B.x, y: B.y, z: z1 },
                f: seg.f, type: seg.type, I: null, J: null, R: null,
                isStartOrEndHome: false, isTab: isTab, lineIdx: seg.lineIdx, hasZ: hasZ
            };
            if (g.kind === 'A') { s.I = g.cx - A.x; s.J = g.cy - A.y; }
            return s;
        };
        const vert = (t, z0, z1, f) => {
            const P = geomPointAt(g, t);
            return {
                from: { x: P.x, y: P.y, z: z0 }, to: { x: P.x, y: P.y, z: z1 },
                f: f, type: 'G1', I: null, J: null, R: null,
                isStartOrEndHome: false, isTab: true, lineIdx: seg.lineIdx, hasZ: true
            };
        };

        const out = [];
        let cur = 0;
        let firstPiece = true;
        merged.forEach(m => {
            if (m[0] > cur + 1e-4) {
                out.push(mk(cur, m[0], firstPiece ? seg.from.z : baseZ, baseZ, false, firstPiece ? seg.hasZ : false));
                firstPiece = false;
            }
            out.push(vert(m[0], baseZ, bridgeZ, seg.f));
            out.push(mk(m[0], m[1], bridgeZ, bridgeZ, true, true));
            out.push(vert(m[1], bridgeZ, baseZ, plungeF));
            firstPiece = false;
            cur = m[1];
        });
        if (cur < g.len - 1e-4) out.push(mk(cur, g.len, baseZ, baseZ, false, false));
        return out;
    }

    function updateTabWarningUI() {
        const box = document.getElementById('tabWarning');
        if (!box) return;
        const enabled = document.getElementById('tabEnable') && document.getElementById('tabEnable').checked;
        if (!enabled || lastTabWarnings.length === 0) {
            box.classList.add('hidden');
            box.innerHTML = '';
            return;
        }
        box.classList.remove('hidden');
        const title = currentLang === 'zh' ? '⚠ 橋位警告' : '⚠ Tab warnings';
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        box.innerHTML = `<div class="font-bold mb-1">${title}</div>` + lastTabWarnings.map(m => `<div>• ${esc(m)}</div>`).join('');
    }

    function applyTabsToPaths(pathData) {
        lastTabWarnings = [];
        const tabEnable = document.getElementById('tabEnable') && document.getElementById('tabEnable').checked;
        if (!tabEnable) { updateTabWarningUI(); return pathData; }

        const { W, H } = getTabSettings();
        const T = TAB_MSG[currentLang] || TAB_MSG.zh;
        const plungeF = detectFirstZFeedrate(pathData);
        const result = [];
        let currentRun = [];
        let contourNo = 0;
        const isXYCut = s => (s.type === 'G1' || s.type === 'G2' || s.type === 'G3');

        const flushRun = () => {
            if (currentRun.length === 0) return;
            const Zd = Math.min(...currentRun.map(s => s.to.z));
            if (!(Zd < -0.01)) { currentRun.forEach(s => result.push(s)); currentRun = []; return; }

            const isFinalFlat = s => isXYCut(s) && Math.abs(s.from.z - Zd) < 0.01 && Math.abs(s.to.z - Zd) < 0.01 && segGeom(s);
            const rampSegs = currentRun.filter(s => isXYCut(s) && Math.abs(s.from.z - s.to.z) > 0.01 && segGeom(s));

            // 以深度最深那一層的連續片段為一條「切割路徑」
            const groups = [];
            let grp = null;
            currentRun.forEach(s => {
                if (isFinalFlat(s)) {
                    if (!grp) { grp = []; groups.push(grp); }
                    grp.push(s);
                } else grp = null;
            });

            const bridgeZ = Math.min(0, Zd + H);
            const allTabs = [];
            groups.forEach(gs => {
                const plan = planTabsForGroup(gs, W, rampSegs);
                if (plan.L < 3) return;  // 太短的零碎線段 (例如退刀小段) 不處理
                contourNo++;
                const name = (currentLang === 'zh' ? '輪廓 #' : 'Contour #') + contourNo +
                    ` (X${gs[0].from.x.toFixed(1)} Y${gs[0].from.y.toFixed(1)})`;
                const vars = { name, L: plan.L.toFixed(1), W, n0: plan.n0, n: plan.n };
                plan.warns.forEach(w => lastTabWarnings.push(T[w.code](Object.assign({}, vars, w))));
                if (bridgeZ > -0.001 && plan.tabs.length) {
                    lastTabWarnings.push(T.high({ name, H, D: Math.abs(Zd).toFixed(1) }));
                }
                plan.tabs.forEach(t => allTabs.push(t));
            });

            // 每一層只要深度低於橋位頂面，就要保留橋位 (橋高可大於每層下刀量)
            currentRun.forEach(seg => {
                const flat = Math.abs(seg.from.z - seg.to.z) < 0.01;
                if (allTabs.length && flat && isXYCut(seg) && seg.to.z < bridgeZ - 0.001) {
                    const parts = splitSegmentWithTabs(seg, allTabs, bridgeZ, plungeF);
                    for (let k = 0; k < parts.length; k++) result.push(parts[k]);
                } else {
                    result.push(seg);
                }
            });
            currentRun = [];
        };

        pathData.forEach(seg => {
            if (seg.isStartOrEndHome || seg.type === 'G0') {
                flushRun();
                result.push(seg);
            } else {
                currentRun.push(seg);
            }
        });
        flushRun();

        // 相鄰橋位之間 (橋位下降後立刻上升於同一點) 合併，避免多餘的 Z 動作
        const cleanResult = [];
        for (let i = 0; i < result.length; i++) {
            const cur = result[i];
            if (cur.isTab && Math.abs(cur.from.x - cur.to.x) < 1e-4 && Math.abs(cur.from.y - cur.to.y) < 1e-4 && cur.from.z > cur.to.z) {
                if (i + 1 < result.length) {
                    const next = result[i + 1];
                    if (next.isTab && Math.abs(next.from.x - next.to.x) < 1e-4 && Math.abs(next.from.y - next.to.y) < 1e-4 && next.to.z > next.from.z) {
                        if (Math.abs(cur.to.x - next.from.x) < 1e-4 && Math.abs(cur.to.y - next.from.y) < 1e-4) {
                            i++;
                            continue;
                        }
                    }
                }
            }
            cleanResult.push(cur);
        }

        updateTabWarningUI();
        return cleanResult;
    }

    // 將縮放 / 旋轉 / 偏移一次套用到路徑資料 (含圓弧 I/J/R)，之後的橋位與輸出都以「最終座標」計算
    function transformPathData(pathData) {
        const scale = parseFloat(document.getElementById('scaleInput').value) || 1;
        const offX = parseFloat(document.getElementById('offsetX').value) || 0;
        const offY = parseFloat(document.getElementById('offsetY').value) || 0;
        const rotRad = (parseFloat(document.getElementById('rotationInput').value) || 0) * Math.PI / 180;
        const cosR = Math.cos(rotRad), sinR = Math.sin(rotRad);
        const T = (p, home) => home ? { ...p, x: 0, y: 0 } : {
            ...p,
            x: (p.x * cosR - p.y * sinR) * scale + offX,
            y: (p.x * sinR + p.y * cosR) * scale + offY
        };
        return pathData.map((seg, idx) => {
            const firstHome = idx === 0 && Math.abs(seg.from.x) < 1e-4 && Math.abs(seg.from.y) < 1e-4;
            const out = { ...seg, from: T(seg.from, seg.isStartOrEndHome || firstHome), to: T(seg.to, seg.isStartOrEndHome) };
            if (seg.type === 'G2' || seg.type === 'G3') {
                if (seg.I !== null || seg.J !== null) {
                    const rI = seg.I || 0, rJ = seg.J || 0;
                    out.I = (rI * cosR - rJ * sinR) * scale;
                    out.J = (rI * sinR + rJ * cosR) * scale;
                }
                if (seg.R !== null) out.R = seg.R * scale;
            }
            return out;
        });
    }

    function compileSegmentsToGcode(segments, state) {
        if (!state) {
            state = {
                lastX: null,
                lastY: null,
                lastZ: null,
                activeFeedrate: null,
                hasOutputXYFInCurrentCut: false
            };
        }

        const scale = 1, offX = 0, offY = 0, rotRad = 0;
        const res = parseFloat(document.getElementById('resInput').value) || 0.1;
        const cosR = Math.cos(rotRad), sinR = Math.sin(rotRad);
        const rHeight = getRetractHeight();

        const feedrateEnable = document.getElementById('feedrateEnable') && document.getElementById('feedrateEnable').checked;
        const targetFeedrate = parseFloat(document.getElementById('targetFeedrateInput').value) || 1200;
        const targetZFeedrate = parseFloat(document.getElementById('targetZFeedrateInput').value) || 400;

        const gcodeLines = [];

        segments.forEach((seg, idx) => {
            let fZ = seg.to.z;
            
            if (fZ > 0.0001) {
                fZ = rHeight;
            }

            let fX = 0, fY = 0;
            if (seg.isStartOrEndHome) {
                fX = 0; fY = 0;
            } else {
                fX = (seg.to.x * cosR - seg.to.y * sinR) * scale + offX;
                fY = (seg.to.x * sinR + seg.to.y * cosR) * scale + offY;
            }

            const dXY = state.lastX !== null ? Math.sqrt((fX - state.lastX)**2 + (fY - state.lastY)**2) : Infinity;
            
            let zChanged = false;
            if (state.lastZ === null) {
                if (seg.hasZ || Math.abs(fZ) > 1e-4) {
                    zChanged = true;
                }
            } else {
                if (Math.abs(fZ - state.lastZ) > 0.0001) {
                    zChanged = true;
                }
            }

            const isLastMove = (idx === segments.length - 1);

            if (state.lastX !== null && seg.type === 'G1' && !seg.isTab && dXY < res && !zChanged && !isLastMove) {
                return; 
            }

            if (seg.type === 'G0') {
                state.hasOutputXYFInCurrentCut = false;
            }

            let fFromX = 0, fFromY = 0;
            if (seg.isStartOrEndHome) {
                fFromX = 0; fFromY = 0;
            } else {
                fFromX = (seg.from.x * cosR - seg.from.y * sinR) * scale + offX;
                fFromY = (seg.from.x * sinR + seg.from.y * cosR) * scale + offY;
            }

            const segmentPhysicalXYChanged = state.lastX === null || Math.sqrt((fX - fFromX)**2 + (fY - fFromY)**2) > 0.0001;
            const isZOnlyMove = !segmentPhysicalXYChanged && zChanged;

            let newlineParts = [];
            newlineParts.push(seg.type);
            
            if (!isZOnlyMove) {
                newlineParts.push('X' + formatNum(fX, 4));
                newlineParts.push('Y' + formatNum(fY, 4));
            }
            
            if (zChanged) {
                newlineParts.push('Z' + formatNum(fZ, 4));
            }

            if (seg.type === 'G2' || seg.type === 'G3') {
                if (seg.I !== null || seg.J !== null) {
                    const rawI = seg.I || 0;
                    const rawJ = seg.J || 0;
                    let fI = (rawI * cosR - rawJ * sinR) * scale;
                    let fJ = (rawI * sinR + rawJ * cosR) * scale;
                    newlineParts.push('I' + formatNum(fI, 4));
                    newlineParts.push('J' + formatNum(fJ, 4));
                }
                if (seg.R !== null) {
                    let fR = seg.R * scale;
                    newlineParts.push('R' + formatNum(fR, 4));
                }
            }

            let segF = seg.f;
            if (seg.type !== 'G0') {
                const isXYMove = !isZOnlyMove && (seg.type === 'G1' || seg.type === 'G2' || seg.type === 'G3');
                
                if (isXYMove) {
                    if (!state.hasOutputXYFInCurrentCut) {
                        if (feedrateEnable) {
                            segF = targetFeedrate;
                        }
                        state.hasOutputXYFInCurrentCut = true;
                        if (state.activeFeedrate === null || Math.abs(segF - state.activeFeedrate) > 0.01) {
                            newlineParts.push('F' + formatNum(segF, 2));
                            state.activeFeedrate = segF;
                        }
                    } else {
                        if (feedrateEnable) {
                            segF = targetFeedrate;
                        }
                        if (state.activeFeedrate === null || Math.abs(segF - state.activeFeedrate) > 0.01) {
                            newlineParts.push('F' + formatNum(segF, 2));
                            state.activeFeedrate = segF;
                        }
                    }
                } else {
                    if (feedrateEnable) {
                        segF = targetZFeedrate;
                    }
                    if (segF) {
                        if (state.activeFeedrate === null || Math.abs(segF - state.activeFeedrate) > 0.01) {
                            newlineParts.push('F' + formatNum(segF, 2));
                            state.activeFeedrate = segF;
                        }
                    }
                }
            } else {
                /* G0 快速移動：僅在純走 XY 軸（Z 軸無變動）時加入 F2000 */
                const isPureXYMove = segmentPhysicalXYChanged && !zChanged;
                if (isPureXYMove) {
                    const g0Feedrate = 2000;
                    if (state.activeFeedrate === null || Math.abs(g0Feedrate - state.activeFeedrate) > 0.01) {
                        newlineParts.push('F' + formatNum(g0Feedrate, 2));
                        state.activeFeedrate = g0Feedrate;
                    }
                }
            }

            gcodeLines.push(newlineParts.join(' '));
            
            state.lastX = fX; 
            state.lastY = fY; 
            state.lastZ = fZ;
        });

        return gcodeLines;
    }
