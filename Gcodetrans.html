    function updateThreeGrid() {
        if (!scene) return;
        if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
        if (originAxes) { scene.remove(originAxes); originAxes.geometry.dispose(); originAxes.material.dispose(); }
        if (originMarker) { scene.remove(originMarker); originMarker.geometry.dispose(); originMarker.material.dispose(); }
        const isLight = !document.documentElement.classList.contains('dark');
        
        const gridColor = isLight ? 0xcccccc : 0x222222;
        const centerColor = isLight ? 0x059669 : 0x10b981;
        
        // 格線只負責提供 50mm 刻度 (中心線與一般線同色)；格線中心已對齊 50mm 的倍數，
        // 因此每條格線都落在「距座標原點 50mm 整數倍」的位置
        grid = new THREE.GridHelper(currentGridSize, currentGridDivisions, gridColor, gridColor);
        grid.rotation.x = Math.PI / 2;
        grid.position.set(currentGridCenterX, currentGridCenterY, 0);
        scene.add(grid);

        // 十字座標軸固定畫在世界座標原點 (0,0)，不隨路徑或格線範圍移動，
        // 平移 (X/Y 偏移) 時可直接看出路徑與座標原點的對應關係
        const half = currentGridSize / 2;
        const axisVerts = new Float32Array([
            currentGridCenterX - half, 0, 0,   currentGridCenterX + half, 0, 0,   // X 軸
            0, currentGridCenterY - half, 0,   0, currentGridCenterY + half, 0    // Y 軸
        ]);
        const axisGeo = new THREE.BufferGeometry();
        axisGeo.setAttribute('position', new THREE.BufferAttribute(axisVerts, 3));
        originAxes = new THREE.LineSegments(axisGeo, new THREE.LineBasicMaterial({ color: centerColor, depthTest: false }));
        originAxes.renderOrder = 1;
        scene.add(originAxes);

        // 原點標記：固定在 (0,0) 的橘色圓點，大小以螢幕像素計算 (縮放視角時不會變大變小)，並顯示在路徑之上
        const markerGeo = new THREE.BufferGeometry();
        markerGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
        originMarker = new THREE.Points(markerGeo, new THREE.PointsMaterial({
            color: isLight ? 0xea580c : 0xfb923c,
            size: 9,
            sizeAttenuation: false,
            depthTest: false
        }));
        originMarker.renderOrder = 2;
        scene.add(originMarker);
        requestRender();
    }

    function initThree() {
        const container = document.getElementById('preview-container');
        scene = new THREE.Scene();
        cameraTarget = new THREE.Vector3(0, 0, 0);
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 10000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(200, 500, 300);
        scene.add(light);

        updateThreeGrid();

        camera.position.set(200, -200, 200);
        camera.up.set(0, 0, 1);
        camera.lookAt(cameraTarget);

        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };

        const handleMove = (x, y, buttons) => {
            if (!isDragging) return;
            const deltaX = x - previousMouse.x;
            const deltaY = y - previousMouse.y;
            
            if (buttons === 1) {
                const offset = new THREE.Vector3().subVectors(camera.position, cameraTarget);
                const radius = offset.length();
                let phi = Math.atan2(offset.y, offset.x) - deltaX * 0.005;
                let theta = Math.acos(offset.z / radius) - deltaY * 0.005;
                theta = Math.max(0.01, Math.min(Math.PI - 0.01, theta));
                
                camera.position.x = cameraTarget.x + radius * Math.sin(theta) * Math.cos(phi);
                camera.position.y = cameraTarget.y + radius * Math.sin(theta) * Math.sin(phi);
                camera.position.z = cameraTarget.z + radius * Math.cos(theta);
            } else if (buttons === 2) {
                const factor = 0.0015 * camera.position.distanceTo(cameraTarget);
                const localRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
                
                const panOffset = new THREE.Vector3()
                    .addScaledVector(localRight, -deltaX * factor)
                    .addScaledVector(localUp, deltaY * factor);
                
                camera.position.add(panOffset);
                cameraTarget.add(panOffset);
            }
            camera.lookAt(cameraTarget);
            previousMouse = { x, y };
            requestRender();
        };

        container.addEventListener('mousedown', e => { 
            isDragging = true; 
            previousMouse = { x: e.clientX, y: e.clientY }; 
        });
        window.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mousemove', e => {
            handleMove(e.clientX, e.clientY, e.buttons);
        });
        container.addEventListener('wheel', e => {
            const dir = new THREE.Vector3().subVectors(camera.position, cameraTarget).normalize();
            const dist = camera.position.distanceTo(cameraTarget);
            const newDist = e.deltaY > 0 ? dist * 1.1 : dist / 1.1;
            camera.position.copy(cameraTarget).addScaledVector(dir, newDist);
            camera.lookAt(cameraTarget);
            requestRender();
        });
        container.oncontextmenu = e => { e.preventDefault(); };

        let initialPinchDist = 0;
        let initialCamRadius = 0;

        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDist = Math.sqrt(dx * dx + dy * dy);
                
                const offset = new THREE.Vector3().subVectors(camera.position, cameraTarget);
                initialCamRadius = offset.length();

                previousMouse = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        }, { passive: true });

        container.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && isDragging) {
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                handleMove(x, y, 1);
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (initialPinchDist > 0 && dist > 10) {
                    const factor = initialPinchDist / dist;
                    const newRadius = Math.max(10, Math.min(1500, initialCamRadius * factor));
                    const dir = new THREE.Vector3().subVectors(camera.position, cameraTarget).normalize();
                    camera.position.copy(cameraTarget).addScaledVector(dir, newRadius);
                }

                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const deltaX = midX - previousMouse.x;
                const deltaY = midY - previousMouse.y;
                
                const factor = 0.0015 * camera.position.distanceTo(cameraTarget);
                const localRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
                
                const panOffset = new THREE.Vector3()
                    .addScaledVector(localRight, -deltaX * factor)
                    .addScaledVector(localUp, deltaY * factor);
                
                camera.position.add(panOffset);
                cameraTarget.add(panOffset);
                
                camera.lookAt(cameraTarget);
                previousMouse = { x: midX, y: midY };
                requestRender();
            }
        }, { passive: true });

        container.addEventListener('touchend', () => {
            isDragging = false;
            initialPinchDist = 0;
        });

        animate();
    }

    // 依需求渲染：只有視角/內容/尺寸改變時才重繪，閒置時不佔用 GPU
    let renderQueued = false;
    function requestRender() {
        if (renderQueued || !renderer) return;
        renderQueued = true;
        requestAnimationFrame(() => {
            renderQueued = false;
            renderer.render(scene, camera);
        });
    }
    function animate() { requestRender(); }

    // 釋放 Three.js 物件的 GPU 資源
    function disposeObject(root) {
        const geos = new Set(), mats = new Set(), texs = new Set();
        root.traverse(o => {
            if (o.geometry) geos.add(o.geometry);
            if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { mats.add(m); if (m.map) texs.add(m.map); });
        });
        geos.forEach(g => g.dispose());
        mats.forEach(m => m.dispose());
        texs.forEach(t => t.dispose());
    }

    // 連續輸入事件合併成每個畫面幀只重算一次
    let processRaf = 0;
    function scheduleProcess() {
        if (processRaf) return;
        processRaf = requestAnimationFrame(() => { processRaf = 0; processAndPreview(); });
    }

    // 格式化數字：四捨五入至指定位數並自動去除尾數不必要的 0
    function formatNum(val, maxDecimals = 4) {
        if (typeof val !== 'number' || isNaN(val)) return '0';
        let res = parseFloat(val.toFixed(maxDecimals));
        if (Object.is(res, -0) || res === 0) res = 0;
        return res.toString();
    }

    function convertInchToMetric(text) {
        const lines = text.split('\n');
        let isInchMode = false;
        
        const converted = lines.map(line => {
            let cmd = line.trim();
            if (!cmd) return line;

            let cleanCmd = cmd;
            let comment = "";
            const semiIdx = cmd.indexOf(';');
            if (semiIdx !== -1) {
                cleanCmd = cmd.substring(0, semiIdx).trim();
                comment = cmd.substring(semiIdx);
            }

            let parenComments = [];
            cleanCmd = cleanCmd.replace(/\([^)]*\)/g, (match) => {
                parenComments.push(match);
                return `__COMMENT_PLACEHOLDER_${parenComments.length - 1}__`;
            });

            if (/\bG0*20\b/i.test(cleanCmd)) {
                isInchMode = true;
                cleanCmd = cleanCmd.replace(/\bG0*20\b/gi, 'G21');
            } else if (/\bG0*21\b/i.test(cleanCmd)) {
                isInchMode = false;
            }

            if (isInchMode) {
                cleanCmd = cleanCmd.replace(/([XYZIJKRF])\s*([-+]?[0-9]*\.?[0-9]+)/gi, (match, letter, valStr) => {
                    const val = parseFloat(valStr);
                    const convertedVal = val * 25.4;
                    return letter.toUpperCase() + formatNum(convertedVal, 4);
                });
            }

            parenComments.forEach((pc, idx) => {
                cleanCmd = cleanCmd.replace(`__COMMENT_PLACEHOLDER_${idx}__`, pc);
            });

            return cleanCmd + comment;
        });

        return converted.join('\n');
    }

    function hasG20Active(text) {
        const lines = text.split('\n');
        for (let line of lines) {
            let clean = line.split(';')[0].replace(/\([^)]*\)/g, '').trim();
            if (/\bG0*20\b/i.test(clean)) {
                return true;
            }
        }
        return false;
    }

    // 解析單行指令中的「字母+數值」字組 (共用同一個正規表示式，避免每行重新建立迭代器與陣列)
    const WORD_RE = /([A-Z])\s*([-+]?[0-9]*\.?[0-9]+)/gi;
    function parseWords(str) {
        const words = {};
        WORD_RE.lastIndex = 0;
        let m;
        while ((m = WORD_RE.exec(str)) !== null) {
            words[m[1]] = parseFloat(m[2]);
        }
        return words;
    }

    // 逐行解析一次：空行/註解行為 null，其餘為該行的字組
    function parseLineWords(lines) {
        const out = new Array(lines.length);
        for (let i = 0; i < lines.length; i++) {
            const cmd = lines[i].trim().toUpperCase();
            if (!cmd || cmd.startsWith('(') || cmd.startsWith(';')) { out[i] = null; continue; }
            const semiIdx = cmd.indexOf(';');
            out[i] = parseWords(semiIdx !== -1 ? cmd.substring(0, semiIdx).trim() : cmd);
        }
        return out;
    }

    function findMachiningBoundsFromWords(lineWords) {
        let firstMachiningIdx = -1;
        let lastMachiningIdx = -1;
        let currentMotionMode = null;
        
        for (let i = 0; i < lineWords.length; i++) {
            const words = lineWords[i];
            if (!words) continue;
            
            if (words['G'] !== undefined) {
                const gVal = Math.round(words['G']);
                if (gVal === 0) currentMotionMode = 'G0';
                else if (gVal === 1) currentMotionMode = 'G1';
                else if (gVal === 2) currentMotionMode = 'G2';
                else if (gVal === 3) currentMotionMode = 'G3';
            }
            
            const hasX = words['X'] !== undefined;
            const hasY = words['Y'] !== undefined;
            
            if ((hasX || hasY) && currentMotionMode && currentMotionMode !== 'G0') {
                if (firstMachiningIdx === -1) firstMachiningIdx = i;
                lastMachiningIdx = i;
            }
        }
        
        return { firstMachiningIdx, lastMachiningIdx };
    }

    function findArcCenter(p1, p2, I, J, R, isCW) {
        if (I !== null && J !== null) {
            return { x: p1.x + I, y: p1.y + J };
        }
        if (R !== null) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d === 0) return { x: p1.x, y: p1.y };
            
            let r = Math.abs(R);
            if (r < d / 2) {
                r = d / 2 + 0.0001;
            }
            const h = Math.sqrt(r * r - (d / 2) * (d / 2));
            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;
            const nx = -dy / d;
            const ny = dx / d;

            let factor = (isCW ? 1 : -1) * (R < 0 ? -1 : 1);
            return {
                x: mx + factor * h * nx,
                y: my + factor * h * ny
            };
        }
        return null;
    }

    function generateArcPoints(p1, p2, I, J, R, isCW) {
        const points = [];
        let cx, cy, r;

        if (R !== null) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d === 0 || Math.abs(R) < d / 2) {
                return [new THREE.Vector3(p1.x, p1.y, p1.z), new THREE.Vector3(p2.x, p2.y, p2.z)];
            }
            r = Math.abs(R);
            const h = Math.sqrt(r * r - (d / 2) * (d / 2));
            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;
            const nx = -dy / d;
            const ny = dx / d;

            let factor = (isCW ? 1 : -1) * (R < 0 ? -1 : 1);
            cx = mx + factor * h * nx;
            cy = my + factor * h * ny;
        } else {
            cx = p1.x + (I || 0);
            cy = p1.y + (J || 0);
            r = Math.sqrt((p1.x - cx)**2 + (p1.y - cy)**2);
        }

        let startAngle = Math.atan2(p1.y - cy, p1.x - cx);
        let endAngle = Math.atan2(p2.y - cy, p2.x - cx);

        let diff = endAngle - startAngle;
        if (isCW) {
            if (diff >= 0) diff -= 2 * Math.PI;
        } else {
            if (diff <= 0) diff += 2 * Math.PI;
        }

        const numSegments = Math.max(8, Math.min(64, Math.ceil(Math.abs(diff) / (Math.PI / 16))));
        for (let s = 0; s <= numSegments; s++) {
            const t = s / numSegments;
            const angle = startAngle + diff * t;
            const z = p1.z + (p2.z - p1.z) * t; 
            points.push(new THREE.Vector3(cx + r * Math.cos(angle), cy + r * Math.sin(angle), z));
        }

        return points;
    }

    function getRetractHeight() {
        const retractEnable = document.getElementById('retractEnable') && document.getElementById('retractEnable').checked;
        if (retractEnable) {
            let val = parseFloat(document.getElementById('retractHeightInput').value);
            if (isNaN(val)) return 3.0;
            return Math.max(0.1, Math.min(5.0, val));
        }
        return 3.0;
    }

    function parseGcode(text) {
        const lines = text.split('\n');
        const lineWords = parseLineWords(lines);
        const bounds = findMachiningBoundsFromWords(lineWords);
        const firstMachiningIdx = bounds.firstMachiningIdx;
        const lastMachiningIdx = bounds.lastMachiningIdx;
        let currentPos = { x: 0, y: 0, z: 0, f: 1000 };
        let activeMotion = null; 
        const pathData = [];
        const rHeight = getRetractHeight();

        lineWords.forEach((words, index) => {
            if (!words) return;

            if (words['G'] !== undefined) {
                const gVal = Math.round(words['G']);
                if (gVal === 0) activeMotion = 'G0';
                else if (gVal === 1) activeMotion = 'G1';
                else if (gVal === 2) activeMotion = 'G2';
                else if (gVal === 3) activeMotion = 'G3';
            }

            const hasCoords = (words['X'] !== undefined || words['Y'] !== undefined || words['Z'] !== undefined || words['I'] !== undefined || words['J'] !== undefined || words['R'] !== undefined);

            if (hasCoords && activeMotion) {
                let newX = words['X'] !== undefined ? words['X'] : currentPos.x;
                let newY = words['Y'] !== undefined ? words['Y'] : currentPos.y;
                let newZ = words['Z'] !== undefined ? words['Z'] : currentPos.z;
                
                if (newZ > 0.0001) {
                    newZ = rHeight;
                }

                if (words['F'] !== undefined) currentPos.f = words['F'];

                const isStartOrEndHome = (firstMachiningIdx !== -1 && (index < firstMachiningIdx || index > lastMachiningIdx)) && 
                                         (Math.abs(newX) < 1e-4 && Math.abs(newY) < 1e-4);

                pathData.push({
                    from: { ...currentPos },
                    to: { x: newX, y: newY, z: newZ },
                    f: currentPos.f,
                    type: activeMotion,
                    I: words['I'] !== undefined ? words['I'] : null,
                    J: words['J'] !== undefined ? words['J'] : null,
                    R: words['R'] !== undefined ? words['R'] : null,
                    isStartOrEndHome: isStartOrEndHome,
                    lineIdx: index,
                    hasZ: words['Z'] !== undefined
                });

                currentPos.x = newX;
                currentPos.y = newY;
                currentPos.z = newZ;
            } else if (words['F'] !== undefined) {
                currentPos.f = words['F'];
            }
        });
        return pathData;
    }

    function detectOriginalDepth(path) {
        let minZ = 0;
        path.forEach(seg => {
            if (seg.type !== 'G0' && !seg.isStartOrEndHome) {
                if (seg.to.z < minZ) minZ = seg.to.z;
                if (seg.from.z < minZ) minZ = seg.from.z;
            }
        });
        return Math.abs(minZ);
    }

    function detectFirstFeedrate(path) {
        for (let seg of path) {
            if (seg.type !== 'G0' && !seg.isStartOrEndHome) {
                const dx = seg.to.x - seg.from.x;
                const dy = seg.to.y - seg.from.y;
                const dXY = Math.sqrt(dx * dx + dy * dy);
                if (dXY > 1e-4 && seg.f > 0) {
                    return seg.f;
                }
            }
        }
        return 1200;
    }

    function detectFirstZFeedrate(path) {
        for (let seg of path) {
            if (seg.type === 'G1' && !seg.isStartOrEndHome) {
                const dx = seg.to.x - seg.from.x;
                const dy = seg.to.y - seg.from.y;
                const dXY = Math.sqrt(dx * dx + dy * dy);
                const dZ = Math.abs(seg.to.z - seg.from.z);
                if (dXY < 1e-4 && dZ > 1e-4 && seg.f > 0) {
                    return seg.f;
                }
            }
        }
        return 400;
    }

    function detectOriginalStepdown(path) {
        const zs = [];
        path.forEach(seg => {
            if (seg.to.z < -0.001) {
                zs.push(parseFloat(seg.to.z.toFixed(4)));
            }
        });
        const uniqueZs = [...new Set(zs)].sort((a, b) => b - a);
        if (uniqueZs.length >= 2) {
            return Math.abs(uniqueZs[1] - uniqueZs[0]);
        } else if (uniqueZs.length === 1) {
            return Math.abs(uniqueZs[0]);
        }
        return 1.5;
    }

    function applyThicknessAdjustment(pathData) {
        const thickEnable = document.getElementById('thickEnable') && document.getElementById('thickEnable').checked;
        if (!thickEnable) return pathData;

        const detectedDepth = parseFloat(document.getElementById('origThickInput').value) || 0;
        const targetDepth = parseFloat(document.getElementById('targetThickInput').value) || 0;
        const layers = parseInt(document.getElementById('targetLayersInput').value) || 12;

        if (detectedDepth <= 0.0001 || targetDepth <= 0.0001 || layers < 1) return pathData;

        const stepdown = targetDepth / layers;

        const blocks = [];
        let currentBlock = { type: 'rapid', segments: [] };
        blocks.push(currentBlock);

        pathData.forEach(seg => {
            const isCut = (seg.from.z < -0.001 || seg.to.z < -0.001) && seg.type !== 'G0';
            if (isCut) {
                if (currentBlock.type === 'rapid') {
                    currentBlock = { type: 'contour', segments: [] };
                    blocks.push(currentBlock);
                }
                currentBlock.segments.push(seg);
            } else {
                if (currentBlock.type === 'contour') {
                    currentBlock = { type: 'rapid', segments: [] };
                    blocks.push(currentBlock);
                }
                currentBlock.segments.push(seg);
            }
        });

        const rebuiltSegments = [];

        blocks.forEach(block => {
            if (block.type === 'contour' && block.segments.length > 0) {
                const zs = [];
                block.segments.forEach(seg => {
                    if (seg.to.z < -0.001) {
                        zs.push(parseFloat(seg.to.z.toFixed(4)));
                    }
                });
                const uniqueZs = [...new Set(zs)].sort((a, b) => b - a);

                if (uniqueZs.length > 0) {
                    const firstZ = uniqueZs[0];

                    const profile = [];
                    for (let seg of block.segments) {
                        if (seg.to.z < firstZ - 0.01 || seg.to.z > -0.001) {
                            break;
                        }
                        profile.push(seg);
                    }

                    if (profile.length > 0) {
                        const newZs = [];
                        let current = stepdown;
                        while (current < targetDepth - 1e-4) {
                            newZs.push(-current);
                            current += stepdown;
                        }
                        newZs.push(-targetDepth);

                        let prevZ = block.segments[0].from.z;

                        newZs.forEach((targetZ) => {
                            profile.forEach((origSeg, segIdx) => {
                                const newSeg = { ...origSeg, hasZ: true };
                                if (segIdx === 0) {
                                    newSeg.from = { ...origSeg.from, z: prevZ };
                                    newSeg.to = { ...origSeg.to, z: targetZ };
                                } else {
                                    newSeg.from = { ...origSeg.from, z: targetZ };
                                    newSeg.to = { ...origSeg.to, z: targetZ };
                                }
                                rebuiltSegments.push(newSeg);
                            });
                            prevZ = targetZ;
                        });

                        const lastOrigSeg = block.segments[block.segments.length - 1];
                        if (lastOrigSeg && lastOrigSeg.to.z > -0.001) {
                            const finalLift = { ...lastOrigSeg, hasZ: true };
                            finalLift.from = { ...lastOrigSeg.from, z: prevZ };
                            finalLift.to = { ...lastOrigSeg.to };
                            rebuiltSegments.push(finalLift);
                        }
                    } else {
                        for (let k = 0; k < block.segments.length; k++) rebuiltSegments.push(block.segments[k]);
                    }
                } else {
                    for (let k = 0; k < block.segments.length; k++) rebuiltSegments.push(block.segments[k]);
                }
            } else {
                for (let k = 0; k < block.segments.length; k++) rebuiltSegments.push(block.segments[k]);
            }
        });

        return rebuiltSegments;
    }

    function applyFeedrateAdjustment(pathData) {
        const feedrateEnable = document.getElementById('feedrateEnable') && document.getElementById('feedrateEnable').checked;
        if (!feedrateEnable) return pathData;

        const targetFeedrate = parseFloat(document.getElementById('targetFeedrateInput').value) || 1200;
        const targetZFeedrate = parseFloat(document.getElementById('targetZFeedrateInput').value) || 400;

        return pathData.map(seg => {
            if (seg.type === 'G0') return seg;
            const dx = seg.to.x - seg.from.x;
            const dy = seg.to.y - seg.from.y;
            const dXY = Math.sqrt(dx * dx + dy * dy);
            const dZ = Math.abs(seg.to.z - seg.from.z);

            let newF = seg.f;
            if (dXY > 1e-4) {
                newF = targetFeedrate;
            } else if (dZ > 1e-4) {
                newF = targetZFeedrate;
            }
            return { ...seg, f: newF };
        });
    }

    function splitSegmentWithTabs(seg, tabs, stepdown, R) {
        if (seg.type !== 'G1') return [seg];

        const dx = seg.to.x - seg.from.x;
        const dy = seg.to.y - seg.from.y;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len < 1e-4) return [seg];

        const ux = dx / len;
        const uy = dy / len;

        const hitTabs = [];
        tabs.forEach(tabPt => {
            const projT = ((tabPt.x - seg.from.x) * ux + (tabPt.y - seg.from.y) * uy);
            if (projT > R && projT < len - R) {
                const projX = seg.from.x + projT * ux;
                const projY = seg.from.y + projT * uy;
                const distToLine = Math.sqrt((tabPt.x - projX)**2 + (tabPt.y - projY)**2);
                if (distToLine < 1e-3) {
                    hitTabs.push({
                        startT: Math.max(0, projT - R),
                        endT: Math.min(len, projT + R)
                    });
                }
            }
        });

        if (hitTabs.length === 0) return [seg];

        hitTabs.sort((a, b) => a.startT - b.startT);

        const subSegs = [];
        let curT = 0;
        const tabHeight = Math.min(1.5, stepdown * 0.8);

        hitTabs.forEach(tab => {
            if (tab.startT > curT + 1e-4) {
                subSegs.push({
                    from: { x: seg.from.x + curT * ux, y: seg.from.y + curT * uy, z: seg.from.z },
                    to: { x: seg.from.x + tab.startT * ux, y: seg.from.y + tab.startT * uy, z: seg.to.z },
                    f: seg.f,
                    type: 'G1',
                    isStartOrEndHome: false,
                    isTab: false,
                    lineIdx: seg.lineIdx,
                    hasZ: seg.hasZ
                });
            }

            const tabFromX = seg.from.x + tab.startT * ux;
            const tabFromY = seg.from.y + tab.startT * uy;
            const tabToX = seg.from.x + tab.endT * ux;
            const tabToY = seg.from.y + tab.endT * uy;
            const baseZ = seg.to.z;
            const bridgeZ = baseZ + tabHeight;

            subSegs.push({
                from: { x: tabFromX, y: tabFromY, z: baseZ },
                to: { x: tabFromX, y: tabFromY, z: bridgeZ },
                f: seg.f,
                type: 'G1',
                isStartOrEndHome: false,
                isTab: true,
                lineIdx: seg.lineIdx,
                hasZ: true
            });

            subSegs.push({
                from: { x: tabFromX, y: tabFromY, z: bridgeZ },
                to: { x: tabToX, y: tabToY, z: bridgeZ },
                f: seg.f,
                type: 'G1',
                isStartOrEndHome: false,
                isTab: true,
                lineIdx: seg.lineIdx,
                hasZ: true
            });

            subSegs.push({
                from: { x: tabToX, y: tabToY, z: bridgeZ },
                to: { x: tabToX, y: tabToY, z: baseZ },
                f: seg.f,
                type: 'G1',
                isStartOrEndHome: false,
                isTab: true,
                lineIdx: seg.lineIdx,
                hasZ: true
            });

            curT = tab.endT;
        });

        if (curT < len - 1e-4) {
            subSegs.push({
                from: { x: seg.from.x + curT * ux, y: seg.from.y + curT * uy, z: seg.from.z },
                to: { x: seg.to.x, y: seg.to.y, z: seg.to.z },
                f: seg.f,
                type: 'G1',
                isStartOrEndHome: false,
                isTab: false,
                lineIdx: seg.lineIdx,
                hasZ: seg.hasZ
            });
        }

        return subSegs;
    }

    function applyTabsToPaths(pathData) {
        const tabEnable = document.getElementById('tabEnable') && document.getElementById('tabEnable').checked;
        if (!tabEnable) return pathData;

        const arcSegs = pathData.filter(seg => seg.type === 'G2' || seg.type === 'G3');
        // 圓弧的圓心與半徑只算一次 (原本每次比對都重新計算)
        const arcInfos = [];
        arcSegs.forEach(arc => {
            const c = findArcCenter(arc.from, arc.to, arc.I, arc.J, arc.R, arc.type === 'G2');
            if (!c) return;
            arcInfos.push({ cx: c.x, cy: c.y, r: Math.sqrt((arc.from.x - c.x)**2 + (arc.from.y - c.y)**2) });
        });
        const nearAnyArc = (a, b) => {
            for (let k = 0; k < arcInfos.length; k++) {
                const ai = arcInfos[k];
                if (Math.abs(Math.sqrt((a.x - ai.cx)**2 + (a.y - ai.cy)**2) - ai.r) < 0.5 ||
                    Math.abs(Math.sqrt((b.x - ai.cx)**2 + (b.y - ai.cy)**2) - ai.r) < 0.5) return true;
            }
            return false;
        };
        const toolDia = parseFloat(document.getElementById('toolDiaInput')?.value) || 3.175;
        const tabWidth = toolDia + 6;
        const R = tabWidth / 2;

        const result = [];
        let currentRun = [];

        const flushRun = () => {
            if (currentRun.length === 0) return;

            const uniqueZ = [...new Set(currentRun.map(s => parseFloat(s.to.z.toFixed(4))))].sort((a, b) => b - a);
            const Z_deepest = uniqueZ[uniqueZ.length - 1];

            let stepdown = 1.5; 
            if (uniqueZ.length >= 2) {
                stepdown = Math.abs(uniqueZ[uniqueZ.length - 1] - uniqueZ[uniqueZ.length - 2]);
            } else if (uniqueZ.length === 1) {
                stepdown = Math.max(1.0, Math.min(3.0, Math.abs(Z_deepest) * 0.5)); 
            }
            stepdown = Math.max(1.0, Math.min(3.0, stepdown)); 

            const finalPassSegs = currentRun.filter(s => Math.abs(s.to.z - Z_deepest) < 0.01);

            if (finalPassSegs.length > 0) {
                const candidateSegs = [];
                finalPassSegs.forEach(seg => {
                    if (seg.type === 'G1') {
                        const dx = seg.to.x - seg.from.x;
                        const dy = seg.to.y - seg.from.y;
                        const len = Math.sqrt(dx * dx + dy * dy);
                        if (len > tabWidth + 1.0) {
                            candidateSegs.push({
                                seg: seg,
                                len: len,
                                midpoint: {
                                    x: (seg.from.x + seg.to.x) / 2,
                                    y: (seg.from.y + seg.to.y) / 2,
                                    z: (seg.from.z + seg.to.z) / 2
                                }
                            });
                        }
                    }
                });

                candidateSegs.sort((a, b) => b.len - a.len);

                const tabs = [];
                const minDistanceBetweenTabs = 20.0;

                for (const cand of candidateSegs) {
                    const ptMid = { ...cand.midpoint };
                    const L = cand.len;
                    const u1 = 0.5 - R / L;
                    const u2 = 0.5 + R / L;

                    const pt1 = {
                        x: cand.seg.from.x + u1 * (cand.seg.to.x - cand.seg.from.x),
                        y: cand.seg.from.y + u1 * (cand.seg.to.y - cand.seg.from.y)
                    };
                    const pt2 = {
                        x: cand.seg.from.x + u2 * (cand.seg.to.x - cand.seg.from.x),
                        y: cand.seg.from.y + u2 * (cand.seg.to.y - cand.seg.from.y)
                    };

                    const nearArc = nearAnyArc(pt1, pt2);

                    let foundSafeOffset = !nearArc;
                    if (!foundSafeOffset) {
                        const minT = R / L;
                        const maxT = 1 - R / L;
                        const span = maxT - minT;
                        
                        for (let step = 0; step <= 15; step++) {
                            const tCenter = minT + (step / 15) * span;
                            const testU1 = tCenter - R / L;
                            const testU2 = tCenter + R / L;

                            const testPt1 = {
                                x: cand.seg.from.x + testU1 * (cand.seg.to.x - cand.seg.from.x),
                                y: cand.seg.from.y + testU1 * (cand.seg.to.y - cand.seg.from.y)
                            };
                            const testPt2 = {
                                x: cand.seg.from.x + testU2 * (cand.seg.to.x - cand.seg.from.x),
                                y: cand.seg.from.y + testU2 * (cand.seg.to.y - cand.seg.from.y)
                            };

                            const testNearArc = nearAnyArc(testPt1, testPt2);

                            if (!testNearArc) {
                                ptMid.x = cand.seg.from.x + tCenter * (cand.seg.to.x - cand.seg.from.x);
                                ptMid.y = cand.seg.from.y + tCenter * (cand.seg.to.y - cand.seg.from.y);
                                foundSafeOffset = true;
                                break;
                            }
                        }
                    }

                    if (!foundSafeOffset) continue;

                    let tooClose = false;
                    for (const existing of tabs) {
                        const dist = Math.sqrt((ptMid.x - existing.x)**2 + (ptMid.y - existing.y)**2);
                        if (dist < minDistanceBetweenTabs) {
                            tooClose = true;
                            break;
                        }
                    }

                    if (!tooClose) {
                        tabs.push(ptMid);
                    }

                    if (tabs.length >= 4) break;
                }

                currentRun.forEach(seg => {
                    const isFinalPass = Math.abs(seg.to.z - Z_deepest) < 0.01;
                    if (isFinalPass && tabs.length > 0 && seg.type !== 'G2' && seg.type !== 'G3') {
                        const splitParts = splitSegmentWithTabs(seg, tabs, stepdown, R);
                        for (let k = 0; k < splitParts.length; k++) result.push(splitParts[k]);
                    } else {
                        result.push(seg);
                    }
                });
            } else {
                for (let k = 0; k < currentRun.length; k++) result.push(currentRun[k]);
            }

            currentRun = [];
        };

        pathData.forEach(seg => {
            if (seg.isStartOrEndHome || seg.type === 'G0') {
                flushRun();
                result.push(seg);
            } else {
                currentRun.push(seg);
            }
        });
        flushRun();

        const cleanResult = [];
        for (let i = 0; i < result.length; i++) {
            const cur = result[i];
            if (cur.isTab && Math.abs(cur.from.x - cur.to.x) < 1e-4 && Math.abs(cur.from.y - cur.to.y) < 1e-4 && cur.from.z > cur.to.z) {
                if (i + 1 < result.length) {
                    const next = result[i + 1];
                    if (next.isTab && Math.abs(next.from.x - next.to.x) < 1e-4 && Math.abs(next.from.y - next.to.y) < 1e-4 && next.to.z > next.from.z) {
                        if (Math.abs(cur.to.x - next.from.x) < 1e-4 && Math.abs(cur.to.y - next.from.y) < 1e-4) {
                            i++; 
                            continue; 
                        }
                    }
                }
            }
            cleanResult.push(cur);
        }

        return cleanResult;
    }

    function compileSegmentsToGcode(segments, state) {
        if (!state) {
            state = {
                lastX: null,
                lastY: null,
                lastZ: null,
                activeFeedrate: null,
                hasOutputXYFInCurrentCut: false
            };
        }

        const scale = parseFloat(document.getElementById('scaleInput').value) || 1;
        const offX = parseFloat(document.getElementById('offsetX').value) || 0;
        const offY = parseFloat(document.getElementById('offsetY').value) || 0;
        const rotRad = (parseFloat(document.getElementById('rotationInput').value) || 0) * Math.PI / 180;
        const res = parseFloat(document.getElementById('resInput').value) || 0.1;
        const cosR = Math.cos(rotRad), sinR = Math.sin(rotRad);
        const rHeight = getRetractHeight();

        const feedrateEnable = document.getElementById('feedrateEnable') && document.getElementById('feedrateEnable').checked;
        const targetFeedrate = parseFloat(document.getElementById('targetFeedrateInput').value) || 1200;
        const targetZFeedrate = parseFloat(document.getElementById('targetZFeedrateInput').value) || 400;

        const gcodeLines = [];

        segments.forEach((seg, idx) => {
            let fZ = seg.to.z;
            
            if (fZ > 0.0001) {
                fZ = rHeight;
            }

            let fX = 0, fY = 0;
            if (seg.isStartOrEndHome) {
                fX = 0; fY = 0;
            } else {
                fX = (seg.to.x * cosR - seg.to.y * sinR) * scale + offX;
                fY = (seg.to.x * sinR + seg.to.y * cosR) * scale + offY;
            }

            const dXY = state.lastX !== null ? Math.sqrt((fX - state.lastX)**2 + (fY - state.lastY)**2) : Infinity;
            
            let zChanged = false;
            if (state.lastZ === null) {
                if (seg.hasZ || Math.abs(fZ) > 1e-4) {
                    zChanged = true;
                }
            } else {
                if (Math.abs(fZ - state.lastZ) > 0.0001) {
                    zChanged = true;
                }
            }

            const isLastMove = (idx === segments.length - 1);

            if (state.lastX !== null && seg.type === 'G1' && !seg.isTab && dXY < res && !zChanged && !isLastMove) {
                return; 
            }

            if (seg.type === 'G0') {
                state.hasOutputXYFInCurrentCut = false;
            }

            let fFromX = 0, fFromY = 0;
            if (seg.isStartOrEndHome) {
                fFromX = 0; fFromY = 0;
            } else {
                fFromX = (seg.from.x * cosR - seg.from.y * sinR) * scale + offX;
                fFromY = (seg.from.x * sinR + seg.from.y * cosR) * scale + offY;
            }

            const segmentPhysicalXYChanged = state.lastX === null || Math.sqrt((fX - fFromX)**2 + (fY - fFromY)**2) > 0.0001;
            const isZOnlyMove = !segmentPhysicalXYChanged && zChanged;

            let newlineParts = [];
            newlineParts.push(seg.type);
            
            if (!isZOnlyMove) {
                newlineParts.push('X' + formatNum(fX, 4));
                newlineParts.push('Y' + formatNum(fY, 4));
            }
            
            if (zChanged) {
                newlineParts.push('Z' + formatNum(fZ, 4));
            }

            if (seg.type === 'G2' || seg.type === 'G3') {
                if (seg.I !== null || seg.J !== null) {
                    const rawI = seg.I || 0;
                    const rawJ = seg.J || 0;
                    let fI = (rawI * cosR - rawJ * sinR) * scale;
                    let fJ = (rawI * sinR + rawJ * cosR) * scale;
                    newlineParts.push('I' + formatNum(fI, 4));
                    newlineParts.push('J' + formatNum(fJ, 4));
                }
                if (seg.R !== null) {
                    let fR = seg.R * scale;
                    newlineParts.push('R' + formatNum(fR, 4));
                }
            }

            let segF = seg.f;
            if (seg.type !== 'G0') {
                const isXYMove = !isZOnlyMove && (seg.type === 'G1' || seg.type === 'G2' || seg.type === 'G3');
                
                if (isXYMove) {
                    if (!state.hasOutputXYFInCurrentCut) {
                        if (feedrateEnable) {
                            segF = targetFeedrate;
                        }
                        state.hasOutputXYFInCurrentCut = true;
                        if (state.activeFeedrate === null || Math.abs(segF - state.activeFeedrate) > 0.01) {
                            newlineParts.push('F' + formatNum(segF, 2));
                            state.activeFeedrate = segF;
                        }
                    } else {
                        if (feedrateEnable) {
                            segF = targetFeedrate;
                        }
                        if (state.activeFeedrate === null || Math.abs(segF - state.activeFeedrate) > 0.01) {
                            newlineParts.push('F' + formatNum(segF, 2));
                            state.activeFeedrate = segF;
                        }
                    }
                } else {
                    if (feedrateEnable) {
                        segF = targetZFeedrate;
                    }
                    if (segF) {
                        if (state.activeFeedrate === null || Math.abs(segF - state.activeFeedrate) > 0.01) {
                            newlineParts.push('F' + formatNum(segF, 2));
                            state.activeFeedrate = segF;
                        }
                    }
                }
            } else {
                /* G0 快速移動：僅在純走 XY 軸（Z 軸無變動）時加入 F2000 */
                const isPureXYMove = segmentPhysicalXYChanged && !zChanged;
                if (isPureXYMove) {
                    const g0Feedrate = 2000;
                    if (state.activeFeedrate === null || Math.abs(g0Feedrate - state.activeFeedrate) > 0.01) {
                        newlineParts.push('F' + formatNum(g0Feedrate, 2));
                        state.activeFeedrate = g0Feedrate;
                    }
                }
            }

            gcodeLines.push(newlineParts.join(' '));
            
            state.lastX = fX; 
            state.lastY = fY; 
            state.lastZ = fZ;
        });

        return gcodeLines;
    }

    function processAndPreview() {
        if (!originalGcode) return;
        const scale = parseFloat(document.getElementById('scaleInput').value) || 1;
        const offX = parseFloat(document.getElementById('offsetX').value) || 0;
        const offY = parseFloat(document.getElementById('offsetY').value) || 0;
        const rotRad = (parseFloat(document.getElementById('rotationInput').value) || 0) * Math.PI / 180;
        const res = parseFloat(document.getElementById('resInput').value) || 0.1;

        let pathData = parseGcode(originalGcode);
        const cosR = Math.cos(rotRad), sinR = Math.sin(rotRad);

        pathData = applyThicknessAdjustment(pathData);
        pathData = applyFeedrateAdjustment(pathData);
        pathData = applyTabsToPaths(pathData);

        if (gcodeGroup) { scene.remove(gcodeGroup); disposeObject(gcodeGroup); }
        gcodeGroup = new THREE.Group();
        // 依顏色把所有線段合併成 3 個 LineSegments (原本每段一個 Line，檔案大時會有數萬個繪製呼叫)
        const rapidVerts = [], cutVerts = [], tabVerts = [];

        let totalDist = 0, totalTime = 0, lastP = { x: 0, y: 0, z: 0 }, isF = true;

        const trans = (p, isHome) => {
            if (isHome) {
                return { x: 0, y: 0, z: p.z };
            }
            return {
                x: (p.x * cosR - p.y * sinR) * scale + offX,
                y: (p.x * sinR + p.y * cosR) * scale + offY,
                z: p.z
            };
        };

        pathData.forEach((seg, idx) => {
            const p2 = trans(seg.to, seg.isStartOrEndHome);
            const dXY = Math.sqrt((p2.x - lastP.x)**2 + (p2.y - lastP.y)**2);
            const zM = Math.abs(seg.to.z - lastP.z) > 0.0001;
            const isLast = (idx === pathData.length - 1);

            if (!isF && seg.type === 'G1' && !seg.isTab && dXY < res && !zM && !isLast) return;

            const isFirstSegmentHome = idx === 0 && (Math.abs(seg.from.x) < 1e-4 && Math.abs(seg.from.y) < 1e-4);
            const p1 = isF ? trans(seg.from, isFirstSegmentHome) : { ...lastP };
            
            let segD = 0;
            let points = [];

            if (seg.type === 'G2' || seg.type === 'G3') {
                let transI = null, transJ = null;
                if (seg.I !== null || seg.J !== null) {
                    const rawI = seg.I || 0, rawJ = seg.J || 0;
                    transI = (rawI * Math.cos(rotRad) - rawJ * Math.sin(rotRad)) * scale;
                    transJ = (rawI * Math.sin(rotRad) + rawJ * Math.cos(rotRad)) * scale;
                }
                const transR = seg.R !== null ? seg.R * scale : null;

                points = generateArcPoints(p1, p2, transI, transJ, transR, seg.type === 'G2');
                for (let i = 1; i < points.length; i++) {
                    segD += points[i].distanceTo(points[i-1]);
                }
            } else {
                points = [p1, p2];
                segD = Math.sqrt((p2.x - p1.x)**2 + (p2.y - p1.y)**2 + (p2.z - p1.z)**2);
            }

            totalDist += segD;
            if (seg.f > 0) totalTime += segD / (seg.f / 60);

            const bucket = (seg.type === 'G0') ? rapidVerts : (seg.isTab ? tabVerts : cutVerts);
            for (let i = 1; i < points.length; i++) {
                const a = points[i-1], b = points[i];
                bucket.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }

            lastP = { ...p2 }; isF = false;
        });

        [[rapidVerts, 0x3b82f6], [cutVerts, 0x10b981], [tabVerts, 0xf59e0b]].forEach(([verts, color]) => {
            if (!verts.length) return;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            gcodeGroup.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: color })));
        });

        // 根據加工路徑範圍動態調整底面格線的大小與中心位置
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        pathData.forEach(seg => {
            const p2 = trans(seg.to, seg.isStartOrEndHome);
            const p1 = trans(seg.from, seg.isStartOrEndHome);
            minX = Math.min(minX, p1.x, p2.x);
            maxX = Math.max(maxX, p1.x, p2.x);
            minY = Math.min(minY, p1.y, p2.y);
            maxY = Math.max(maxY, p1.y, p2.y);
        });

        if (isFinite(minX) && isFinite(maxX) && isFinite(minY) && isFinite(maxY)) {
            // 格線範圍必須同時涵蓋「路徑」與「座標原點」，才看得到兩者的相對位置
            minX = Math.min(minX, 0); maxX = Math.max(maxX, 0);
            minY = Math.min(minY, 0); maxY = Math.max(maxY, 0);
            const spanX = maxX - minX;
            const spanY = maxY - minY;
            const maxSpan = Math.max(spanX, spanY, 50);
            
            const rawSize = maxSpan * 1.4;
            // 確保總邊長為 100mm 的倍數，並將網格數量設定為 currentGridSize / 50，確保每一格精確為 50mm
            currentGridSize = Math.max(200, Math.ceil(rawSize / 100) * 100);
            currentGridDivisions = currentGridSize / 50;
            // 格線中心對齊 50mm 的倍數，使格線與座標原點對齊 (而不是跟著路徑中心跑)
            currentGridCenterX = Math.round(((minX + maxX) / 2) / 50) * 50;
            currentGridCenterY = Math.round(((minY + maxY) / 2) / 50) * 50;

            updateThreeGrid();
        }

        displayStats(totalTime, totalDist);
        scene.add(gcodeGroup);
        document.getElementById('downloadBtn').disabled = false;
        requestRender();
    }

    function generateGcode() {
        const lines = originalGcode.split('\n');
        let pathData = parseGcode(originalGcode);
        
        const contourRanges = [];
        let currentRange = null;

        pathData.forEach(seg => {
            const isCut = (seg.from.z < -0.001 || seg.to.z < -0.001) && seg.type !== 'G0';
            if (isCut) {
                if (!currentRange) {
                    currentRange = { start: seg.lineIdx, end: seg.lineIdx };
                    contourRanges.push(currentRange);
                } else {
                    currentRange.end = Math.max(currentRange.end, seg.lineIdx);
                    currentRange.start = Math.min(currentRange.start, seg.lineIdx);
                }
            } else {
                currentRange = null;
            }
        });

        pathData = applyThicknessAdjustment(pathData);
        pathData = applyFeedrateAdjustment(pathData);
        pathData = applyTabsToPaths(pathData);

        const processedContours = contourRanges.map(range => ({
            range: range,
            segments: []
        }));

        // 每一行 G-code 屬於哪一個輪廓 (多個範圍重疊時，取陣列中最先符合者，與原邏輯一致)
        const ownerOfLine = new Int32Array(lines.length).fill(-1);
        processedContours.forEach((pc, ci) => {
            const lo = Math.max(0, pc.range.start), hi = Math.min(lines.length - 1, pc.range.end);
            for (let l = lo; l <= hi; l++) if (ownerOfLine[l] === -1) ownerOfLine[l] = ci;
        });
        // 非輪廓線段依行號建立索引，避免每一行都掃描整個陣列
        const nonContourByLine = new Map();

        pathData.forEach(seg => {
            let mapped = false;
            if (seg.lineIdx !== undefined) {
                const ci = (seg.lineIdx >= 0 && seg.lineIdx < lines.length) ? ownerOfLine[seg.lineIdx] : -1;
                if (ci !== -1) {
                    processedContours[ci].segments.push(seg);
                    mapped = true;
                }
            }
            if (!mapped && seg.lineIdx !== undefined) {
                let arr = nonContourByLine.get(seg.lineIdx);
                if (!arr) { arr = []; nonContourByLine.set(seg.lineIdx, arr); }
                arr.push(seg);
            }
        });

        const output = [];
        let insertedHeader = false;

        const compileState = {
            lastX: null,
            lastY: null,
            lastZ: null,
            activeFeedrate: null,
            hasOutputXYFInCurrentCut: false
        };

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            let cmd = line.trim();

            let cleanCmd = cmd;
            const semiIdx = cmd.indexOf(';');
            if (semiIdx !== -1) {
                cleanCmd = cmd.substring(0, semiIdx).trim();
            }
            let strippedCmd = cleanCmd.replace(/\([^)]*\)/g, '').trim();

            if (/^(G0*20|G0*21|G0*90|G0*91)$/i.test(strippedCmd)) {
                if (!insertedHeader) {
                    output.push("G21", "G90");
                    insertedHeader = true;
                }
                continue;
            }

            if (cmd && !cmd.startsWith('(') && !cmd.startsWith(';')) {
                if (!insertedHeader) {
                    output.push("G21", "G90");
                    insertedHeader = true;
                }
            }

            const activeContour = ownerOfLine[i] !== -1 ? processedContours[ownerOfLine[i]] : null;

            if (activeContour) {
                if (i === activeContour.range.start) {
                    const compiledLines = compileSegmentsToGcode(activeContour.segments, compileState);
                    for (let k = 0; k < compiledLines.length; k++) output.push(compiledLines[k]);
                }
                continue;
            }

            const isMovementCmd = /G0|G1|G2|G3|X|Y|Z/i.test(cmd);
            if (isMovementCmd) {
                const matches = nonContourByLine.get(i) || [];
                if (matches.length > 0) {
                    const compiled = compileSegmentsToGcode(matches, compileState);
                    for (let k = 0; k < compiled.length; k++) output.push(compiled[k]);
                } else {
                    output.push(line);
                }
            } else {
                let cleanLine = line;
                if (!cmd.startsWith('(') && !cmd.startsWith(';')) {
                    let commentSuffix = "";
                    if (semiIdx !== -1) {
                        commentSuffix = cmd.substring(semiIdx);
                    }
                    let cleanedStr = strippedCmd.replace(/\bG0*20\b/gi, '')
                                                 .replace(/\bG0*21\b/gi, '')
                                                 .replace(/\bG0*90\b/gi, '')
                                                 .replace(/\bG0*91\b/gi, '')
                                                 .replace(/\s+/g, ' ')
                                                 .trim();
                    if (cleanedStr) {
                        cleanLine = cleanedStr + (commentSuffix ? ' ' + commentSuffix : '');
                    } else if (commentSuffix) {
                        cleanLine = commentSuffix;
                    } else {
                        continue;
                    }
                }
                output.push(cleanLine);
            }
        }

        if (!insertedHeader) {
            output.push("G21", "G90");
        }

        const cleanOutput = [];
        let normLast = null; // 已輸出的最後一行 (正規化後)，避免每次重複對上一行做字串處理
        for (let i = 0; i < output.length; i++) {
            const currentLine = output[i].trim();
            
            if (currentLine === "") {
                if (cleanOutput.length > 0 && normLast === "") {
                    continue; 
                }
                cleanOutput.push(output[i]);
                normLast = "";
                continue;
            }
            
            const normCurrent = currentLine.replace(/\s+/g, ' ').toUpperCase();
            
            if (normCurrent === normLast) {
                continue; 
            }
            
            cleanOutput.push(output[i]);
            normLast = normCurrent;
        }

        return cleanOutput.join('\n');
    }

    function handleImageLoad(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                refAspect = img.height / img.width;
                
                const loader = new THREE.TextureLoader();
                loader.load(e.target.result, function(texture) {
                    if (refMesh) { scene.remove(refMesh); disposeObject(refMesh); }

                    const geo = new THREE.PlaneGeometry(1, 1);
                    const mat = new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        opacity: parseFloat(document.getElementById('imgOpacityInput').value),
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });

                    refMesh = new THREE.Mesh(geo, mat);
                    refMesh.position.set(0, 0, -0.2);

                    updateImageDimensions();
                    scene.add(refMesh);
                    requestRender();

                    document.getElementById('imgControls').classList.remove('hidden');
                });
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function updateImageDimensions() {
        if (!refMesh) return;
        const width = parseFloat(document.getElementById('imgWidthInput').value) || 100;
        refMesh.scale.set(width, width * refAspect, 1);
        requestRender();
    }

    document.getElementById('fileInput').addEventListener('change', e => {
        const file = e.target.files[0]; if (!file) return;
        originalFileName = file.name.split('.').slice(0, -1).join('.');
        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('fileInfo').classList.remove('hidden');
        
        if (cameraTarget) cameraTarget.set(0, 0, 0);
        if (camera) camera.position.set(200, -200, 200);
        if (camera && cameraTarget) camera.lookAt(cameraTarget);
        requestRender();

        const r = new FileReader(); 
        r.onload = ev => { 
            let rawText = ev.target.result;
            
            if (hasG20Active(rawText)) {
                rawText = convertInchToMetric(rawText);
                document.getElementById('metricAlert').classList.remove('hidden');
            } else {
                document.getElementById('metricAlert').classList.add('hidden');
            }

            originalGcode = rawText; 

            const initialPathData = parseGcode(originalGcode);
            const detectedDepth = detectOriginalDepth(initialPathData);
            const origThickInput = document.getElementById('origThickInput');
            const targetThickInput = document.getElementById('targetThickInput');
            const targetLayersInput = document.getElementById('targetLayersInput');

            if (detectedDepth > 0) {
                origThickInput.value = detectedDepth.toFixed(4);
                targetThickInput.value = detectedDepth.toFixed(4);
                
                const detectedStepdown = detectOriginalStepdown(initialPathData);
                const calculatedLayers = Math.max(1, Math.round(detectedDepth / detectedStepdown));
                targetLayersInput.value = calculatedLayers;
            } else {
                origThickInput.value = "0";
                targetThickInput.value = "0";
                targetLayersInput.value = "12";
            }

            const detectedF = detectFirstFeedrate(initialPathData);
            document.getElementById('targetFeedrateInput').value = detectedF.toFixed(0);

            const detectedZF = detectFirstZFeedrate(initialPathData);
            document.getElementById('targetZFeedrateInput').value = detectedZF.toFixed(0);

            processAndPreview(); 
        }; 
        r.readAsText(file);
    });

    document.getElementById('imageInput').addEventListener('change', handleImageLoad);
    document.getElementById('imgWidthInput').addEventListener('input', updateImageDimensions);
    
    document.getElementById('imgOpacityInput').addEventListener('input', e => {
        const val = parseFloat(e.target.value);
        document.getElementById('opacityVal').innerText = val.toFixed(2);
        if (refMesh) {
            refMesh.material.opacity = val;
            requestRender();
        }
    });

    document.getElementById('thickEnable').addEventListener('change', e => {
        const thickControls = document.getElementById('thickControls');
        if (e.target.checked) {
            thickControls.classList.remove('hidden');
        } else {
            thickControls.classList.add('hidden');
        }
        processAndPreview(); 
    });

    document.getElementById('targetThickInput').addEventListener('input', scheduleProcess);
    document.getElementById('targetLayersInput').addEventListener('input', scheduleProcess);

    document.getElementById('feedrateEnable').addEventListener('change', e => {
        const feedrateControls = document.getElementById('feedrateControls');
        if (e.target.checked) {
            feedrateControls.classList.remove('hidden');
        } else {
            feedrateControls.classList.add('hidden');
        }
        processAndPreview(); 
    });

    document.getElementById('targetFeedrateInput').addEventListener('input', scheduleProcess);
    document.getElementById('targetZFeedrateInput').addEventListener('input', scheduleProcess);

    document.getElementById('retractEnable').addEventListener('change', e => {
        const retractControls = document.getElementById('retractControls');
        if (e.target.checked) {
            retractControls.classList.remove('hidden');
        } else {
            retractControls.classList.add('hidden');
        }
        processAndPreview(); 
    });

    document.getElementById('retractHeightInput').addEventListener('input', scheduleProcess);

    document.getElementById('tabEnable').addEventListener('change', e => {
        const tabControls = document.getElementById('tabControls');
        if (e.target.checked) {
            tabControls.classList.remove('hidden');
        } else {
            tabControls.classList.add('hidden');
        }
        processAndPreview(); 
    });

    document.getElementById('toolDiaInput').addEventListener('input', scheduleProcess);
    document.getElementById('applyBtn').addEventListener('click', processAndPreview);
    
    document.getElementById('centerBtn').addEventListener('click', () => {
        if (!originalGcode) return;
        const p = parseGcode(originalGcode), s = parseFloat(document.getElementById('scaleInput').value) || 1;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        
        p.forEach(seg => {
            if (seg.type !== 'G0') {
                minX = Math.min(minX, seg.to.x, seg.from.x); maxX = Math.max(maxX, seg.to.x, seg.from.x);
                minY = Math.min(minY, seg.to.y, seg.from.y); maxY = Math.max(maxY, seg.to.y, seg.from.y);
            }
        });
        
        if (minX === Infinity) {
            p.forEach(seg => {
                minX = Math.min(minX, seg.to.x, seg.from.x); maxX = Math.max(maxX, seg.to.x, seg.from.x);
                minY = Math.min(minY, seg.to.y, seg.from.y); maxY = Math.max(maxY, seg.to.y, seg.from.y);
            });
        }

        if (minX !== Infinity) {
            document.getElementById('offsetX').value = (-( (minX+maxX)/2 * s)).toFixed(2);
            document.getElementById('offsetY').value = (-( (minY+maxY)/2 * s)).toFixed(2);
            
            if (cameraTarget) cameraTarget.set(0, 0, 0);
            if (camera) camera.position.set(200, -200, 200);
            if (camera && cameraTarget) camera.lookAt(cameraTarget);
            requestRender();

            processAndPreview();
        }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const b = new Blob([generateGcode()], { type: 'text/plain' });
        const a = document.createElement('a'); const blobUrl = URL.createObjectURL(b); a.href = blobUrl;
        a.download = `${originalFileName}_re.gcode`; a.click();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
    });

    window.addEventListener('resize', () => {
        const c = document.getElementById('preview-container');
        camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix();
        renderer.setSize(c.clientWidth, c.clientHeight);
        requestRender();
    });

    window.onload = () => {
        initThree();
        
        const savedTheme = localStorage.getItem('gordix-theme') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        updateThemeIcon(savedTheme);
        updateThreeGrid();
        
        currentLang = localStorage.getItem('gordix-lang') || 'zh';
        updateLanguage(); 
    };
</script>
